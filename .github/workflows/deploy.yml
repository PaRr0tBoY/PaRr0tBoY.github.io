name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: ./_blog
        run: bun install
      - name: Build Astro blog
        working-directory: ./_blog
        run: bunx astro build
      - name: Index search (Pagefind)
        working-directory: ./_blog
        run: npx pagefind --site ../blog --output-subdir ../blog/pagefind 2>&1 || echo "pagefind skipped"
      - name: Generate site pages from data
        run: node scripts/generate-site.js
      - name: Assemble deployment
        run: |
          mkdir -p _site
          cp -r index.html product tools docs assets _site/ 2>/dev/null || true
          cp -r graphify-out _site/ 2>/dev/null || true
          cp -r blog _site/ 2>/dev/null || true
          cp robots.txt sitemap-main.xml sitemap-index.xml 404.html _site/ 2>/dev/null || true
          touch _site/.nojekyll
          ls -la _site/ | head -20
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
