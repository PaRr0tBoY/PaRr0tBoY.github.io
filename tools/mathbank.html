<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学题库 · MathBank</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<script>
MathJax = {
  tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']] },
  svg: { fontCache: 'global' }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
<style>
:root {
  --bg: #f8f7f4; --surface: #ffffff; --sidebar: #f2f0ec; --border: #e5e2dc;
  --text: #1c1917; --text2: #6b6560; --text3: #a8a29e;
  --navy: #1e3a5f; --navy2: #2d5a8e;
  --gs: #2563eb; --gs-bg: #eff6ff;
  --la: #d97706; --la-bg: #fffbeb;
  --red: #ef4444; --red-bg: #fef2f2;
  --amber: #f59e0b; --amber-bg: #fffbeb;
  --green: #22c55e; --green-bg: #f0fdf4;
  --sh1: 0 1px 3px rgba(0,0,0,.06); --sh2: 0 4px 12px rgba(0,0,0,.08); --sh3: 0 12px 36px rgba(0,0,0,.14);
  --r1:5px; --r2:9px; --r3:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;font-size:14px}
header{background:var(--navy);color:#fff;height:50px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.h-logo{font-family:'Lora',serif;font-size:17px;font-weight:600;display:flex;align-items:center;gap:9px;letter-spacing:-.2px}
.h-logo em{font-style:normal;font-size:20px}
.h-acts{display:flex;gap:6px}
.btn-h{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:var(--r1);padding:5px 11px;font-size:12.5px;cursor:pointer;transition:background .15s;font-family:'DM Sans',sans-serif}
.btn-h:hover{background:rgba(255,255,255,.22)}
.app{display:flex;flex:1;overflow:hidden}
/* Filter Panel */
.fp{width:220px;min-width:150px;max-width:300px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;position:relative}
.fp-inner{padding:13px 12px;overflow-y:auto;flex:1}
.fl-s{margin-bottom:18px}
.fl-l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:7px}
.sbox{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r1);background:#fff;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;transition:border-color .15s}
.sbox:focus{border-color:var(--gs)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:4px 10px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:11.5px;cursor:pointer;transition:all .15s;user-select:none;color:var(--text2)}
.chip:hover{border-color:var(--navy2);color:var(--navy2)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.gs.on{background:var(--gs);border-color:var(--gs)}
.chip.la.on{background:var(--la);border-color:var(--la)}
.ktags{display:flex;flex-wrap:wrap;gap:4px}
.ktag{padding:3px 9px;border-radius:4px;border:1px solid var(--border);background:#fff;font-size:11px;cursor:pointer;transition:all .15s;color:var(--text2)}
.ktag:hover{border-color:var(--navy2)}
.ktag.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.rh{position:absolute;right:0;top:0;width:4px;height:100%;cursor:col-resize;z-index:10;transition:background .15s}
.rh:hover,.rh.drag{background:rgba(37,99,235,.35)}
/* List Panel */
.lp{width:320px;min-width:230px;max-width:460px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:relative;transition:width .25s,min-width .25s}
.lp.coll{width:0;min-width:0;overflow:hidden}
.lt{padding:9px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:#fff;height:46px}
.lc{font-size:11.5px;color:var(--text3)}
.tacts{display:flex;gap:5px}
.bic{width:28px;height:28px;border-radius:var(--r1);border:1px solid var(--border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;color:var(--text2)}
.bic:hover{background:var(--bg);border-color:var(--navy2);color:var(--navy)}
.badd{background:var(--navy);color:#fff;border-color:var(--navy)}
.badd:hover{background:var(--navy2);border-color:var(--navy2);color:#fff}
.pl{overflow-y:auto;flex:1;padding:8px}
.card{border:1.5px solid var(--border);border-radius:var(--r2);padding:11px;margin-bottom:7px;cursor:pointer;transition:all .15s;background:#fff}
.card:hover{border-color:var(--navy2);box-shadow:var(--sh1);transform:translateY(-1px)}
.card.sel{border-color:var(--gs);background:var(--gs-bg)}
.ctop{display:flex;gap:9px;align-items:flex-start}
.cimg{width:58px;height:48px;border-radius:var(--r1);object-fit:cover;flex-shrink:0;border:1px solid var(--border)}
.cph{width:58px;height:48px;border-radius:var(--r1);background:var(--sidebar);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;color:var(--text3)}
.cinfo{flex:1;min-width:0}
.cmeta{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.badge{padding:2px 7px;border-radius:20px;font-size:10.5px;font-weight:500;line-height:1.4}
.b-gs{background:var(--gs-bg);color:var(--gs)}
.b-la{background:var(--la-bg);color:var(--la)}
.b-easy{background:var(--green-bg);color:var(--green)}
.b-med{background:var(--amber-bg);color:var(--amber)}
.b-hard{background:var(--red-bg);color:var(--red)}
.b-pend{background:var(--red-bg);color:var(--red)}
.b-prog{background:var(--amber-bg);color:var(--amber)}
.b-done{background:var(--green-bg);color:var(--green)}
.ctype{font-size:11.5px;color:var(--text2);font-weight:500;margin-bottom:3px}
.cprev{font-size:11.5px;color:var(--text2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.5}
.ctags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.ctag{padding:2px 7px;background:var(--sidebar);border-radius:3px;font-size:10.5px;color:var(--text2)}
.cdate{font-size:10.5px;color:var(--text3);margin-top:5px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:40px 16px;color:var(--text3);text-align:center}
.empty .ico{font-size:32px;margin-bottom:10px;opacity:.45}
.empty p{font-size:13.5px}
/* Detail Panel */
.dp{flex:1;display:flex;flex-direction:column;background:#fff;overflow:hidden;min-width:0}
.dt{padding:9px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;height:46px;background:#fff}
.dtl,.dtr{display:flex;align-items:center;gap:7px}
.dtc{font-size:12.5px;color:var(--text2);font-weight:500;flex:1;text-align:center}
.sdot{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:500}
.sdot::before{content:'';width:6px;height:6px;border-radius:50%}
.s-pend{background:var(--red-bg);color:var(--red)}.s-pend::before{background:var(--red)}
.s-prog{background:var(--amber-bg);color:var(--amber)}.s-prog::before{background:var(--amber)}
.s-done{background:var(--green-bg);color:var(--green)}.s-done::before{background:var(--green)}
.bedit{padding:5px 13px;border-radius:var(--r1);border:1.5px solid var(--border);background:#fff;font-size:12.5px;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;font-weight:500;color:var(--text)}
.bedit:hover{border-color:var(--gs);color:var(--gs)}
.bedit.on{background:var(--gs);color:#fff;border-color:var(--gs)}
.bdel{width:28px;height:28px;border-radius:var(--r1);border:1px solid var(--border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;color:var(--text2)}
.bdel:hover{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.dc{flex:1;overflow-y:auto;padding:16px}
.dsect{background:#fff;border:1px solid var(--border);border-radius:var(--r2);margin-bottom:13px;overflow:hidden}
.sh{padding:10px 14px;border-bottom:1px solid var(--border);font-weight:600;font-size:12.5px;color:var(--navy);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,#fafafa,#fff);cursor:pointer;user-select:none}
.sarr{transition:transform .2s;font-size:11px;color:var(--text3)}
.scoll .sarr{transform:rotate(-90deg)}
.scoll .sb{display:none}
.sb{padding:14px}
.pimg{max-width:100%;border-radius:var(--r1);margin-bottom:10px;border:1px solid var(--border)}
.ptxt{font-size:13.5px;line-height:1.75;color:var(--text)}
.angrid{display:grid;gap:10px}
.anit{border:1px solid var(--border);border-radius:var(--r1);overflow:hidden}
.anlbl{padding:5px 11px;background:var(--sidebar);font-size:11px;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.4px}
.anval{padding:9px 11px;font-size:13px;line-height:1.6;color:var(--text)}
.anval.ev{color:var(--text3);font-style:italic}
textarea.aned{width:100%;padding:9px 11px;border:none;border-top:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:13px;line-height:1.6;resize:vertical;min-height:58px;outline:none;background:#fff;display:block}
textarea.aned:focus{background:#f8fbff}
.step{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start}
.snum{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:600}
.scon{flex:1;font-size:13.5px;line-height:1.7}
textarea.ste{width:100%;min-height:110px;padding:9px;border:1px solid var(--border);border-radius:var(--r1);font-family:'DM Sans',sans-serif;font-size:13px;line-height:1.7;resize:vertical;outline:none}
textarea.ste:focus{border-color:var(--gs)}
.ogrid{display:flex;flex-direction:column;gap:11px}
.orow{display:flex;flex-direction:column;gap:5px}
.olbl{font-size:10.5px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.kpills{display:flex;flex-wrap:wrap;gap:5px}
.kpill{padding:4px 11px;background:var(--sidebar);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--text2)}
textarea.nota{width:100%;padding:9px;border:1px solid var(--border);border-radius:var(--r1);font-family:'DM Sans',sans-serif;font-size:13px;resize:vertical;min-height:65px;outline:none;line-height:1.6}
textarea.nota:focus{border-color:var(--gs)}
.fv{display:block}.fe{display:none}
.em .fv{display:none}.em .fe{display:block}
.taginput{display:flex;flex-wrap:wrap;gap:5px;padding:7px;border:1px solid var(--border);border-radius:var(--r1);min-height:38px;cursor:text;background:#fff}
.taginput:focus-within{border-color:var(--gs)}
.ti{padding:3px 7px 3px 9px;background:var(--sidebar);border-radius:20px;font-size:11.5px;display:flex;align-items:center;gap:3px;color:var(--text)}
.tix{cursor:pointer;color:var(--text3);font-size:11px;line-height:1}
.tix:hover{color:var(--red)}
.tfield{border:none;outline:none;font-size:12.5px;font-family:'DM Sans',sans-serif;flex:1;min-width:80px;background:transparent}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(15,20,40,.55);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.open{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:var(--r3);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh3);transform:translateY(18px);transition:transform .2s}
.ov.open .modal{transform:translateY(0)}
.mh{padding:16px 18px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mt{font-family:'Lora',serif;font-size:16px;font-weight:600;color:var(--navy)}
.mx{width:26px;height:26px;border-radius:50%;border:none;background:var(--sidebar);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background .15s}
.mx:hover{background:var(--border)}
.mb{padding:16px 18px}
.fg{margin-bottom:16px}
.flbl{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;display:block}
.rg{display:flex;gap:7px;flex-wrap:wrap}
.rb{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:12.5px;cursor:pointer;transition:all .15s;user-select:none;color:var(--text2);font-family:'DM Sans',sans-serif}
.rb:hover{border-color:var(--navy2)}
.rb.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabrow{display:flex;border:1px solid var(--border);border-radius:var(--r1);overflow:hidden;margin-bottom:8px}
.tabbtn{flex:1;padding:7px;border:none;background:#fff;font-size:12.5px;cursor:pointer;transition:background .15s;font-family:'DM Sans',sans-serif;color:var(--text2)}
.tabbtn.on{background:var(--navy);color:#fff}
.upl{border:2px dashed var(--border);border-radius:var(--r2);padding:18px;text-align:center;cursor:pointer;transition:all .15s;color:var(--text3);display:flex;flex-direction:column;align-items:center}
.upl:hover{border-color:var(--gs);color:var(--gs)}
.upl .ico{font-size:26px;margin-bottom:5px}
.upl p{font-size:12.5px}
.ipw{position:relative;display:inline-block;margin-top:8px}
.ipr{max-width:100%;max-height:180px;border-radius:var(--r1);border:1px solid var(--border)}
.irm{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;border:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
textarea.fta{width:100%;padding:9px;border:1px solid var(--border);border-radius:var(--r1);font-family:'DM Sans',sans-serif;font-size:13px;resize:vertical;min-height:85px;outline:none;line-height:1.6}
textarea.fta:focus{border-color:var(--gs)}
.hint{font-size:11px;color:var(--text3);margin-top:4px}
.mf{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:7px}
.bpri{padding:7px 18px;background:var(--navy);color:#fff;border:none;border-radius:var(--r1);font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;font-family:'DM Sans',sans-serif}
.bpri:hover{background:var(--navy2)}
.bsec{padding:7px 14px;background:#fff;color:var(--text2);border:1.5px solid var(--border);border-radius:var(--r1);font-size:13px;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.bsec:hover{border-color:var(--text2)}
.bgh{padding:7px 12px;background:transparent;color:var(--text3);border:none;border-radius:var(--r1);font-size:12.5px;cursor:pointer;font-family:'DM Sans',sans-serif}
.bgh:hover{color:var(--text)}
/* Confirm */
.cfmov{position:fixed;inset:0;background:rgba(15,20,40,.4);z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .15s}
.cfmov.open{opacity:1;pointer-events:all}
.cfmbox{background:#fff;border-radius:var(--r2);padding:22px;max-width:320px;width:90%;box-shadow:var(--sh3)}
.cfmt{font-weight:600;font-size:15px;margin-bottom:8px}
.cfmm{font-size:13px;color:var(--text2);margin-bottom:16px;line-height:1.5}
.cfmacts{display:flex;justify-content:flex-end;gap:7px}
/* Practice */
.prac{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;align-items:center;padding:32px 20px;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease}
.prac.open{transform:translateY(0)}
.phead{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:680px;margin-bottom:24px}
.pprog{font-size:13px;color:var(--text2)}
.pcard{background:#fff;border-radius:var(--r3);width:100%;max-width:680px;padding:28px;box-shadow:var(--sh2)}
/* Toast */
.toast{position:fixed;bottom:18px;right:18px;background:var(--navy);color:#fff;padding:9px 16px;border-radius:var(--r1);font-size:12.5px;z-index:9999;transform:translateY(50px);opacity:0;transition:all .22s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
@media(max-width:700px){
  .fp{display:none}
  .lp{width:100%!important;max-width:100%}
  .dp{display:none}
  .dp.mob{display:flex;position:fixed;inset:0;z-index:300}
}
</style>
</head>
<body>
<header>
  <div class="h-logo"><em>📐</em><span>数学题库</span> MathBank</div>
  <div class="h-acts">
    <button class="btn-h" onclick="startPrac()">🎲 随机练习</button>
    <button class="btn-h" onclick="exportData()">⬆ 导出</button>
    <label class="btn-h" style="cursor:pointer">⬇ 导入<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label>
  </div>
</header>
<div class="app">
  <!-- Filter Panel -->
  <div class="fp" id="FP">
    <div class="fp-inner">
      <div class="fl-s"><div class="fl-l">搜索</div><input class="sbox" type="text" id="SI" placeholder="搜索题目、知识点…" oninput="applyF()"></div>
      <div class="fl-s"><div class="fl-l">学科</div>
        <div class="chips" id="sF">
          <div class="chip gs on" data-v="all" onclick="setSubj('all')">全部</div>
          <div class="chip gs" data-v="高数" onclick="setSubj('高数')">高数</div>
          <div class="chip la" data-v="线代" onclick="setSubj('线代')">线代</div>
        </div>
      </div>
      <div class="fl-s"><div class="fl-l">题目类型</div>
        <div class="chips" id="tF">
          <div class="chip" data-v="选择" onclick="togType('选择')">选择</div>
          <div class="chip" data-v="填空" onclick="togType('填空')">填空</div>
          <div class="chip" data-v="解答" onclick="togType('解答')">解答</div>
          <div class="chip" data-v="证明" onclick="togType('证明')">证明</div>
        </div>
      </div>
      <div class="fl-s"><div class="fl-l">难度</div>
        <div class="chips" id="dF">
          <div class="chip on" data-v="all" onclick="setDiff('all')">全部</div>
          <div class="chip" data-v="简单" onclick="setDiff('简单')">简单</div>
          <div class="chip" data-v="适中" onclick="setDiff('适中')">适中</div>
          <div class="chip" data-v="复杂" onclick="setDiff('复杂')">复杂</div>
        </div>
      </div>
      <div class="fl-s"><div class="fl-l">整理状态</div>
        <div class="chips" id="stF">
          <div class="chip on" data-v="all" onclick="setStat('all')">全部</div>
          <div class="chip" data-v="待整理" onclick="setStat('待整理')">待整理</div>
          <div class="chip" data-v="整理中" onclick="setStat('整理中')">整理中</div>
          <div class="chip" data-v="已整理" onclick="setStat('已整理')">已整理</div>
        </div>
      </div>
      <div class="fl-s"><div class="fl-l">知识点</div><div class="ktags" id="kF"></div></div>
    </div>
    <div class="rh" id="FPR"></div>
  </div>
  <!-- List Panel -->
  <div class="lp" id="LP">
    <div class="lt">
      <span class="lc" id="LC">0 道题目</span>
      <div class="tacts">
        <button class="bic" id="colBtn" onclick="togList()" title="收起">◀</button>
        <button class="bic badd" onclick="openM()" title="添加">＋</button>
      </div>
    </div>
    <div id="PL" class="pl"></div>
    <div class="rh" id="LPR"></div>
  </div>
  <!-- Detail Panel -->
  <div class="dp" id="DP">
    <div class="dt">
      <div class="dtl"><span id="DStat"></span></div>
      <div class="dtc" id="DMeta"></div>
      <div class="dtr">
        <button class="bdel" id="DelBtn" style="display:none" onclick="delP()" title="删除">🗑</button>
        <button class="bedit" id="EditBtn" style="display:none" onclick="togEdit()">编辑</button>
      </div>
    </div>
    <div class="dc" id="DC"><div class="empty"><div class="ico">🧮</div><p>选择一道题目来分析吧～</p></div></div>
  </div>
</div>

<!-- Add Modal -->
<div class="ov" id="AM">
  <div class="modal">
    <div class="mh"><div class="mt">✚ 添加新题目</div><button class="mx" onclick="closeM()">×</button></div>
    <div class="mb">
      <div class="fg">
        <label class="flbl">题目内容</label>
        <div class="tabrow">
          <button class="tabbtn on" id="tabI" onclick="swTab('img')">📷 图片</button>
          <button class="tabbtn" id="tabT" onclick="swTab('txt')">✏️ 文本</button>
        </div>
        <div id="imgA">
          <div class="upl" id="uplZ" onclick="document.getElementById('FI').click()" ondragover="dov(event)" ondragleave="dlv()" ondrop="drp(event)">
            <div class="ico">🖼</div><p>点击上传或拖拽图片</p><p style="font-size:11px;margin-top:3px">支持 JPG、PNG</p>
          </div>
          <input type="file" id="FI" accept="image/*" style="display:none" onchange="hImg(event)">
          <div id="IPW" style="display:none;margin-top:8px">

          </div>
        </div>
        <div id="txtA" style="display:none">
          <textarea class="fta" id="TI" placeholder="输入题目，支持 $LaTeX$ 公式"></textarea>
          <p class="hint">行内公式 $…$，块级公式 $$…$$</p>
        </div>
      </div>
      <div class="fg"><label class="flbl">学科</label><div class="rg" id="mSubj">
        <button class="rb on" data-v="高数" onclick="selRb('mSubj',this,'高数')">高数</button>
        <button class="rb" data-v="线代" onclick="selRb('mSubj',this,'线代')">线代</button>
      </div></div>
      <div class="fg"><label class="flbl">题目类型</label><div class="rg" id="mType">
        <button class="rb on" data-v="选择" onclick="selRb('mType',this,'选择')">选择</button>
        <button class="rb" data-v="填空" onclick="selRb('mType',this,'填空')">填空</button>
        <button class="rb" data-v="解答" onclick="selRb('mType',this,'解答')">解答</button>
        <button class="rb" data-v="证明" onclick="selRb('mType',this,'证明')">证明</button>
      </div></div>
      <div class="fg"><label class="flbl">难度</label><div class="rg" id="mDiff">
        <button class="rb" data-v="简单" onclick="selRb('mDiff',this,'简单')">简单</button>
        <button class="rb on" data-v="适中" onclick="selRb('mDiff',this,'适中')">适中</button>
        <button class="rb" data-v="复杂" onclick="selRb('mDiff',this,'复杂')">复杂</button>
      </div></div>
      <div class="fg"><label class="flbl">知识点</label>
        <div class="taginput" onclick="document.getElementById('MTI').focus()">
          <div id="MTL"></div><input class="tfield" id="MTI" placeholder="输入标签，回车添加…" onkeydown="mTK(event)">
        </div><p class="hint">回车或逗号添加标签</p>
      </div>
    </div>
    <div class="mf">
      <button class="bgh" onclick="saveDraft()">存草稿</button>
      <button class="bsec" onclick="cancelAdd()">取消</button>
      <button class="bpri" onclick="saveP()">确认添加</button>
    </div>
  </div>
</div>

<!-- Confirm -->
<div class="cfmov" id="CFM">
  <div class="cfmbox">
    <div class="cfmt" id="CFMT"></div><div class="cfmm" id="CFMM"></div>
    <div class="cfmacts"><button class="bsec" onclick="closeCfm()">取消</button><button class="bpri" onclick="doCfm()">确定</button></div>
  </div>
</div>

<!-- Practice -->
<div class="prac" id="PR">
  <div class="phead">
    <button class="bsec" onclick="closePracView()">← 返回</button>
    <div class="pprog" id="PPG"></div>
    <button class="bpri" onclick="nxtPrac()">下一题 →</button>
  </div>
  <div class="pcard" id="PC"></div>
</div>

<div class="toast" id="TST"></div>

<script>
let probs=[], selId=null, editing=false, listColl=false, cfmCb=null;
let pracQ=[], pracI=0, pracAns=false;
let mD={subj:'高数',type:'选择',diff:'适中',tags:[],img:null,mode:'img'};
let fl={q:'',subj:'all',types:[],diff:'all',stat:'all',know:[]};

// Storage
function save(){try{localStorage.setItem('mb3',JSON.stringify(probs));}catch(e){toast('⚠️ 存储不足');}}
function load(){try{const d=localStorage.getItem('mb3');if(d)probs=JSON.parse(d);}catch(e){probs=[];}}

// Status
function calcStat(p){
  const a=p.analysis;
  if(!a)return'待整理';
  const k=['known','hidden','goal','breakthrough','warnings'];
  const n=k.filter(x=>a[x]&&a[x].trim()).length;
  if(n===0)return'待整理';
  if(n===k.length&&p.steps&&p.steps.trim())return'已整理';
  return'整理中';
}

// Tags
function allTags(){const s=new Set();probs.forEach(p=>(p.knowledge||[]).forEach(t=>s.add(t)));return[...s];}
function renderKF(){
  const tags=allTags(),c=document.getElementById('kF');
  if(!tags.length){c.innerHTML='<span style="font-size:11.5px;color:var(--text3)">暂无知识点</span>';return;}
  c.innerHTML=tags.map(t=>`<div class="ktag${fl.know.includes(t)?' on':''}" onclick="togKnow('${escA(t)}')">${t}</div>`).join('');
}

// Filters
function setSubj(v){fl.subj=v;document.querySelectorAll('#sF .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));applyF();}
function togType(v){const i=fl.types.indexOf(v);i>=0?fl.types.splice(i,1):fl.types.push(v);document.querySelectorAll('#tF .chip').forEach(c=>c.classList.toggle('on',fl.types.includes(c.dataset.v)));applyF();}
function setDiff(v){fl.diff=v;document.querySelectorAll('#dF .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));applyF();}
function setStat(v){fl.stat=v;document.querySelectorAll('#stF .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));applyF();}
function togKnow(t){const i=fl.know.indexOf(t);i>=0?fl.know.splice(i,1):fl.know.push(t);renderKF();applyF();}
function applyF(){fl.q=document.getElementById('SI').value.toLowerCase();renderList();}
function filtered(){
  return probs.filter(p=>{
    if(fl.subj!=='all'&&p.subject!==fl.subj)return false;
    if(fl.types.length&&!fl.types.includes(p.type))return false;
    if(fl.diff!=='all'&&p.difficulty!==fl.diff)return false;
    const st=calcStat(p);if(fl.stat!=='all'&&st!==fl.stat)return false;
    if(fl.know.length&&!fl.know.every(k=>(p.knowledge||[]).includes(k)))return false;
    if(fl.q){const h=[p.text||'',(p.knowledge||[]).join(' '),p.subject,p.type,p.difficulty,p.notes||'',
      p.analysis?Object.values(p.analysis).join(' '):'',p.steps||''].join(' ').toLowerCase();if(!h.includes(fl.q))return false;}
    return true;
  });
}

// Render List
function renderList(){
  const f=filtered();document.getElementById('LC').textContent=`${f.length} 道题目`;
  const c=document.getElementById('PL');
  if(!f.length){c.innerHTML=`<div class="empty"><div class="ico">🔍</div><p>这里什么都没有～</p></div>`;return;}
  c.innerHTML=f.map(p=>{
    const st=calcStat(p),sc={'待整理':'pend','整理中':'prog','已整理':'done'}[st];
    const dc={'简单':'easy','适中':'med','复杂':'hard'}[p.difficulty];
    const sj=p.subject==='高数'?'gs':'la';
    const dt=new Date(p.createdAt).toLocaleDateString('zh-CN');
    const tgs=(p.knowledge||[]).slice(0,3).map(t=>`<span class="ctag">${t}</span>`).join('');
    const img=p.imageData?`<img class="cimg" src="${p.imageData}" alt="">`:`<div class="cph">${p.subject==='高数'?'∫':'∑'}</div>`;
    const pv=p.text?`<div class="cprev">${esc(p.text.slice(0,80))}${p.text.length>80?'…':''}</div>`:'';
    return`<div class="card${p.id===selId?' sel':''}" onclick="selP('${p.id}')">
      <div class="ctop">${img}<div class="cinfo">
        <div class="cmeta"><span class="badge b-${sj}">${p.subject}</span><span class="badge b-${dc}">${p.difficulty}</span><span class="badge b-${sc}">${st}</span></div>
        <div class="ctype">${p.type}题</div>${pv}
      </div></div>
      ${tgs?`<div class="ctags">${tgs}</div>`:''}
      <div class="cdate">${dt}</div>
    </div>`;
  }).join('');
}

// Render Detail
function renderDetail(id){
  const p=probs.find(x=>x.id===id);if(!p)return;
  const st=calcStat(p),sc={'待整理':'pend','整理中':'prog','已整理':'done'}[st];
  const dc={'简单':'easy','适中':'med','复杂':'hard'}[p.difficulty];
  const sj=p.subject==='高数'?'gs':'la';
  const a=p.analysis||{},em=editing?'em':'';
  const dt=new Date(p.createdAt).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
  const pills=(p.knowledge||[]).map(t=>`<span class="kpill">${t}</span>`).join('');
  document.getElementById('DStat').innerHTML=`<span class="sdot s-${sc}">${st}</span>`;
  document.getElementById('DMeta').innerHTML=`<span class="badge b-${sj}">${p.subject}</span> · ${p.type}题 · <span class="badge b-${dc}">${p.difficulty}</span>`;
  document.getElementById('EditBtn').style.display='';document.getElementById('DelBtn').style.display='';
  document.getElementById('DC').innerHTML=`
    <div class="dsect">
      <div class="sh" onclick="togS(this)"><span>📝 题目</span><span class="sarr">▼</span></div>
      <div class="sb">
        ${p.imageData?`<img src="${p.imageData}" class="pimg" alt="">`:''}
        ${p.text?`<div class="ptxt" id="PT">${esc(p.text)}</div>`:(!p.imageData?'<span style="color:var(--text3);font-size:13px">暂无内容</span>':'')}
      </div>
    </div>
    <div class="dsect ${em}" id="AS">
      <div class="sh" onclick="togS(this)"><span>🔍 思路分析</span><span class="sarr">▼</span></div>
      <div class="sb"><div class="angrid">
        ${anIt('已知条件','known',a.known)}${anIt('隐含条件','hidden',a.hidden)}
        ${anIt('目标转化','goal',a.goal)}${anIt('关键突破','breakthrough',a.breakthrough)}
        ${anIt('易错警示','warnings',a.warnings)}
      </div></div>
    </div>
    <div class="dsect ${em}" id="SS">
      <div class="sh" onclick="togS(this)"><span>📋 解题过程</span><span class="sarr">▼</span></div>
      <div class="sb">
        <div class="fv">${renderSteps(p.steps)}</div>
        <div class="fe"><textarea class="ste" id="SE" placeholder="每行一步，支持 $LaTeX$">${esc(p.steps||'')}</textarea><p class="hint">每行为一个解题步骤</p></div>
        <div style="margin-top:12px">
          <div style="font-size:10.5px;font-weight:600;color:var(--text2);margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px">方法总结</div>
          <div class="fv" style="font-size:13px;line-height:1.6">${p.summary?esc(p.summary):'<span style="color:var(--text3)">暂无总结</span>'}</div>
          <div class="fe"><textarea class="ste" id="SUM" placeholder="可选：方法总结">${esc(p.summary||'')}</textarea></div>
        </div>
      </div>
    </div>
    <div class="dsect ${em}" id="OS">
      <div class="sh" onclick="togS(this)"><span>ℹ️ 其他信息</span><span class="sarr">▼</span></div>
      <div class="sb"><div class="ogrid">
        <div class="orow"><div class="olbl">备注</div>
          <div class="fv" style="font-size:13px;line-height:1.6">${p.notes?esc(p.notes):'<span style="color:var(--text3)">暂无备注</span>'}</div>
          <div class="fe"><textarea class="nota" id="NE" placeholder="可选备注">${esc(p.notes||'')}</textarea></div>
        </div>
        <div class="orow"><div class="olbl">知识点</div>
          <div class="fv"><div class="kpills">${pills||'<span style="color:var(--text3);font-size:12px">暂无</span>'}</div></div>
          <div class="fe">
            <div class="taginput" onclick="document.getElementById('DTI').focus()">
              <div id="DTL">${(p.knowledge||[]).map(t=>`<span class="ti">${t}<span class="tix" onclick="rmDT('${escA(t)}')">×</span></span>`).join('')}</div>
              <input class="tfield" id="DTI" placeholder="添加知识点…" onkeydown="dTK(event)">
            </div>
          </div>
        </div>
        <div class="orow"><div class="olbl">创建日期</div><div style="font-size:13px;color:var(--text2)">${dt}</div></div>
      </div></div>
    </div>`;
  if(window.MathJax)setTimeout(()=>MathJax.typesetPromise([document.getElementById('DC')]),80);
}

function anIt(lbl,key,val){
  return`<div class="anit"><div class="anlbl">${lbl}</div>
    <div class="anval fv${!val?' ev':''}">${val?esc(val):'待填写…'}</div>
    <textarea class="aned fe" id="A_${key}" placeholder="${lbl}…">${esc(val||'')}</textarea>
  </div>`;
}
function renderSteps(txt){
  if(!txt||!txt.trim())return'<span style="color:var(--text3);font-size:13px">暂无解题步骤</span>';
  return txt.split('\n').filter(l=>l.trim()).map((l,i)=>`<div class="step"><div class="snum">${i+1}</div><div class="scon">${esc(l)}</div></div>`).join('');
}
function togS(h){h.closest('.dsect').classList.toggle('scoll');}

// Interactions
function selP(id){selId=id;editing=false;const eb=document.getElementById('EditBtn');eb.textContent='编辑';eb.classList.remove('on');renderList();renderDetail(id);}
function togEdit(){
  editing=!editing;const eb=document.getElementById('EditBtn');
  if(editing){eb.textContent='保存';eb.classList.add('on');}
  else{saveEdits();eb.textContent='编辑';eb.classList.remove('on');}
  if(selId)renderDetail(selId);
}
function saveEdits(){
  if(!selId)return;const p=probs.find(x=>x.id===selId);if(!p)return;
  p.analysis=p.analysis||{};
  ['known','hidden','goal','breakthrough','warnings'].forEach(k=>{const el=document.getElementById(`A_${k}`);if(el)p.analysis[k]=el.value;});
  const se=document.getElementById('SE');if(se)p.steps=se.value;
  const sm=document.getElementById('SUM');if(sm)p.summary=sm.value;
  const ne=document.getElementById('NE');if(ne)p.notes=ne.value;
  const dtl=document.getElementById('DTL');
  if(dtl)p.knowledge=[...dtl.querySelectorAll('.ti')].map(s=>s.childNodes[0].textContent.trim());
  save();renderKF();renderList();toast('✅ 已保存');
}
function delP(){
  if(!selId)return;
  cfm('删除题目','确定要删除这道题目吗？此操作不可撤销。',()=>{
    probs=probs.filter(p=>p.id!==selId);selId=null;editing=false;save();renderKF();renderList();
    document.getElementById('DC').innerHTML=`<div class="empty"><div class="ico">🧮</div><p>选择一道题目来分析吧～</p></div>`;
    document.getElementById('DStat').innerHTML='';document.getElementById('DMeta').innerHTML='';
    document.getElementById('EditBtn').style.display='none';document.getElementById('DelBtn').style.display='none';
    toast('🗑 题目已删除');
  });
}

// Panel
function togList(){listColl=!listColl;const lp=document.getElementById('LP'),cb=document.getElementById('colBtn');lp.classList.toggle('coll',listColl);cb.textContent=listColl?'▶':'◀';cb.title=listColl?'展开列表':'收起列表';}

// Resize
function setupRH(hid,pid){
  const h=document.getElementById(hid),p=document.getElementById(pid);let sx,sw;
  h.addEventListener('mousedown',e=>{sx=e.clientX;sw=p.offsetWidth;h.classList.add('drag');
    const mv=e=>{const nw=sw+(e.clientX-sx),mn=parseInt(getComputedStyle(p).minWidth)||150,mx=parseInt(getComputedStyle(p).maxWidth)||500;p.style.width=Math.min(mx,Math.max(mn,nw))+'px';};
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);h.classList.remove('drag');};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);e.preventDefault();
  });
}

// Modal
function openM(){
  mD={subj:'高数',type:'选择',diff:'适中',tags:[],img:null,mode:'img'};
  if(fl.subj!=='all')mD.subj=fl.subj;if(fl.types.length===1)mD.type=fl.types[0];if(fl.diff!=='all')mD.diff=fl.diff;
  document.getElementById('TI').value='';document.getElementById('FI').value='';
  document.getElementById('IPW').style.display='none';document.getElementById('uplZ').style.display='flex';
  document.getElementById('MTL').innerHTML='';document.getElementById('MTI').value='';
  ['mSubj','mType','mDiff'].forEach(id=>document.querySelectorAll(`#${id} .rb`).forEach(b=>b.classList.remove('on')));
  document.querySelector(`#mSubj [data-v="${mD.subj}"]`).classList.add('on');
  document.querySelector(`#mType [data-v="${mD.type}"]`).classList.add('on');
  document.querySelector(`#mDiff [data-v="${mD.diff}"]`).classList.add('on');
  swTab('img');document.getElementById('AM').classList.add('open');
}
function closeM(){document.getElementById('AM').classList.remove('open');}
function cancelAdd(){cfm('取消添加','是否取消？内容将不被保存。',()=>closeM());}
function saveDraft(){const p=buildP();p.isDraft=true;probs.unshift(p);save();renderKF();renderList();closeM();toast('📌 已保存草稿');}
function saveP(){
  const p=buildP();
  if(!p.imageData&&!p.text.trim()){toast('⚠️ 请上传图片或输入内容');return;}
  probs.unshift(p);save();renderKF();renderList();closeM();selP(p.id);toast('✅ 题目已添加');
}
function buildP(){
  return{id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2),subject:mD.subj,type:mD.type,
    difficulty:mD.diff,knowledge:[...mD.tags],imageData:mD.img||null,
    text:document.getElementById('TI').value,analysis:null,steps:'',summary:'',notes:'',createdAt:Date.now()};
}
function swTab(m){mD.mode=m;document.getElementById('imgA').style.display=m==='img'?'block':'none';document.getElementById('txtA').style.display=m==='txt'?'block':'none';document.getElementById('tabI').classList.toggle('on',m==='img');document.getElementById('tabT').classList.toggle('on',m==='txt');}
function selRb(gid,el,v){document.querySelectorAll(`#${gid} .rb`).forEach(b=>b.classList.remove('on'));el.classList.add('on');if(gid==='mSubj')mD.subj=v;if(gid==='mType')mD.type=v;if(gid==='mDiff')mD.diff=v;}
function hImg(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{mD.img=ev.target.result;showIP(ev.target.result);};r.readAsDataURL(f);}
function showIP(src){document.getElementById('IP').src=src;document.getElementById('IPW').style.display='block';document.getElementById('uplZ').style.display='none';}
function rmImg(){mD.img=null;document.getElementById('IPW').style.display='none';document.getElementById('uplZ').style.display='flex';document.getElementById('FI').value='';}
function dov(e){e.preventDefault();document.getElementById('uplZ').style.borderColor='var(--gs)';}
function dlv(){document.getElementById('uplZ').style.borderColor='var(--border)';}
function drp(e){e.preventDefault();dlv();const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/')){const r=new FileReader();r.onload=ev=>{mD.img=ev.target.result;showIP(ev.target.result);};r.readAsDataURL(f);}}
function mTK(e){if(e.key==='Enter'||e.key===','){e.preventDefault();const v=e.target.value.trim();if(v&&!mD.tags.includes(v)){mD.tags.push(v);renderMT();}e.target.value='';}}
function renderMT(){document.getElementById('MTL').innerHTML=mD.tags.map(t=>`<span class="ti">${t}<span class="tix" onclick="rmMT('${escA(t)}')">×</span></span>`).join('');}
function rmMT(t){mD.tags=mD.tags.filter(x=>x!==t);renderMT();}
function dTK(e){if(e.key==='Enter'||e.key===','){e.preventDefault();const v=e.target.value.trim();if(v){const dtl=document.getElementById('DTL');const ex=[...dtl.querySelectorAll('.ti')].map(s=>s.childNodes[0].textContent.trim());if(!ex.includes(v)){const sp=document.createElement('span');sp.className='ti';sp.innerHTML=`${v}<span class="tix" onclick="this.parentElement.remove()">×</span>`;dtl.appendChild(sp);}}e.target.value='';}}
function rmDT(t){const dtl=document.getElementById('DTL');if(!dtl)return;dtl.querySelectorAll('.ti').forEach(s=>{if(s.childNodes[0].textContent.trim()===t)s.remove();});}

// Export/Import
function exportData(){const bl=new Blob([JSON.stringify(probs,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=`mathbank_${new Date().toISOString().slice(0,10)}.json`;a.click();toast('✅ 导出成功');}
function importData(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!Array.isArray(d))throw 0;cfm('导入题目',`将导入 ${d.length} 道题目，覆盖现有数据？`,()=>{probs=d;save();renderKF();renderList();toast(`✅ 已导入 ${d.length} 道`);});}catch{toast('❌ 导入失败');}};
  r.readAsText(f);e.target.value='';
}

// Practice
function startPrac(){
  const f=filtered();if(!f.length){toast('⚠️ 请先筛选出要练习的题目');return;}
  pracQ=[...f].sort(()=>Math.random()-.5);pracI=0;pracAns=false;
  document.getElementById('PR').classList.add('open');renderPrac();
}
function renderPrac(){
  const p=pracQ[pracI];document.getElementById('PPG').textContent=`${pracI+1} / ${pracQ.length}`;
  const sj=p.subject==='高数'?'gs':'la',dc={'简单':'easy','适中':'med','复杂':'hard'}[p.difficulty];
  const kps=(p.knowledge||[]).map(t=>`<span class="kpill">${t}</span>`).join('');
  document.getElementById('PC').innerHTML=`
    <div style="display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap">
      <span class="badge b-${sj}">${p.subject}</span><span class="badge b-${dc}">${p.difficulty}</span><span style="font-size:13px;color:var(--text2)">${p.type}题</span>
    </div>
    ${kps?`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px">${kps}</div>`:''}
    ${p.imageData?`<img src="${p.imageData}" style="max-width:100%;border-radius:8px;margin-bottom:14px;border:1px solid var(--border)">`:''}
    ${p.text?`<div style="font-size:15px;line-height:1.75;margin-bottom:20px">${esc(p.text)}</div>`:''}
    ${pracAns?renderPAns(p):`<button class="bpri" onclick="showAns()" style="width:100%;padding:10px">查看解题过程</button>`}`;
  if(window.MathJax)setTimeout(()=>MathJax.typesetPromise([document.getElementById('PC')]),80);
}
function renderPAns(p){
  return`<div style="border-top:1px solid var(--border);padding-top:16px;margin-top:8px">
    <div style="font-weight:600;font-size:13px;color:var(--navy);margin-bottom:12px">解题步骤</div>
    ${p.steps?renderSteps(p.steps):'<span style="color:var(--text3);font-size:13px">暂无步骤</span>'}
    ${p.summary?`<div style="margin-top:14px;padding:11px;background:var(--sidebar);border-radius:8px;font-size:13px;line-height:1.6">${esc(p.summary)}</div>`:''}
  </div>`;
}
function showAns(){pracAns=true;renderPrac();}
function nxtPrac(){pracI++;if(pracI>=pracQ.length){closePracView();toast('🎉 练习完成！');return;}pracAns=false;renderPrac();}
function closePracView(){document.getElementById('PR').classList.remove('open');}

// Confirm
function cfm(title,msg,cb){document.getElementById('CFMT').textContent=title;document.getElementById('CFMM').textContent=msg;cfmCb=cb;document.getElementById('CFM').classList.add('open');}
function doCfm(){closeCfm();if(cfmCb)cfmCb();}
function closeCfm(){document.getElementById('CFM').classList.remove('open');}

// Toast
let tt;
function toast(msg){const el=document.getElementById('TST');el.textContent=msg;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2500);}

// Utils
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escA(s){return s.replace(/'/g,"\\'");}
function uid(){return'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);}

// Sample data
