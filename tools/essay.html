  <style>
:root {
  --bg: #f5f2ea;
  --surface: #fffdf7;
  --surface-2: #ece7db;
  --text: #2f2d28;
  --muted: #6f6a5e;
  --faint: #9a9384;
  --border: #ddd6c6;
  --accent: #3f6b52;
  --accent-soft: #e3ede5;
  --warn: #a4552a;
  --radius: 10px;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1d1b;
    --surface: #242624;
    --surface-2: #2c2f2c;
    --text: #e8e4d9;
    --muted: #a8a294;
    --faint: #7d786b;
    --border: #383b37;
    --accent: #8fbf9f;
    --accent-soft: #2b3a2f;
    --warn: #d08a5a;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.65 -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
}

button, input, select, textarea { font: inherit; color: inherit; }

.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 1.25rem;
  padding: 0.7rem 1.5rem;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}

.brand { font-weight: 600; letter-spacing: 0.01em; }
.brand small { display: block; font-weight: 400; font-size: 12px; color: var(--faint); }

nav { display: flex; gap: 0.25rem; }

nav button {
  border: 0; background: none; padding: 0.4rem 0.7rem; border-radius: 6px;
  color: var(--muted); cursor: pointer;
}
nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.topbar .spacer { flex: 1; }

.countdown { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.countdown strong { color: var(--text); font-size: 16px; }

main { max-width: 1180px; margin: 0 auto; padding: 1.5rem; }

h1 { font-size: 20px; margin: 0 0 0.25rem; font-weight: 600; }
h2 { font-size: 15px; margin: 1.5rem 0 0.6rem; font-weight: 600; color: var(--muted); }
p.lede { margin: 0 0 1rem; color: var(--muted); }

.bar {
  display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;
  padding: 0.75rem 0; border-bottom: 1px solid var(--border); margin-bottom: 1rem;
}

select, input[type="search"], input[type="text"] {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 7px; padding: 0.35rem 0.55rem;
}
input[type="search"]:focus, select:focus, input[type="text"]:focus { outline: 2px solid var(--accent-soft); }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 7px; padding: 2px; }
.seg button {
  border: 0; background: none; padding: 0.3rem 0.7rem; border-radius: 5px;
  color: var(--muted); cursor: pointer; font-size: 13px;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 1.25rem; align-items: start; }

.slot-block { margin-bottom: 1.25rem; }
.slot-head { display: flex; align-items: baseline; gap: 0.6rem; margin: 0 0 0.4rem; }
.slot-head h3 { font-size: 14px; margin: 0; font-weight: 600; }
.slot-head span { font-size: 12px; color: var(--faint); }

.option {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.75rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 0.6rem 0.8rem; margin-bottom: 0.4rem; cursor: pointer;
}
.option:hover { border-color: var(--accent); }
.option[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

.option .en { font-size: 14px; }
.option .zh { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.option .meta { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.35rem; }
.option .side { display: flex; flex-direction: column; align-items: flex-end; gap: 0.3rem; }

.chip {
  font-size: 11px; padding: 1px 6px; border-radius: 4px;
  background: var(--surface-2); color: var(--muted); white-space: nowrap;
}
.chip.must { background: var(--accent-soft); color: var(--accent); }
.chip.avoid { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); }

.var { color: var(--accent); font-weight: 600; }

.tally { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.star { border: 0; background: none; cursor: pointer; font-size: 15px; color: var(--faint); padding: 0; }
.star[data-on="true"] { color: var(--accent); }

.panel {
  position: sticky; top: 70px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1rem; max-height: calc(100vh - 100px); overflow: auto;
}
.panel h3 { margin: 0 0 0.5rem; font-size: 14px; }
.panel .empty { color: var(--faint); font-size: 13px; }
.panel label { display: block; font-size: 12px; color: var(--muted); margin: 0.6rem 0 0.2rem; }
.panel input[type="text"] { width: 100%; }

.preview {
  margin-top: 0.8rem; padding: 0.7rem; border-radius: 8px;
  background: var(--surface-2); font-size: 14px; line-height: 1.7;
}
.preview .blank { color: var(--faint); }

.note { font-size: 12.5px; color: var(--warn); margin-top: 0.4rem; }
.src { font-size: 11px; color: var(--faint); margin-top: 0.6rem; }

.paper {
  background: #fffdf7; color: #34332f;
  border: 1px solid var(--border); border-radius: 4px;
  padding: 1.5rem 1.75rem; font-family: Georgia, "Times New Roman", serif; font-size: 15px; line-height: 1.9;
}
.paper .row { display: grid; grid-template-columns: 34px 1fr; gap: 0.5rem; }
.paper .row.blank { color: #b3aa96; }
.paper .row .n { font-family: var(--mono); font-size: 11px; color: #b3aa96; padding-top: 4px; }
.paper .row[role="button"] { cursor: pointer; border-radius: 3px; }
.paper .row[role="button"]:hover { background: #f4efe2; }
.paper-slot { font-family: var(--sans); font-size: 11px; color: #a09a8b; margin-right: 4px; }
.paper .var { color: #8a5a2b; }

.review {
  max-width: 760px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.4rem 1.6rem;
}
.review-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.9rem; }
.review-zh { color: var(--muted); font-size: 15px; min-height: 3em; margin: 0 0 0.8rem; }
.review-en { font-family: Georgia, "Times New Roman", serif; font-size: 18px; line-height: 1.8; margin-bottom: 0.8rem; }
.review-hint { color: var(--faint); font-size: 13px; min-height: 3em; margin-bottom: 0.8rem; }

.tree { font-size: 13px; }
.tree .group { margin-bottom: 0.6rem; }
.tree .group > .label { font-weight: 600; margin-bottom: 0.2rem; }
.tree ul { list-style: none; margin: 0; padding-left: 1rem; border-left: 1px solid var(--border); }
.tree li { padding: 1px 0; color: var(--muted); font-size: 12.5px; }

.grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.75rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.9rem 1rem; }
.card .num { font-size: 26px; font-variant-numeric: tabular-nums; }
.card .cap { font-size: 12px; color: var(--muted); }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .panel { position: static; max-height: none; }
}

.practice-grid { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 1.25rem; align-items: start; }
.draft {
  width: 100%; min-height: 420px; padding: 1rem 1.1rem;
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
  font: 15px/1.8 Georgia, "Times New Roman", serif; resize: vertical;
}
.slot-pick {
  border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.75rem;
  margin-bottom: 0.7rem; background: var(--surface);
}
.slot-pick-head { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
.slot-pick-head select { max-width: 62%; padding: 0.15rem 0.3rem; }
.slot-pick-preview { font-size: 13px; color: var(--muted); margin: 0.4rem 0; }
.slot-vars { display: grid; gap: 0.3rem; margin-bottom: 0.4rem; }
.slot-vars label { display: grid; grid-template-columns: 84px 1fr; gap: 0.4rem; align-items: center; font-size: 12px; color: var(--muted); }
.slot-vars input { padding: 0.22rem 0.4rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); }
.qpick { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 1rem; }
.check ul { margin: 0.3rem 0 0.6rem; padding-left: 1.2rem; }
.check .warn { color: var(--warn); }
.compare { margin-top: 1.2rem; border-top: 1px solid var(--border); padding-top: 1rem; }
.essay-text { font-family: Georgia, "Times New Roman", serif; font-size: 15px; line-height: 1.8; }
.chart-data { border-collapse: collapse; font-size: 13px; margin: 0.5rem 0; }
.chart-data caption { text-align: left; color: var(--muted); padding-bottom: 4px; }
.chart-data th, .chart-data td { border: 1px solid var(--border); padding: 3px 8px; text-align: right; }
.chart-data th:first-child { text-align: left; }
.chart-data tfoot td { color: var(--muted); font-size: 12px; }
.src-list { font-size: 12px; color: var(--muted); margin: 0.4rem 0 0; padding-left: 1.4rem; }
.practice-head { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.topic-words { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; margin: 0.4rem 0 0.9rem; }

.sheet {
  width: 100%; max-width: 1040px; aspect-ratio: 420 / 297;
  background: #fffdf7; color: #2b2a26; border: 1px solid var(--border);
  padding: 5.5% 8%; font-family: Georgia, "Times New Roman", serif; font-size: 13px;
  line-height: 25.5pt; overflow: hidden;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(25.5pt - 1px), #ddd6c6 calc(25.5pt - 1px), #ddd6c6 25.5pt);
  background-origin: content-box;
  background-clip: content-box;
}
.sheet-lines { white-space: pre-wrap; }

@media (max-width: 900px) {
  .practice-grid { grid-template-columns: 1fr; }
}

@media print {
  @page { size: A3 landscape; margin: 0; }
  .topbar, .bar, h2, .lede { display: none !important; }
  body { background: #fff; }
  .sheet { width: 100%; height: 100vh; max-width: none; border: 0; aspect-ratio: auto; }
}

 to her major and a waste of time. By contrast, the other maintains that attending such lectures is highly beneficial nonetheless."],"variables":[],"notes":[],"examples":[],"memorize":"unknown","sourcePage":77},{"id":"big_g_picture_desc_dialog_opt2","essayTypes":["picture","mixed"],"paragraph":1,"slot":"picture_desc","slotLabel":"图画描述","variant":"一幅图·对话型（例2022）","label":"组合（直述）","tag":"直接引语 + By contrast","en":["The girl on the left says, \"The lecture is not related to our major, which is a waste of time.\" By contrast, the girl on the right answers, \"It will be beneficial nonetheless.\""],"zh":["左边的女孩说：“这个讲座和我们的专业无关，是浪费时间。”相比之下，右边的女孩回答：“但仍然会有所收获。”（直述）"],"template":["The girl on the left says, \"The lecture is not related to our major, which is a waste of time.\" By contrast, the girl on the right answers, \"It will be beneficial nonetheless.\""],"variables":[],"notes":["注：推荐转述。人物对话往往十分简洁，直接翻译会显得文章低级。"],"examples":[],"memorize":"unknown","sourcePage":77},{"id":"big_g_picture_desc_double_opt1","essayTypes":["picture","mixed"],"paragraph":1,"slot":"picture_desc","slotLabel":"图画描述","variant":"两幅图（例2020）","label":"组合","tag":"left/right 对比 + However","en":["The cartoons provide us with a thought-provoking scene: the girl in the left picture is fully focused on her homework, thinking that she will feel relieved when she finishes her work. However in the right picture, the boy is lying on the sofa, telling himself that he will not start until the deadline."],"zh":["漫画为我们呈现了一个发人深省的场景：左边的女孩全神贯注地做着作业，心想只要完成任务就会感到轻松。而右边的男孩却躺在沙发上，告诉自己要等到最后期限才开始。（转述）"],"template":["The cartoons provide us with a thought-provoking scene: the girl in the left picture is fully focused on her homework, thinking that she will feel relieved when she finishes her work. However in the right picture, the boy is lying on the sofa, telling himself that he will not start until the deadline."],"variables":[],"notes":["公式：左图主体+主要动作（一般现在时或一般进行时）. 关联词，右图主体+主要动作（一般现在时或一般进行时）."],"examples":[],"memorize":"unknow ","label":"例2023 英一","tag":"To begin with / Secondly / Last but not least 列举","en":["To begin with, about the duties, the selected candidates will assist in Prof. Smith's conducting surveys, collecting and analyzing data of students’ sports activities on campus.","Secondly, about the requirements, the candidates should be enthusiastic about sports and have sound organization, communication and planning skills.","Last but not least, this project will allow you to contribute to the development of campus sports while gaining valuable experience in research."],"zh":["首先，关于职责，被选中的候选人将协助史密斯教授进行调查，收集和分析学生在校园内的体育活动数据。","其次，关于要求，候选人应热衷于体育运动，并具有良好的组织、沟通和策划能力。","最后但同样重要的是，这个项目将使您能够为校园体育的发展做出贡献，同时获得宝贵的研究经验。"],"template":["To begin with, about the duties, the selected candidates will assist in Prof. Smith's conducting surveys, collecting and analyzing data of students’ sports activities on campus.","Secondly, about the requirements, the candidates should be enthusiastic about sports and have sound organization, communication and planning skills.","Last but not least, this project will allow you to contribute to the development of campus sports while gaining valuable experience in research."],"variables":[],"notes":[],"examples":[],"memorize":"unknown","sourcePage":30},{"id":"small_d_notice_agenda_p2_content_tail_opt1","essayTypes":["small"],"paragraph":2,"slot":"content","slotLabel":"具体内容","variant":"通知·第二段尾补充","label":"","tag":"祈使句·时间安排","en":["Please arrange your time in advance and attend the activity on time."],"zh":["请各位成员提前安排好时间，准时参加活动。"],"template":["Please arrange your time in advance and attend the activity on time."],"variables":[],"notes":["可放至第二段尾，在字数不够时使用"],"examples":[],"memorize":"unknown","sourcePage":31},{"id":"small_d_notice_agenda_p2_content_tail_opt2","essayTypes":["small"],"paragraph":2,"slot":"content","slotLabel":"具体内容","variant":"通知·第二段尾补充","label":"","tag":"祈使句·现场秩序","en":["During the activity, please abide by the on-site order and follow the arrangements of the staff."],"zh":["活动期间，请遵守现场秩序，听从工作人员的安排。"],"template":["During the activity, please abide by the on-site order and follow the arrangements of the staff."],"variables":[],"notes":["可放至第二段尾，在字数不够时使用"],"examples":[],"memorize":"unknown","sourcePage":31},{"id":"small_d_notice_agenda_p2_content_tail_opt3","essayTypes":["small"],"paragraph":2,"slot":"content","slotLabel":"具体内容","variant":"通知·第二段尾补充","label":"","tag":"祈使句·配合氛围","en":["In order to ensure the smooth progress of the activity, please actively cooperate and jointly create a good activity atmosphere."],"zh":["为了确保活动的顺利进行，请大家积极配合，共同营造良好的活动氛围。"],"template":["In order to ensure the smooth progress of the activity, please actively cooperate and jointly create a good activity atmosphere."],"variables":[],"notes":["可放至第二段尾，在字数不够时使用"],"examples":[],"memorize":"unknown","sourcePage":31},{"id":"big_e_reason_b_p2_counter_formula_procon","essayTypes":["all"],"paragraph":2,"slot":"counter","slotLabel":"争议话题","variant":"争议话题·正反论证","label":"","tag":"Proponents…However, critics…It is imperative","en":["Proponents of this trend argue that....However, critics are quick to point out its adverse consequences, such as... It is, therefore, imperative for us to adopt a discerning attitude, carefully weighing its merits against its demerits."],"zh":["该趋势的支持者认为...。然而，批评者迅速指出其不利后果，例如...。因此，我们必须采取一种有辨识力的态度，仔细权衡其利弊。"],"template":["Proponents of this trend argue that....However, critics are quick to point out its adverse consequences, such as... It is, therefore, imperative for us to adopt a discerning attitude, carefully weighing its merits against its demerits."],"variables":[],"notes":["注：省略号代表的是句子，是上述七个方案的句子或部分句子。"],"examples":[{"label":"2013 英二","en":"In fact, this issue remains controversial. On the one hand, some people hold the view that not only does a part-time job improve students’ quality of life, but it also enables them to strengthen their minds. On the other hand, the rest insist that the part-time job may have negative influences on the academic record of undergraduates. It is, therefore, imperative for us to adopt a discerning attitude, carefully weighing its merits against its demerits.","zh":"事实上，这个问题仍然存在争议。一方面，一些人认为兼职不仅能提高学生的生活质量，而且能增强他们的心智。另一方面，其他人坚持认为兼职可能会对大学生的学习成绩产生负面影响。因此，我们必须采取一种有辨识力的态度，仔细权衡其利弊。"}],"memorize":"unknown","sourcePage":59},{"id":"big_e_reason_b_p2_counter_formula_view","essayTypes":["all"],"paragraph":2,"slot":"counter","slotLabel":"争议话题","variant":"争议话题·正反论证","label":"","tag":"On the one hand…On the other hand…Nevertheless","en":["On the one hand, some people hold the view that…On the other hand, the rest insist that…Nevertheless, when we are confronted with 主题词, we should be sensible enough to discard the dross and select the essence."],"zh":["一方面，一些人认为…另一方面，剩下的人认为…然而当我们面对主题词，我们应该取其精华去其糟粕。"],"template":["On the one hand, some people hold the view that…On the other hand, the rest insist that…Nevertheless, when we are confronted with {{topic}}, we should be sensible enough to discard the dross and select the essence."],"variables":[{"name":"topic","type":"topic"}],"notes":["注：省略号代表的是句子，是上述七个方案的句子或部分句子。"],"examples":[{"label":"2009 英一","en":"Every situation has its pros and cons, and this issue is not exempt. On the one hand, some people hold the view that the popularity of the Internet plays a crucial role in communication and information gathering across various areas. On the other hand, the rest insist that Internet addiction may undermine the mental and physical health of teenagers and youngsters. Nevertheless, when we are confronted with the Internet, we should be sensible enough to discard the dross and select the essence.","zh":"每种情况都有其利弊，这个问题也不例外。一方面，一些人认为互联网的普及在各个领域之间的交流和信息收集方面起着至关重要的作用。另一方面，另一些人坚持认为网瘾可能会对青少年的身心健康造成伤害。然而，当我们面对互联网时，我们应该明智地去其糟粕，取其精华。"}],"memorize":"unknown","sourcePage":58},{"id":"big_e_reason_b_p2_counter_transition","essayTypes":["all"],"paragraph":2,"slot":"counter","slotLabel":"争议话题","variant":"争议话题·替换过渡句","label":"","tag":"过渡句替换 pros and cons / When it comes to","en":["Every situation has its pros and cons, and this issue/phenomenon is not exempt.","In fact, this issue/ phenomenon remains controversial.","When it comes to..., opinions vary widely."],"zh":["每种情况都有其利弊，这个问题/现象也不例外","事实上，这个现象仍有争议。","涉及某问题/现象时，意见分歧很大。"],"template":["Every situation has its pros and cons, and this issue/phenomenon is not exempt.","In fact, this issue/ phenomenon remains controversial.","When it comes to {{topic}}, opinions vary widely."],"variables":[{"name":"topic","type":"topic"}],"notes":["第一步：替换引入原因分析的过渡句"],"examples":[],"memorize":"unknown","sourcePage":58},{"id":"big_d_reason_a_p2_reason_masses","essayTypes":["all"],"paragraph":2,"slot":"reason","slotLabel":"原因","variant":"方案二：宾语从句+定语从句（群众路线）","label":"方案二","tag":"宾语从句 + which 非限定性定语从句","en":["The majority of individuals maintain that team spirit will provide them with a broader platform to develop themselves, which may put them in a beneficial position in the future.","team spirit will create more opportunities for them to develop themselves, which is likely to secure a competitive edge in the future."],"zh":["大多数人认为团队合作精神会给他们提供一个用于发展自己的更加宽广的平台，这让他们在未来处于一个有利的位置。","团队精神会为他们创造更多发展自己的机会，这可能会在未来获得竞争优势。"],"template":["The majority of {{actor}} maintain that {{topic}} will provide them with a broader platform to {{benefit}}, which may put them in a beneficial position in the future.","{{topic}} will create more opportunities for them to {{benefit}}, which is likely to secure a competitive edge in the future."],"variables":[{"name":"actor","type":"actor"},{"name":"benefit","type":"aspect"},{"name":"topic","type":"topic"}],"notes":["注1：believe 可替换为maintain 坚持认为/hold the view 持有观点/ are convinced 深信不疑","注2：provide them with a broader platform 提供一个更广阔的平台可替换为present them with a unique chance 提供一个独特的机会/ create more opportunities for them 创造更多的机会","注3：which may put them in a beneficial position in the future 让他们在未来处于一个有利的位置可被替换为which is likely to secure a competitive edge in the future 这有望在未来获得竞争优势等。（同学们在练习的时候可自行补充）","注1：以上例子中加粗的部分是主题词和好处，未加粗的部分万年不变。好处可参考方案三中的六大方面。","注2：which 从句的逻辑必须与主题匹配。例如个人发展用in a beneficial position/secure a competitive edge；健康生活用improve quality of life /relieve the burden；环境、社会用contribute to。"],"examples":[{"label":"2019 英二","en":"The majority of people hold that pursuing a higher degree will provide them with a broader platform to develop themselves, which may put them in a beneficial position in the future.","zh":"大多数人认为升学能够为他们提供一个更宽广的平台去发展自己，这可能会让他们在未来处于一个更有利的位置。"},{"label":"2024 英一","en":"The majority of citizens believe that infrastructure construction will improve the comfort and competitiveness of cities, which may put their city in a beneficial position in the future.","zh":"大部分市民认为基础设施建设将提高城市的舒适性和竞争力，这可能会使他们的城市在未来处于有利地位。"},{"label":"2025 英一","en":"The majority of residents believe that household appliances will provide them with great convenience, which is indispensable in their daily lives.","zh":"大部分居民相信家用电器将为他们提供极大的方便，这是他们日常生活中不可缺少的。"},{"label":"2025 英二","en":"The majority of elderly individuals believe that watching television and reading newspapers will create more opportunities for them to follow current affairs, which is indispensable in their daily lives.","zh":"大多数老年人认为看电视和读报会让他们有更多的机会紧跟时事，这在他们的日常生活中是不可或缺的。"},{"label":"2026 英一","en":"The majority of citizens believe that elderly-care robots will provide the elderly with safer and more convenient care, which may put them in a beneficial position in the future.which may relieve the pressure of aging on families and society.","zh":"大部分市民相信养老机器人将为老年人提供更安全、更便捷的照护，这可能会减轻老龄化给家庭和社会带来的压力。"},{"label":"2026 英二","en":"The majority of parents believe that outdoor activities will provide children with a broader platform to develop observation skills and physical fitness, which may put them in a beneficial position in the future.","zh":"大多数家长相信户外活动将为孩子提供一个培养观察力和体质的更宽广平台，这可能会让他们在未来处于有利位置。"}],"memorize":"unknown","sourcePage":38},{"id":"big_d_reason_a_p2_reason_masses_outdoor_variant","essayTypes":["all"],"paragraph":2,"slot":"reason","slotLabel":"原因","variant":"变体","label":"","tag":"create more opportunities + indispensable 定语从句","en":["The majority of parents believe that outdoor activities will create more opportunities for children to satisfy their curiosity and interact with nature, which is indispensable to their healthy growth."],"zh":["大多数家长相信户外活动将为孩子创造更多满足好奇心、亲近自然的机会，这对他们的健康成长不可或缺。"],"template":["The majority of parents believe that outdoor activities will create more opportunities for children to satisfy their curiosity and interact with nature, which is indispensable to their healthy growth."],"variables":[],"notes":[],"examples":[],"memorize":"unknown","sourcePage":40},{"id":"big_d_reason_a_p2_reason_masses_robot_variant","essayTypes":["all"],"paragraph":2,"slot":"reason","slotLabel":"原因","variant":"变体","label":"","tag":"create more opportunities + is likely to 宾语从句","en":["The majority of citizens believe that elderly-care robots will create more opportunities for the elderly to receive timely care, which is likely to ensure a safer and more comfortable life for them in the future."],"zh":["大部分市民相信养老机器人将为老年人创造更多及时获得照护的机会，这很可能为他们在未来保障更安全、更舒适的生活。"],"template":["The majority of citizens believe that elderly-care robots will create more opportunities for the elderly to receive timely care, which is likely to ensure a safer and more comfortable life for them in the future."],"variables":[],"notes":[],"examples":[],"memorize":"unknown","sourcePage":40},{"id":"big_d_reason_a_p2_reason_personal_example","essayTypes":["all"],"paragraph":2,"slot":"reason","slotLabel":"原因","variant":"方案一：举例论证（个人路线）","label":"方案一","tag":"举例论证 · 短语 + which 定语从句","en":["For instance, my hometown, a livable city, places a high priority on infrastructure construction, which enables residents to relax and unwind at nearby parks.","During this period, citizen satisfaction has improved."],"zh":["例如，我的家乡是一座宜居城市，高度重视基础设施建设，居民可以在附近的公园放松身心。","在此期间，市民满意度有所提高。"],"template":["For instance, my hometown, a livable city, places a high priority on infrastructure construction, which enables residents to relax and unwind at nearby parks.","During this period, citizen satisfaction has improved."],"variables":[],"notes":["注：本方案更适用于个人和社会宏观层面。"],"examples":[{"label":"2015 英一","en":"For instance, my roommate, Kevin, was addicted to the Internet, which made him fail the final exam. During that period, he regretted everything he had done.","zh":"例如，我的室友凯文沉溺于互联网，这让他没能通过期末考试。在那段时间，他后悔自己所做的一切。"},{"label":"2017 英一","en":"For instance, my roommate, Kevin, is passionate about reading, which brings him exceptional writing skills. During this period, all of us admire his capacity.","zh":"举个例子，我的室友凯文热爱读书，这给他带来了非凡的写作技巧。在那段时间，我们都很羡慕他的能力。"},{"label":"2024 英二","en":"For instance, my roommate, Kevin, is enthusiastic about attending labor practice classes, which helps him cultivate practical skills and a spirit of cooperation. Consequently, he earns the respect of our entire class.","zh":"例如，我的室友凯文热衷于参加劳动实践课，这帮助他培养了实践技能和合作精神。因此，他赢得了我们全班的尊敬。"},{"label":"2025 英二","en":"For example, my grandfather is passionate about watching television and reading newspapers, which keeps him well informed about current affairs.","zh":"例如，我的爷爷热爱看电视和读报纸，这让他能及时了解时事。"},{"label":"2026 英一","en":"For instance, a nursing home in my city is committed to improving elderly care by introducing robots, which helps reduce the risk of falls and accidents among the elderly. During this period, both the residents and their families have felt much more at ease.","zh":"例如，我所在城市的一家养老院致力于通过引入机器人改善养老服务，这有助于降低老年人跌倒和意外事故的风险。在此期间，老人及其家人都感到安心许多。"},{"label":"2026 英二","en":"For instance, my neighbor's son is passionate about outdoor activities, which helps him develop sharp observation skills and a strong body. During this period, his parents have noticed his growing curiosity about nature.","zh":"例如，我邻居的儿子热爱户外活动，这帮助他培养了敏锐的观察力和强壮的身体。在此期间，他的父母注意到他对自然的好奇心日益增强。"}],"memorize":"unknown","sourcePage":34},{"id":"big_e_reason_b_p2_reason_s3_crucial","essayTypes":["all"],"paragraph":2,"slot":"reason","slotLabel":"原因","variant":"常用短语","label":"方案三","tag":"同位语从句 + play a crucial role in","en":["Definitely no one can deny the fact that the popularity of the Internet plays a crucial role in effective communication and information collection across various areas."],"zh":["没有人能否认这个事实：互联网的流行在多个领域的有效交流和信息获取中起着至关重要的作用。"],"template":["Definitely no one can deny the fact that {{topic}} plays a crucial role in {{aspect}}."],"variables":[{"name":"aspect","type":"aspect"},{"name":"topic","type":"topic"}],"notes":["以上从句作用是拉长句子，没有必要学习三者的语法，任选三个待选句记住。","本方案的重点和难点并非这半句话，而是省略号后面怎么去写——善用短语。","主题词lay the foundation of 某方面","主题词is a driving force behind 某方面","主题词is the cornerstone of 某方面","主题词act as a catalyst for 某方面","注1：加粗部分是主题词和某方面，未加粗部分万年不变。对于图画作文，主题词很好写，其实就是市面上老师总结的热门话题，我考前也会出预测。对于图表作文，主题词的难点在于翻译图表信息，非常考验平时对日常生活用词的积累。最关键的问题在于某方面怎么写。下面提供“六大方面”，一定能用得上。","七个方案中至少掌握五个方案，方案一、三、五必须掌握，剩下两个方案大家任选。"],"examples":[{"label":"2024 英二","en":"Definitely no one can deny the fact that participating in labor practice classes plays a crucial role in personal growth.","zh":"没有人能否认：参加劳动实践课对个人成长起着至关重要的作用。"},{"label":"2025 英一","en":"There is no doubt that government subsidies on appliances are a driving force behind consumption.","zh":"毫无疑问，家用电器政府补贴是消费的推动力。"},{"label":"2025 英二","en":"There is no doubt that walking and gardening play a crucial role in the physical and mental health of the elderly.","zh":"毫无疑问，散步和养花在老年人身心健康方面扮演了重要角色。"},{"label":"2026 英一","en":"Definitely no one can deny the fact that elderly-care robots play a crucial role in improving the quality of life for the elderly.","zh":"没有人能否认：养老机器人在提高老年人生活质量方面起着至关重要的作用。"},{"label":"2026 英二","en":"Definitely no one can deny the fact that outdoor activities play a crucial role in children's physical and mental development.","zh":"没有人能否认：户外活动对儿童的身心发展起着至关重要的作用。"},{"label":"2026 英二","en":"An increasing number of parents are becoming aware that outdoor activities are indispensable to satisfying children's curiosity and developing their observational skills.","zh":"越来越多的家长开始意识到，户外活动对于满足孩子的好奇心和培养观察力是不可或缺的。"}],"memorize":"must","sourcePage":43},{"id":"big_e_reason_b_p2_reason_s3_dependent","essayTypes":["all"],"paragraph":2,"slot":"reason","slotLabel":"原因","variant":"常用短语","label":"方案三","tag":"宾语从句 + A is strongly dependent on B","en":["An increasing number of people are beginning to realize that effective communication and information collection across a range of industries are strongly dependent on the popularity of the Internet."],"zh":["越来越多的人开始意识到，一系列行业中有效的交流和信息获取都高度依赖于互联网的流行。"],"template":["An increasing number of people are beginning to realize that {{aspect}} are strongly dependent on {{topic}}."],"variables":[{"name":"aspect","type":"aspect"},{"name":"topic","type":"topic"}],"notes":["以上从句作用是拉长句子，没有必要学习三者的语法，任选三个待选句记住。","本方案的重点和难点并非这半句话，而是省略号后面怎么去写——善用短语。","注意谓语的单复数！","某方面is strongly dependent on 主题词","某方面is closely tied to 主题词","某方面is inextricably linked to 主题词","注1：加粗部分是主题词和某方面，未加粗部分万年不变。对于图画作文，主题词很好写，其实就是市面上老师总结的热门话题，我考前也会出预测。对于图表作文，主题词的难点在于翻译图表信息，非常考验平时对日常生活用词的积累。最关键的问题在于某方面怎么写。下面提供“六大方面”，一定能用得上。"],"examples":[{"label":"2024 英一","en":"A rising number of individuals are coming to the realization that a healthy lifestyle is strongly dependent on infrastructure development.","zh":"越来越多的人开始认识到，健康的生活方式在很大程度上取决于基础设施的发展。"},{"label":"2026 英一","en":"An increasing number of people are becoming aware that the safety of elderly-care robots is strongly dependent on technological advancement and strict regulation.","zh":"越来越多的人开始意识到，养老机器人的安全性在很大程度上取决于技术进步和严格监管。"}],"memorize":"must","sourcePage":43},{"id":"big_e_reason_b_p2_reason_s3_effect","essayTypes":["all"],"paragraph":2,"slot":"reason","slotLabel":"原因","variant":"常用短语","label":"方案三","tag":"主题词 + 动词 + 某方面（积极/消极搭配）","en":["主题词have a beneficial/harmful influence on 某方面","主题词bring advantages/ disadvantages in 某方面","主题词contribute significantly to 某方面","主题词may undermine 某方面","主题词pose a tremendous threat to 某方面","主题词constitute a significant menace to 某方面","主题词is seriously destructive to 某方面","主题词is a double-edged sword for 某方面"],"zh":["","","","","","","",""],"template":["{{topic}} have a beneficial/harmful influence on {{aspect}}","{{topic}} bring advantages/ disadvantages in {{aspect}}","{{topic}} contribute significantly to {{aspect}}","{{topic}} may undermine {{aspect}}","{{topic}} pose a tremendous threat to {{aspect}}","{{topic}} constitute a significant menace to {{aspect}}","{{topic}} is seriously destructive to {{aspect}}","{{topic}} is a double-edged sword for {{aspect}}"],"variables":[{"name":"aspect","type":"aspect"},{"name":"topic","type":"topic"}],"notes":["本方案的重点和难点并非这半句话，而是省略号后面怎么去写——善用短语。","注1：加粗部分是主题词和某方面，未加粗部分万年不变。对于图画作文，主题词很好写，其实就是市面上老师总结的热门话题，我考前也会出预测。对于图表作文，主题词的难点在于翻译图表信息，非常考验平时对日常生活用词的积累。最关键的问题在于某方面怎么写。下面提供“六大方面”，一定能用得上。"],"examples":[],"memorize":"must","sourcePage":42},{"id":"big_e_reason_b_p2_reason_s3_linked","essayTypes":["all"],"paragraph":2,"slot":"reason","slotLabel":"原因","variant":"常用短语","label":"方案三","tag":"There is no doubt that + A is inextricably linked to B","en":["There is no doubt that the dramatic rise in the ownership of household appliances is inextricably linked to the rapid economic growth and rising disposable incomes."],"zh":["毫无疑问，家用电器拥有量的急剧增长与经济的快速增长和可支配收入的增加有着密不可分的联系。"],"template":["There is no doubt that {{entity}} is inextricably linked to {{aspect}}."],"variables":[{"name":"aspect","type":"aspect"},{"name":"entity","type":"entity"}],"notes":["以上从句作用是拉长句子，没有必要学习三者的语法，任选三个待选句记住。","本方案的重点和难点并非这半句话，而是省略号后面怎么去写——善用短语。","某方面is strongly dependent on 主题词","某方面is closely tied to 主题词","某方面is inextricably linked to 主题词","注1：加粗部分是主题词和某方面，未加粗部分万年不变。对于图画作文，主题词很好写，其实就是市面上老师总结的热门话题，我考前也会出预测。对于图表作文，主题词的难点在于翻译图表信息，非常考验平时对日常生活用词的积累。最关键的问题在于某方面怎么写。下面提供“六大方面”，一定能用得上。"],"examples":[],"memorize":"must","sourcePage":43},{"id":"big_e_reason_b_p2_reason_s4_inversion","essayTypes":["all"],"paragraph":2,"slot":"reason","slotLabel":"原因","variant":"not only…but also…的倒装","label":"方案四","tag":"Not only 部分倒装 + but it also","en":["Not only does 主题词increase 某方面, but it also enables them to 某方面."],"zh":[""],"template":["Not only does {{topic}} increase {{aspect}}, but it also enables them to {{ability}}."],"variables":[{"name":"ability","type":"ability"},{"name":"aspect","type":"aspect"},{"name":"topic","type":"topic"}],"notes":["注1：increase 可替换为improve 改善/ enhance 提高/ promote 促进/ boost 提升/cultivate 培养/ facilitate 促进/ indicate 表明/ demonstrate 表明等","注2：enable 可替换为help 帮助/ allow 使能够/ encourage 鼓励/ deepen 加深/promote 促进/ relieve 缓解等","注：本句主语outdoor activities 为复数，用do 不用does, but also 后用their。"],"examples":[{"label":"2022 英一","en":"Not only does attending lectures increase undergraduates' academic knowledge, but it also enables them to broaden their horizons.","zh":"听讲座不仅能增加大学生的知识，还能开拓他们的眼界。"},{"label":"2023 英一","en":"Not only does attending dragon boat races improve our physical and mental health, but it also enables us to inherit and develop traditional culture.","zh":"参加龙舟比赛不仅有助于身心健康，还有助于传承和发展传统文化。"},{"label":"2024 英一","en":"Not only does constructing parks improve people's living environment, but it also encourages them to exercise.","zh":"建造公园不仅改善了人们的生活环境，还鼓励人们去锻炼身体。"},{"label":"2024 英二","en":"Not only does participating in labor practice classes improve undergraduates' physical and mental health, but it also promotes social progress.","zh":"参加劳动实践不仅能促进大学生的身心健康，还能促进社会进步。"},{"label":"2025 英一","en":"Not only does the soaring ownership of household appliances indicate a significant rise in residents' disposable income, but it also demonstrates that people place a high value on a comfortable and convenient life.","zh":"家用电器拥有量的飙升不仅表明居民可支配收入显著增加，而且表明人们重视舒适便利的生活。（与方案三融合）"},{"label":"2025 英二","en":"Not only does playing chess cultivate a positive mindset in the elderly, but it also strengthens friendship and kinship.","zh":"下棋不仅有助于老年人培养积极的心态，还能加深友情和亲情。"},{"label":"2026 英一","en":"Not only does the application of elderly-care robots improve the quality of life for the elderly, but it also relieves the burden on their families.","zh":"养老机器人的应用不仅提高了老年人的生活质量，也减轻了家人的负担。"},{"label":"2026 英二","en":"Not only do outdoor activities improve children's physical and mental health, but they also cultivate their curiosity and observational skills.","zh":"户外活动不仅改善儿童的身心健康，还培养他们的好奇心和观察力。"}],"memorize":"unknown","sourcePage":50},{"id":"big_e_reason_b_p2_reason_s5_national","essayTypes":["all"],"paragraph":2,"slot":"reason","slotLabel":"原因","variant":"虚拟语气恐吓法（国家层面）","label":"方案五","tag":"虚拟语气 if 从句（国家层面）","en":["If we underestimated the importance of Sth., our nation would permanently lag behind in the new era of rapid development."],"zh":["如果我们低估了某事的重要性，我们的国家将在快速发展的新时代永远落后。"],"template":["If we underestimated the importance of {{topic}}, our nation would permanently lag behind in the new era of rapid development."],"variables":[{"name":"topic","type":"topic"}],"notes":["第一步：写主将从现句，即主句一般将来时，从句一般现在时。","第二步：fails 变成failed, will 变成would,其他都不变，句子就变成了虚拟语气。","如果你真的对语法一窍不通，直接背住个人/社会/国家三个层面的例句：","注1:2025 年英一不适合本方案，家电很难扣帽子上高度。","注2：建议原因三采用本方案，段尾给人警醒，适用性极强。","注3：拿到题目先判断主题落在哪一层（社会/个人/国家），直接调对应句式，但别扣太狠。"],"examples":[],"memorize":"must","sourcePage":52},{"id":"big_e_reason_b_p2_reason_s5_personal","essayTypes":["all"],"paragraph":2,"slot":"reason","slotLabel":"原因","variant":"虚拟语气恐吓法（个人层面）","label":"方案五","tag":"虚拟语气 if 从句（个人层面）","en":["If we ignored the importance of Sth., we would never become a better version of ourselves."],"zh":["如果我们忽视了某事的重要性，我们就永远不会成为更好的自己。"],"template":["If we ignored the importance of {{topic}}, we would never become a better version of ourselves."],"variables":[{"name":"topic","type":"topic"}],"notes":["第一步：写主将从现句，即主句一般将来时，从句一般现在时。","第二步：fails 变成failed, will 变成would,其他都不变，句子就变成了虚拟语气。","如果你真的对语法一窍不通，直接背住个人/社会/国家三个层面的例句：","注1:2025 年英一不适合本方案，家电很难扣帽子上高度。","注2：建议原因三采用本方案，段尾给人警醒，适用性极强。","注3：拿到题目先判断主题落在哪一层（社会/个人/国家），直接调对应句式，但别扣太狠。","七个方案中至少掌握五个方案，方案一、三、五必须掌握，剩下两个方案大家任选。"],"examples":[{"label":"2023 英二","en":"If we ignored the importance of physical health, we would never become a better version of ourselves.","zh":"如果我们忽视健康的重要性，我们就永远不会成为更好的自己。"},{"label":"2024 英二","en":"If we ignored the importance of social practice, we would never discover our true potential and strength.","zh":"如果我们忽视社会实践的重要性，我们将永远无法发现自己真正的潜力和力量。（后半句改写）"},{"label":"2026 英二","en":"If children failed to engage in outdoor activities, they would never become a better version of themselves.","zh":"如果孩子们不参加户外活动，他们将永远无法成为更好的自己。"}],"memorize":"must","sourcePage":52},{"id":"big_e_reason_b_p2_reason_s5_social","essayTypes":["all"],"paragraph":2,"slot":"reason","slotLabel":"原因","variant":"虚拟语气恐吓法（社会层面）","label":"方案五","tag":"虚拟语气 if 从句（社会层面）","en":["If everyone failed to do Sth., our society would be confronted with an unpromising and fruitless future."],"zh":["如果我们每个人都没能做某事，我们的社会就没有未来。"],"template":["If everyone failed to do {{topic}}, our society would be confronted with an unpromising and fruitless future."],"variables":[{"name":"topic","type":"topic"}],"notes":["第一步：写主将从现句，即主句一般将来时，从句一般现在时。","第二步：fails 变成failed, will 变成would,其他都不变，句子就变成了虚拟语气。","如果你真的对语法一窍不通，直接背住个人/社会/国家三个层面的例句：","注1:2025 年英一不适合本方案，家电很难扣帽子上高度。","注2：建议原因三采用本方案，段尾给人警醒，适用性极强。","注3：拿到题目先判断主题落在哪一层（社会/个人/国家），直接调对应句式，但别扣太狠。"],"examples":[{"label":"2023 英一","en":"If we ignored the importance of teamwork and cooperation, our society would be confronted with an unpromising and fruitless future.","zh":"如果我们忽视团队合作的重要性，我们的社会就没有未来。"},{"label":"2024 英一","en":"If the government ignored the importance of infrastructure construction, our cities would be confronted with an unpromising and fruitless future.","zh":"如果政府忽视基础设施建设的重要性，我们的城市就没有未来。"},{"label":"2025 英二","en":"If we failed to care for the elderly, our society would become less compassionate and inclusive.","zh":"如果我们不能关爱老人，我们的社会就会变得缺乏同情心和包容性。"},{"label":"2026 英一","en":"If we ignored the importance of elderly care, our society would be confronted with an aging crisis and a less compassionate future.","zh":"如果我们忽视养老的重要性，我们的社会将面临老龄化危机和一个缺乏同情心的未来。"}],"memorize":"must","sourcePage":52},{"id":"big_e_reason_b_p2_reason_s6_compared","essayTypes":["all"],"paragraph":2,"slot":"reason","slotLabel":"原因","variant":"对比论证·公式1","label":"方案六","tag":"Compared with 对比 + so as to 结果状语","en":["Compared with B, A can 小方面, so as to 大方面."],"zh":[""],"template":["Compared with {{object}}, {{topic}} can {{ability}}, so as to {{aspect}}."],"variables":[{"name":"ability","type":"ability"},{"name":"aspect","type":"aspect"},{"name":"object","type":"object"},{"name":"topic","type":"topic"}],"notes":["注：A 是主要内容，B 是次要内容。方面依旧来自方案三中的六大方面。","so as to 结构也可以被替换为which 引导的定语从句：","Compared with simple lessons, difficult courses can improve the capacity of students, (which is) making it easier for students to expand their horizons.","推荐把which is 去掉，语法结构变为分词短语作结果状语","没有对比创造对比！"],"examples":[{"label":"2018 英一","en":"Compared with simple lessons, difficult courses can develop students' critical thinking skills, so as to expand their horizons.","zh":"与简单的课程相比，困难的课程可以培养学生的批判性思维能力，从而扩大他们的视野。"},{"label":"2019 英二","en":"Compared with employment, pursuing further education can expand their horizons, thereby promoting all-round development.","zh":"与就业相比，继续深造可以开阔视野，从而促进全面发展。"},{"label":"2024 英一","en":"Compared with commercial projects, building more parks can significantly improve the living environment for residents, thereby promoting their physical and mental well-being.","zh":"与商业项目相比，建设更多公园能显著改善居民的居住环境，从而促进他们的身心健康。"},{"label":"2026 英一","en":"Compared with traditional human care, elderly-care robots can provide 24-hour assistance, thereby relieving the burden on families and caregivers.","zh":"与传统人工照护相比，养老机器人可以提供24 小时协助，从而减轻家庭和照护者的负担。"},{"label":"2026 英二","en":"Compared with indoor activities, outdoor activities can better cultivate children's curiosity and observational skills, thereby promoting their all-round development.","zh":"与室内活动相比，户外活动能更好地培养儿童的好奇心和观察力，从而促进他们的全面发展。"}],"memorize":"unknown","sourcePage":53},{"id":"big_e_reason_b_p2_reason_s6_incontrast","essayTypes":["all"],"paragraph":2,"slot":"reason","slotLabel":"原因","variant":"对比论证·公式2","label":"方案六","tag":"In contrast to 对比 + lies in","en":["In contrast to B, the advantage of A lies in 某方面."],"zh":[""],"template":["In contrast to {{object}}, the advantage of {{topic}} lies in {{aspect}}."],"variables":[{"name":"aspect","type":"aspect"},{"name":"object","type":"object"},{"name":"topic","type":"topic"}],"notes":["注：A 是主要内容，B 是次要内容。方面依旧来自方案三中的六大方面。"],"examples":[{"label":"2018 英一","en":"In contrast to simple lessons, the advantages of difficult courses are to improve personal ability and expand our horizons.","zh":"相比于简单的课程，有难度课程的优势在于提升个人能力和开拓眼界。"},{"label":"2019 英二","en":"In contrast to employment, the advantage of pursuing further education lies in expanding our horizons and enhancing academic competence.","zh":"与就业相比，继续深造的好处是开阔视野、提高学术能力。"}],"memorize":"unknown","sourcePage":53},{"id":"big_e_reason_b_p2_reason_s7_metaphor_bridge","essayTypes":["all"],"paragraph":2,"slot":"reason","slotLabel":"原因","variant":"比喻句·暗喻","label":"方案七","tag":"暗喻 the bridge between","en":["主题词is the bridge between goals and accomplishments."],"zh":["主题词是桥梁，连接目标与成就。"],"template":["{{topic}} is the bridge between goals and accomplishments."],"variables":[{"name":"topic","type":"topic"}],"notes":["注1：不是每一篇作文都能写出比喻句，写不出来别硬套。建议背诵仿写两句，形成自己独有的比喻句。"],"examples":[{"label":"2024 英一","en":"Parks and public spaces are the bridge between urban residents and a healthy lifestyle.","zh":"公园和公共空间是连接城市居民与健康生活的桥梁。"},{"label":"2025 英二","en":"Leisure activities are the bridge between the elderly and an active, socially connected later life.","zh":"休闲活动是连接老年人与积极、有社交的晚年生活的桥梁。"},{"label":"2026 英二","en":"Outdoor activities are the bridge between children and the natural world.","zh":"户外活动是连接儿童与自然世界之间的桥梁。"}],"memorize":"know","sourcePage":55},{"id":"big_e_reason_b_p2_reason_s7_metaphor_engine","es d with the undeniable fact that the majority of consumers accept elderly-care robots, with safety as their primary concern.","zh":"我们面临着一个不可否认的事实，大多数消费者接受养老机器人，安全是他们的首要关注点。"},{"label":"2026 英二","en":"We are faced with the undeniable fact that outdoor activities have become an integral part of children's growth.","zh":"我们面临着一个不可否认的事实，户外活动已经成为儿童成长中不可或缺的一部分。"}],"memorize":"unknown","sourcePage":61},{"id":"big_f_ending_p3_summary_inversion_opt1","essayTypes":["all"],"paragraph":3,"slot":"summary","slotLabel":"总结","variant":"方案二·否定词（组）倒装","label":"方案二","tag":"否定词倒装 Never / On no account / Under no circumstances / By no means","en":["Never can we","On no account should we","Under no circumstances can we","By no means should we"],"zh":["","","",""],"template":["Never can we {{verb_phrase}}","On no account should we {{verb_phrase}}","Under no circumstances can we {{verb_phrase}}","By no means should we {{verb_phrase}}"],"variables":[{"name":"verb_phrase","type":"object"}],"notes":["总结全文即重申中心思想，第三句中的方案也可使用。句子开头需加：All in all/ To sum up / In general/ Generally speaking/ On the whole。","结构：否定词+助动词+主谓宾。看不懂没关系，记住下方组合公式，考场上只需要写出与主题相关的动词短语。","动词短语（接在上述否定词之后）：give up our efforts to... / underestimate the profound impact of... / cease our pursuit of... / doubt the importance of...","由讲义并列给出的四个句首（Never can we / On no account should we / Under no circumstances can we / By no means should we）与共同句尾组合而成。"],"examples":[{"label":"2011 英一","en":"By no means should we give up our efforts to protect the environment.","zh":"我们决不能放弃在保护环境上的努力。"},{"label":"2025 英一","en":"Under no circumstances should we cease our pursuit of a more convenient and intelligent lifestyle.","zh":"在任何情况下，我们都不应停止对更便捷、更智能生活方式的追求。"},{"label":"2025 英二","en":"Never shall we give up our efforts to ensure the well-being of senior citizens.","zh":"我们永远不会放弃为确保老年人福祉而努力。"},{"label":"2026 英一","en":"Under no circumstances should we ignore consumers' safety concerns when developing elderly-care robots.","zh":"在任何情况下，我们在开发养老机器人时都不应忽视消 :"small","subtype":"介绍信","chartKind":null,"pdfPage":35,"topicId":"topic.2024.en2"},{"id":"q.2025.en2.small","year":2025,"exam":"en2","size":"small","type":"small","subtype":"邀请信","chartKind":null,"pdfPage":36,"topicId":"topic.2025.en2"},{"id":"q.2026.en2.small","year":2026,"exam":"en2","size":"small","type":"small","subtype":"答复信","chartKind":null,"pdfPage":36,"topicId":"topic.2026.en2"}],"essays":[{"questionId":"q.2012.en2.big","source":"lecturer","label":"2.1 2012 年英二","wordCount":227,"en":"According to the figures given in the chart, the results of a survey on job satisfaction among employees of different age groups in a company are clearly presented. To be specific, the percentage of employees over 50 who are satisfied with their jobs is the highest, accounting for 40%, while those aged between 41 and 50 who are dissatisfied account for 64%. It is apparent from the statistics that employees of different ages differ noticeably in satisfaction. Several factors contribute to this phenomenon. To begin with, there is no denying that middle-aged employees play a crucial role in supporting their families, which may put them under great pressure from both work and life. What’s more, in contrast to middle-aged employees, those over 50 tend to enjoy a more stable position and a better work-life balance, so as to feel more satisfied with their jobs. Last but not least, if companies ignored the importance of improving employees’ job satisfaction, they would never retain their best talent nor achieve sustainable development. We should bear in mind that job satisfaction is of great importance to both employees and companies. For one thing, the authorities ought to make strict laws to protect employees’ rights and interests. For another, employees should learn to adjust their mindset and pursue a better work-life balance. In this way, hopefully, we may have a better future.","zh":"上方表格清晰展示了某公司不同年龄段员工工作满意度的调查结果。具体而言，50 岁以上员工对工作满意的比例最高，占40%；而41 至50 岁员工对工作不满意的比例达64%。数据表明，不同年龄员工的工作满意度差异明显。若干因素促成了这一现象。首先，毋庸置疑，中年员工在养家糊口上扮演着关键角色，这使他们承受着来自工作和生活的巨大压力。其次，与中年员工相比，50 岁以上员工往往职位更稳定、工作与生活的平衡更好，因此对工作更为满意。最后，若企业忽视提高员工工作满意度的重要性，就永远留不住最优秀的人才，也无法实现可持续发展。我们应牢记，工作满意度对员工和公司都至关重要。一方面，政府应制定严格法律来保护员工的权益；另一方面，员工应学会调整心态、追求更好的工作与生活的平衡。如此，我们有望拥有更美好的未来。","sourcePage":5},{"questionId":"q.2016.en2.big","source":"lecturer","label":"2.2 2016 年英二","wordCount":203,"en":"As is exhibited by the numbers in the chart, the purposes of students’traveling in a certain university are clearly revealed. To be specific, sightseeing accounts for 37%, the largest share, followed by relieving stress at 33%. By contrast, making friends and cultivating independence account for only 9% and 6% respectively. It is apparent from the statistics that travel offers both the pleasure of sightseeing and an escape from stress. Several factors contribute to this phenomenon. To begin with, it is widely acknowledged that college students face heavy academic pressure, which makes traveling an ideal way to relax and relieve stress. What's more, in contrast to making friends, going sightseeing enables students to get close to nature and appreciate the beautiful scenery. Last but not least, not only does traveling broaden students' horizons, but it also cultivates their independence and enriches their life experience. We should bear in mind that traveling is of great benefit to both our body and mind. For one thing, universities should organize study tours and guide students to combine travel with learning. For another, students themselves should make every effort to experience local culture and broaden their horizons. In this way, hopefully, we may have a better future.","zh":"上方饼图清晰展示了某高校学生的旅游目的。具体而言，观光游览占37%，占比最高；其次是缓解压力，占33%。相比之下，广交朋友和培养独立能力分别只占9%和6%。数据表明旅游既带来观光的乐趣，也带来压力的释放。若干因素促成了这一现象。首先，毋庸置疑，大学生面临着沉重的学业压力，这使得旅游成为放松解压的理想方式。其次，与广交朋友相比，观光游览能让学生亲近自然、欣赏美景。最后，旅游不仅能开阔学生的眼界，还能培养独立能力、丰富人生阅历。我们应牢记，旅游对身心都大有裨益。一方面，学校应组织研学旅行，引导学生把旅行与学习结合起来；另一方面，学生自己应尽力体验当地文化、开阔眼界。如此，我们有望拥有更美好的未来。","sourcePage":9},{"questionId":"q.2017.en2.big","source":"lecturer","label":"2.3 2017 年英二","wordCount":213,"en":"Referring to the statistics provided in the chart, the changes of the number of museums and their visitors in China from 2013 to 2015 can be clearly observed. To be specific, the number of museums rose from 4,165 in 2013 to 4,692 in 2015, while the number of visitors surged from 637.8 million to 781.1 million during the same period. It is apparent from the statistics that the number of museums and that of their visitors have been developing rapidly. Several factors contribute to this phenomenon. To begin with, no one can deny that the improvement of living standards enables people to pursue spiritual and cultural needs after meeting their basic needs. What’s more, the majority of people believe that visiting museums will enrich their knowledge and broaden their horizons. Last but not least, museums serve as the granary of the mind, where the public can draw nutrition from history and culture. We should bear in mind that visiting museums is of great importance to enhancing cultural literacy. For one thing, we should enhance the public’s awareness of getting close to traditional culture. For another, we ourselves should make every effort to visit museums and feel the charm of history. In this way, hopefully, we may have a better future.","zh":"参照图表中的数据，2013 至2015 年我国博物馆数量和参观人数的变化可以清楚地看到。具体而言，博物馆数量从2013 年的4165 家增至2015 年的4692家，而参观人数同期从6.378 亿人次激增至7.811 亿人次。数据表明，博物馆数量和参观人数在近年来发展迅速。若干因素促成了这一现象。首先，毋庸置疑，生活水平的提高使人们在满足基本需求后得以追求精神文化需求。其次，大多数人认为参观博物馆将为他们提供更广阔的平台来增长知识、开阔眼界，从而丰富宝贵的经验。最后，博物馆是精神的粮仓，公众可以从中汲取历史与文化的养分。我们应牢记，参观博物馆对提升文化素养至关重要。一方面，应增强公众走近传统文化的意识；另一方面，我们应尽力多参观博物馆、感受历史的魅力。如此，我们有望拥有更美好的未来。","sourcePage":13},{"questionId":"q.2022.en2.big","source":"lecturer","label":"2.4 2022 年英二","wordCount":223,"en":"According to the figures given in the chart, the changes of express delivery volume in China from 2018 to 2020 can be clearly seen. To be specific, the total volume of express packages surged from 51 billion in 2018 to 83 billion in 2020, while that of rural areas increased from 12 billion to 30 billion during the same period. It is apparent from the statistics that the express delivery industry is booming with e-commerce. Several factors contribute to this phenomenon. To begin with, there is no denying that the boom of e-commerce and the improvement of the transport system play a crucial role in the growth of the express delivery industry. What’s more, not only does the development of express delivery make people’s lives more convenient, but it also boosts consumption and drives economic growth. Last but not least, the express network serves as the capillaries of the economy, delivering goods and vitality to every corner of the country. We should bear in mind that the express delivery industry is of great importance to both our life and the economy. For one thing, the authorities ought to make continuous efforts to improve rural infrastructure and logistics networks. For another, enterprises should spare no pains to improve service quality and embrace new technologies. In this way, hopefully, we may have a better future.","zh":"根据图表中的数据，2018 至2020 年我国快递业务量的变化可以清楚地看到。具体而言，快递总件数从2018 年的510 亿件激增至2020 年的830 亿件，而农村件数同期从120 亿件增至300 亿件。数据表明，快递业随电商飞速发展。若干因素促成了这一现象。首先，毋庸置疑，电商的兴起和交通系统的完善在快递业发展中发挥着关键作用。其次，快递业的发展不仅使人们的生活更加便利，还拉动了消费、驱动了经济增长。最后，快递网络是经济的毛细血管，将商品与活力输送到祖国的每一个角落。我们应牢记，快递业对我们的生活和经济都至关重要。一方面，政府应持续完善农村基础设施和物流网络；另一方面，企业应不遗余力地提升服务质量、拥抱新技术。如此，我们有望拥有更美好的未来。","sourcePage":17},{"questionId":"q.2023.en2.big","source":"lecturer","label":"2.5 2023 年英二","wordCount":215,"en":"Referring to the statistics provided in the chart, the change of the health literacy level of Chinese residents from 2012 to 2021 can be clearly seen. To be specific, the figure rose steadily from 8.80% in 2012 to 25.40% in 2021, nearly tripling over the decade. It is apparent from the statistics that the health literacy level has been developing rapidly in recent years. Several factors contribute to this phenomenon. To begin with, it is widely acknowledged that the improvement of living standards enables people to attach more importance to their health and well-being. What’s more, the majority of people believe that improving health literacy will provide them with a broader platform to prevent diseases and enjoy a better life, which may put them in a beneficial position in the future. Last but not least, if we ignored the importance of raising health awareness, we would never build a healthy China nor enjoy a longer and healthier life. We should bear in mind that health literacy is of great significance to both individuals and society. For one thing, we should enhance the public’s awareness of adopting healthy habits. For another, we ourselves should spare no pains to take physical exercise and keep a healthy diet. In this way, hopefully, we may have a better future.","zh":"参照图表中的数据可见2012 至2021 年我国居民健康素养水平的变化。具体而言，这一数值从2012 年的8.80%稳步上升至2021 年的25.40%，十年间几乎翻了三倍。数据表明，健康素养水平在近年来发展迅速。若干因素促成了这一现象。首先，毋庸置疑，生活水平的提高使人们更加重视自身的健康与福祉。其次，大多数人认为提高健康素养将为他们提供更广阔的平台来预防疾病、享受更美好的生活，这可能使他们在未来处于有利地位。最后，若我们忽视增强健康意识的重要性，就永远无法建设健康中国，也无法享有更长更健康的人生。我们应牢记，健康素养对个人和社会都意义重大。一方面，应增强公众养成健康习惯的意识；另一方面，我们应不遗余力地锻炼身体、保持健康饮食。如此，我们有望拥有更美好的未来。","sourcePage":21},{"questionId":"q.2024.en2.big","source":"lecturer","label":"2.6 2024 年英二","wordCount":215,"en":"According to the figures given in the chart, the gains of participating in practical activities were of great diversity. To be specific, the percentages of gaining practical skills, acquiring relevant knowledge, feeling comfortable and enhancing cooperation account for 91.3%, 84.8%, 54.4% and 32.6% respectively. Especially, acquiring relevant knowledge ranks the first. It is apparent from the statistics that labor courses let students learn through practice. Several factors contribute to this phenomenon. To begin with, the majority of students believe that labor practice courses will teach them what cannot be taught by textbooks, which may put them in a beneficial position in the future. What’s more, for instance, my roommate, Kevin, is passionate about hands-on learning, which brings him practical abilities and a sense of cooperation, and this habit will surely benefit him in his future career. Last but not least, if we ignored the importance of learning through practice, we would never become a better version of ourselves. We should bear in mind that labor practice courses are of great importance to the all-round development of students. For one thing, universities should offer more practical courses and create opportunities for hands-on learning. For another, students themselves should spare no pains to put knowledge into practice. In this way, hopefully, we may have a better future.","zh":"如图所示，参加实践活动的收获多种多样。具体而言，获得实践能力、学习相关知识、心情舒畅和增强合作能力的占比分别为91.3%、84.8%、54.4%和32.6%。其中，学习相关知识位列第一。数据表明，劳动课让学生在实践中学习。若干因素促成了这一现象。首先，大多数学生认为劳动实践课能教给他们课本上学不到的东西，这或使他们在未来占据优势。其次，举例而言，我的室友凯文热衷于动手学习，这给他带来了实践能力和合作意识。最后，若我们忽视在实践中学习的重要性，就永远无法成为更好的自己。我们应牢记，劳动实践课对学生的全面发展至关重要。一方面，高校应开设更多实践课程、创造动手学习的机会；另一方面，学生自己应不遗余力地把知识付诸实践。如此，我们有望拥有更美好的未来。","sourcePage":25},{"questionId":"q.2025.en1.big","source":"lecturer","label":"2.7 2025 年英一","wordCount":231,"en":"As is exhibited by the numbers in the chart, the variation about the average ownership of major durable consumer goods per 100 households in China from 2014 to 2023 is clearly presented. To be specific, the ownership of air conditioners surged dramatically from 75.2 units in 2014 to 145.9 units in 2023, while the figures for washing machines and refrigerators rose modestly from 83.7 and 85.5 to 98.2 and 103.4 respectively. It is apparent from the statistics that the living standards of Chinese people have been developing rapidly in recent years. Several factors contribute to this phenomenon. To begin with, the majority of residents believe that household appliances will provide them with great convenience, which is indispensable in their daily life. What’s more, there is no denying that government subsidies on appliances are a driving force behind consumption. Last but not least, not only does this significant increase indicate a huge rise in residents’ disposable income, but it also demonstrates that people place a high value on a comfortable and convenient life. We should bear in mind that home appliances have become an integral part of our daily life. For one thing, the authorities ought to formulate policies to promote the development of the home appliance industry. For another, enterprises should make continuous efforts to enhance product quality and reduce prices. In this way, hopefully, we may have a better future.","zh":"上方表格提供了2014 至2023 年全国居民平均每百户主要耐用消费品拥有量的变化。具体而言，空调拥有量从2014 年的75.2 台激增至2023 年的145.9台，而洗衣机和冰箱的拥有量则分别从83.7 台和85.5 台小幅上升至98.2 台和103.4 台。数据表明，中国人民的生活水平在近年来发展迅速。若干因素促成了这一现象。首先，大多数居民认为家用电器会给他们带来极大的便利，这在其日常生活中不可或缺。其次，毋庸置疑，政府对家电的补贴是消费的一大驱动力。最后，这一显著增长不仅体现了居民可支配收入的大幅提升，也表明人们高度重视舒适便捷的生活。我们应牢记，家用电器已成为我们日常生活中不可或缺的一部分。一方面，政府应制定政策促进家电产业发展；另一方面，企业应不断努力提升产品质量、降低价格。如此，我们有望拥有更美好的未来。","sourcePage":29},{"questionId":"q.2025.en2.big","source":"lecturer","label":"2.8 2025 年英二","wordCount":222,"en":"Referring to the statistics provided in the chart, watching TV plays a dominant role in the daily leisure life of the elderly, overshadowing all other activities. To be specific, the participation rate in watching TV, taking a walk, gardening, reading and playing chess among the elderly accounts for 90.8%, 68.3%, 34.7%, 31.8% and 18.4% respectively. It is apparent from the statistics that the majority of elderly residents would choose to engage in accessible and low-intensity leisure activities. Several factors contribute to this phenomenon. To begin with, the majority of elderly individuals believe that watching television and taking walks will create more opportunities for them to relax and follow current affairs. What’s more, it is widely acknowledged that walking and gardening play a crucial role in the physical and mental health of the elderly. Last but not least, not only does playing chess exercise the brain of the elderly, but it also deepens friendship and kinship. We should bear in mind that leisure activities are of great importance to the well- being of the elderly. For one thing, we should enhance the public’s awareness of caring for the spiritual life of the elderly. For another, the elderly themselves should make every effort to step out of their homes and take part in various activities. In this way, hopefully, we may have a better future.","zh":"上方柱状图突出了看电视在老年人日常休闲生活中的主导地位，它盖过了其他所有活动。具体而言，老年人中看电视、散步、养花、阅读和下棋的参与率分别为90.8%、68.3%、34.7%、31.8%和18.4%。数据表明，大多数老年人会选择参与易上手、低强度的休闲活动。若干因素促成了这一现象。首先，大多数老年人认为看电视和散步会为他们创造更多放松身心、了解时事的机会，这在其日常生活中不可或缺。其次，毋庸置疑，散步和养花对老年人的身心健康起着关键作用。最后，下棋不仅能锻炼老年人的大脑，还能加深友情和亲情。我们应牢记，休闲活动对老年人的福祉至关重要。一方面，应增强公众关爱老年人精神生活的意识；另一方面，老年人自己应尽力走出家门、参与各种活动。如此，我们有望拥有更美好的未来。","sourcePage":33},{"questionId":"q.2026.en1.big","source":"lecturer","label":"2.9 2026 年英一","wordCount":233,"en":"According to the figures given in the chart, a pie chart and a bar chart reveal the public’s attitude toward care robots. To be specific, according to the pie chart, 39.3% of the respondents are willing to accept elderly-care robots, 32.8% remain neutral and 27.9% are unwilling. As for the bar chart, 46.3% of them list safety as their top concern, followed by price at 24.9% and convenience at 10.7%. It is apparent from the statistics that the majority of people are willing to accept care robots, while safety remains their top concern. Several factors contribute to this phenomenon. To begin with, the majority of people believe that elderly-care robots will provide them with great convenience, which is indispensable for coping with population aging. What’s more, no one can deny that the shortage of caregivers plays a crucial role in driving the development of smart elderly care. Last but not least, if we ignored the importance of ensuring the safety of care robots, we would never let the elderly enjoy a dignified old age. We should bear in mind that care robots are of great importance to both the elderly and society. For one thing, we should enhance the public’s awareness of embracing smart elderly care. For another, we ourselves should make every effort to introduce intelligent devices to ease the care-giving burden. In this way, hopefully, we may have a better future.","zh":"根据图表中的数据，饼图和柱状图揭示了公众对养老机器人的态度。具体而言，据饼图所示，39.3%的受访者愿意接受养老机器人，32.8%态度中立，27.9%不愿接受。至于柱状图，46.3%的人将安全性列为首要关注点，其次是价格（24.9%）和便利性（10.7%）。数据表明，大多数人愿意接受养老机器人，但安全性仍是他们最关心的。若干因素促成了这一现象。首先，大多数人认为养老机器人会给他们带来极大的便利，这对应对人口老龄化不可或缺。其次，毋庸置疑，照护人手的短缺在推动智慧养老发展中发挥着关键作用。最后，若我们忽视确保养老机器人安全的重要性，就永远无法让老年人享有有尊严的晚年。我们应牢记，养老机器人对老年人和社会都至关重要。一方面，应增强公众拥抱智慧养老的意识；另一方面，我们应尽力引入智能设备来减轻照护负担。如此，我们有望拥有更美好的未来。","sourcePage":37},{"questionId":"q.2007.en1.big","source":"lecturer","label":"3.1 2007 年","wordCount":202,"en":"As is symbolically depicted in the cartoon above, on the playground stand two football players, both with a worried look on their faces. The goalkeeper believes that he is too small to keep the goal, while the striker holds that the goalkeeper is too big to shoot the ball into the goal. Simple as the drawing is, it conveys a truth that self- confidence is of great importance to us all. Several factors contribute to my viewpoint. To begin with, definitely no one can deny such an obvious fact that staying confident under great pressure plays a crucial role in one's personal growth and self-improvement. What's more, in contrast to inferiority, the advantage of confidence lies in embracing challenges, seizing opportunities and ultimately realizing personal value. Last but not least, if we ignored the importance of developing self-confidence, we would never unlock our full potential nor rise to the challenges ahead. We should bear in mind that self-confidence is of great importance to both our life and study. For one thing, we should raise public awareness of the importance of self- confidence. For another, we should make every effort to build up our confidence. In this way, hopefully, we may have a wonderful future.","zh":"正如上方卡通象征性描绘的那样，操场上站着两名球员，脸上都带着担忧。守门员觉得自己太矮小、守不住球门，而射门球员则认为守门员太高太壮、难以把球射进。图画虽简单，却道出了一个真理：自信对我们每个人都至关重要。若干因素促成了我的观点。首先，毋庸置疑，在巨大压力下保持自信对个人成长与自我提升起着关键作用。其次，与自卑相比，自信的优势在于拥抱挑战、抓住机遇，并最终实现个人价值。最后，若我们忽视培养自信的重要性，就永远无法释放自己的全部潜能，也无法迎难而上。我们应牢记，自信对生活和学习都至关重要。一方面，应提高公众对自信重要性的认识；另一方面，我们应尽力建立自信。如此，我们有望拥有美好未来。believe in themselves. 家长和学校应营造一个鼓励孩子相信自己的环境）","sourcePage":41},{"questionId":"q.2009.en1.big","source":"lecturer","label":"3.2 2009 年英一","wordCount":210,"en":"As is symbolically depicted in the figure above, in a huge spider web stay a group of people, surfing the Internet, with their eyes glued to the screen. Simple as the drawing is, it conveys a truth that at no time should we underestimate the significance of using the Internet properly. Several factors contribute to this phenomenon. To begin with, there is no denying that the Internet brings great convenience to our life, enabling us to communicate with others regardless of time and place, and at an incredibly low cost. What’s more, in contrast to face-to-face interaction, online communication may drive people apart, for those who are glued to the screen tend to ignore the people around them, so as to weaken real-life relationships. Last but not least, if we indulged ourselves in the virtual world, we would never enjoy the warmth of real-life relationships nor maintain a healthy social life. We should bear in mind that the Internet is of great importance to both our life and study. For one thing, we should enhance the public’s awareness of using the Internet properly. For another, we ourselves should make every effort to strike a balance between online and face-to-face communication. In this way, hopefully, we may have a better future.","zh":"如上图所象征性描绘的，一群人被困在一张巨大的蜘蛛网里，各自沉浸在眼前的屏幕中。图画虽简单，却道出了一个真理：任何时候我们都不应低估合理用网的重要性。若干因素促成了这一现象。首先，毋庸置疑，网络给我们的生活带来了极大的便利，使我们无论何时何地都能与他人交流。其次，与面对面交流相比，网络交流可能使人们疏远，因为盯着屏幕的人往往忽略了身边的人，从而削弱现实人际关系。最后，若我们沉迷于虚拟世界，就永远无法享受现实人际关系的温暖，也无法维持健康的社交生活。我们应牢记，网络对我们的生活学习都至关重要。一方面，应增强公众合理用网的意识；另一方面，我们应尽力在线上与面对面交流之间取得平衡。如此，我们有望拥有更美好的未来。","sourcePage":46},{"questionId":"q.2014.en1.big","source":"lecturer","label":"3.3 2014 年英一","wordCount":211,"en":"The cartoons provide us with a thought-provoking scene: in the left picture, a young mother is walking hand in hand with her little daughter. Whereas in the right picture, the grown-up daughter is accompanying her aging mother. The drawing conveys a truth that utmost importance ought to be attached to filial piety. Several factors contribute to my viewpoint. To begin with, it is widely acknowledged that accompanying aging parents is not only a duty but also a traditional virtue of the Chinese nation, which brings warmth and joy to the whole family. What’s more, in contrast to abandoning the elderly, caring for them sets a good example for the young, so as to build a warm and harmonious family. Last but not least, if we neglected our aging parents, we would never enjoy a harmonious family nor a warm old age of our own. We should bear in mind that filial piety is of great importance to both our family and society. For one thing, we should enhance the public’s awareness of respecting the old and cherishing the young. For another, we ourselves should make every effort to accompany and support our aging parents. In this way, hopefully, we may have a better future.","zh":"图画给我们呈现了一幅发人深省的场景：左图中，一位年轻的母亲牵着年幼的女儿的手同行。而在右图中，长大的女儿陪伴着年迈的母亲。图画道出了一个真理：孝道应当被给予高度重视。若干因素促成了我的观点。首先，毋庸置疑，陪伴年迈父母不仅是一种责任，更是中华民族的传统美德，给整个家庭带来温暖和欢乐。其次，与遗弃老人相比，关爱老人为年轻人树立榜样，从而构建温暖和谐的家庭。最后，若我们忽视年迈的父母，就永远无法享有和谐的家庭，也无法拥有自己温暖的晚年。我们应牢记，孝道对我们的家庭和社会都至关重要。一方面，应增强公众尊老爱幼的意识；另一方面，我们应尽力陪伴、赡养年迈的父母。如此，我们有望拥有更美好的未来。","sourcePage":50},{"questionId":"q.2017.en1.big","source":"lecturer","label":"3.4 2017 年英一","wordCount":208,"en":"The cartoons provide us with a thought-provoking scene: in the left picture, a young man is lying in a chair with piles of books around him, saying that he has so many books to read. Whereas in the right picture, another young man is reading and sets a goal of finishing twenty books a year. The drawing conveys a truth that owning a book is not the same as reading it. Several factors contribute to this phenomenon. To begin with, no one can deny that taking action plays a crucial role in realizing our goals and values. What’s more, for instance, my roommate, Kevin, is passionate about reading, which expands his horizons and enriches his spiritual life, and he sets aside half an hour every evening for it. Last but not least, if we merely talked without action, we would never turn knowledge into action nor become a better version of ourselves. We should bear in mind that reading is of great importance to both our life and study. For one thing, parents and teachers should guide children to develop the habit of reading. For another, we ourselves should spare no pains to put reading plans into practice. In this way, hopefully, we may have a better future.","zh":"图画给我们呈现了一幅发人深省的场景：左图中，一个年轻人躺在椅子上，身边堆满书，说自己有好多书要读。而在右图中，另一个年轻人正在读书，并定下一年读完二十本的目标。图画道出了一个真理：拥有书不等于读懂书。若干因素促成了这一现象。首先，毋庸置疑，采取行动在实现我们的目标和价值中起着关键作用。其次，举例而言，我的室友凯文热衷于读书，这开阔了他的眼界、丰富了他的精神生活。最后，若我们只是空谈而不行动，就永远无法把知识转化为行动，也无法成为更好的自己。我们应牢记，读书对我们的生活和学习都至关重要。一方面，家长和老师应引导孩子养成读书的习惯；另一方面，我们应不遗余力地把读书计划付诸实践。如此，我们有望拥有更美好的未来。","sourcePage":54},{"questionId":"q.2023.en1.big","source":"lecturer","label":"3.5 2023 年英一","wordCount":211,"en":"As is symbolically depicted in the figure above, in front of us stand two seniors, talking about the dragon boat race. One holds that the race in their village is getting increasingly lively. The drawing conveys a truth that utmost importance ought to be attached to carrying forward traditional culture. Several factors contribute to this phenomenon. To begin with, there is no denying that the dragon boat race carries forward traditions and brings joy to people of all ages, and it attracts a growing number of participants and spectators every year, so as to strengthen the bond of the community. What’s more, the majority of people believe that celebrating traditional festivals will provide them with a platform to preserve cultural heritage, which may enhance their cultural confidence and national pride. Last but not least, if we neglected our traditional festivals, we would never enjoy cultural confidence nor national rejuvenation. We should bear in mind that traditional culture is of great importance to both our life and the nation. For one thing, we should enhance the public’s awareness of protecting cultural heritage. For another, we ourselves should make every effort to celebrate traditional festivals and carry forward traditions. In this way, hopefully, we may have a better future.","zh":"如上图所象征性描绘的，我们面前站着两位老人，正在谈论龙舟赛。其中一位说，他们村里的龙舟赛越来越热闹了。图画道出了一个真理：传承传统文化应当被给予高度重视。若干因素促成了这一现象。首先，毋庸置疑，龙舟赛传承了传统，给各年龄段的人带来了欢乐，从而增强社区的凝聚力。其次，大多数人认为庆祝传统节日能给他们提供一个保护文化遗产平台，这可能会增强他们的文化自信。最后，若我们忽视传统节日，就永远无法享有文化自信，也无法实现民族复兴。我们应牢记，传统文化对我们的生活和民族都至关重要。一方面，应增强公众保护文化遗产的意识；另一方面，我们应尽力庆祝传统节日、传承传统。如此，我们有望拥有更美好的未来。","sourcePage":58},{"questionId":"q.2024.en1.big","source":"lecturer","label":"4.1 2024 年英一","wordCount":225,"en":"The drawing on the left side provides us with a lively scene: several urban residents are exercising in a park, while a youngster says that the new park is fantastic. Referring to the statistics provided in the right chart, the number of parks in a certain city had remarkably increased from 406 in 2020 to 670 in 2022. The purpose of the drawing and the chart seems to remind us that great accomplishments have been made in the construction of public facilities. Several factors contribute to this phenomenon. To begin with, it is widely acknowledged that park construction plays a crucial role in improving the living environment and promoting physical exercise. What’s more, the majority of people believe that building more parks will provide them with green space to relax, keep fit and enjoy the beauty of nature. Last but not least, if the government ignored the importance of public facilities, our cities would never enjoy a healthy and pleasant living environment. We should bear in mind that park construction is of great importance to both our life and the city. For one thing, we should enhance the public’s awareness of keeping fit and getting close to nature. For another, we ourselves should make every effort to take physical exercise and enjoy a healthy lifestyle. In this way, hopefully, we may have a better future.","zh":"左图给我们呈现了一幅生动的画面：几位市民正在公园里锻炼，一位年轻人说新公园太棒了。再看右图的数据，某市的公园数量从2020 年的406 个显著增加到2022 年的670 个。图文似乎在提醒我们：公共设施建设已经取得了重大成就。若干因素促成了这一现象。首先，毋庸置疑，公园建设在改善生活环境和促进体育锻炼中发挥着关键作用。其次，大多数人认为修建更多公园能给他们提供绿地来放松身心、强身健体。最后，若政府忽视公共设施的重要性，我们的城市就永远无法享有健康宜居的环境。我们应牢记，公园建设对我们的生活和城市都至关重要。一方面，应增强公众健身、亲近自然的意识；另一方面，我们应尽力锻炼身体、享受健康生活方式。如此，我们有望拥有更美好的未来。","sourcePage":62},{"questionId":"q.sample.text.big","source":"lecturer","label":"5.1 文字作文大纲样题","wordCount":214,"en":"It is widely acknowledged that children today are spending more and more time on the Internet, which is often blamed for their addiction to screens. However, the author believes that children turn to technology not because they are addicted to it, but because they have been deprived of the chance to play freely with their peers. I agree with the author’s point of view. Several factors contribute to my viewpoint. To begin with, there is no denying that children are naturally eager to socialize with their peers, and when they are kept away from outdoor activities, they have no choice but to turn to the Internet. What’s more, in contrast to face-to-face interaction, online communication has become a substitute for real-life play, which is not what children truly want, so as to deepen their loneliness. Last but not least, if we merely blamed the screens without giving children back their freedom, we would never solve the problem of internet addiction. We should bear in mind that technology itself is not to blame. For one thing, parents and schools should create more opportunities for children to play freely outdoors. For another, we should guide children to use the Internet properly rather than simply forbid it. In this way, hopefully, we may have a better future.","zh":"众所周知，如今的孩子花在网络上的时间越来越多，这常被归咎为他们对屏幕的沉迷。然而，作者认为，孩子转向科技并非因为他们沉迷其中，而是因为他们被剥夺了与同龄人自由玩耍的机会。我同意作者的观点。若干因素促成了我的观点。首先，毋庸置疑，孩子天生渴望与同龄人交往，当他们被剥夺了户外活动的机会时，就只能转向网络。其次，与面对面交流相比，网络交流成了现实玩耍的替代品，而这并非孩子真正想要的，从而加深他们的孤独感。最后，若我们一味责怪屏幕却不还孩子自由，就永远无法解决网络沉迷的问题。我们应牢记，科技本身不应被责怪。一方面，家长和学校应为孩子创造更多在户外自由玩耍的机会；另一方面，我们应引导孩子合理用网，而非一味禁止。如此，我们有望拥有更美好的未来。","sourcePage":66},{"questionId":"q.2001.en1.big","missingSlots":[],"source":"derived","kind":"template","complete":false,"label":"2001 英一","wordCount":141,"en":"As is shown in the picture above, ____.\n\nIt is love and care that deserves greater attention.\n\nThree key reasons, from my perspective, account for this phenomenon.\n\nIf we underestimated the importance of love and care, our nation would permanently lag behind in the new era of rapid development.\n\nIf we ignored the importance of love and care, we would never become a better version of ourselves.\n\nIf everyone failed to do love and care, our society would be confronted with an unpromising and fruitless future.\n\nThere is no denying that further attention must be paid to the scene/phenomenon/situation/tendency mentioned above.\n\nWhen it comes to concrete solutions, some people hold that ____ must take responsibility for love and care.\n\nOnly through the joint efforts of all people can we effectively solve the problem/ have a better life/ advance social progress.","sentences":[{"slot":"picture_desc","optionId":"big_g_picture_desc_intro_opt1","values":{},"text":"As is shown in the picture above, ____."},{"slot":"picture_theme","optionId":"big_g_picture_theme_opt10","values":{"topic":"love and care"},"text":"It is love and care that deserves greater attention."},{"slot":"transition","optionId":"big_d_reason_a_p2_transition_opt1","values":{},"text":"Three key reasons, from my perspective, account f (() => {
  // assets/store.js
  var DB = "writing-desk";
  var VERSION = 1;
  var dbPromise;
  function open() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB, VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains("kv"))
            db.createObjectStore("kv");
          if (!db.objectStoreNames.contains("events")) {
            db.createObjectStore("events", { keyPath: "id", autoIncrement: true }).createIndex("optionId", "optionId");
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    return dbPromise;
  }
  async function tx(store, mode, fn) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const t = db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => resolve(req?.result);
      t.onerror = () => reject(t.error);
    });
  }
  var kv = {
    get: (key, fallback = null) => tx("kv", "readonly", (s) => s.get(key)).then((v) => v === undefined ? fallback : v),
    set: (key, value) => tx("kv", "readwrite", (s) => s.put(value, key))
  };
  async function tally(optionId, questionId = null) {
    await tx("events", "readwrite", (s) => s.add({ optionId, questionId, at: Date.now() }));
  }
  async function tallyCounts() {
    const db = await open();
    return new Promise((resolve, reject) => {
      const counts = new Map;
      const req = db.transaction("events").objectStore("events").openCursor();
      req.onsuccess = () => {
        const cur = req.result;
        if (!cur)
          return resolve(counts);
        counts.set(cur.value.optionId, (counts.get(cur.value.optionId) || 0) + 1);
        cur.continue();
      };
      req.onerror = () => reject(req.error);
    });
  }
  async function allEvents() {
    const db = await open();
    return new Promise((resolve, reject) => {
      const req = db.transaction("events").objectStore("events").getAll();
