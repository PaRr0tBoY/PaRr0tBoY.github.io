<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools — Mortalman</title>
  <meta name="description" content="Collection of web tools.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: #0d0d0d;
      color: #e4e4e7;
      min-height: 100vh;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
    a.back { color: #71717a; font-size: 0.85rem; text-decoration: none; display: inline-block; margin-bottom: 24px; }
    a.back:hover { color: #fafafa; }
    h1 { font-size: 1.75rem; font-weight: 600; color: #fafafa; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .card {
      display: block;
      padding: 16px;
      border: 1px solid #27272a;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, background 0.15s;
    }
    .card:hover { border-color: #3f3f46; background: #18181b; }
    .card .name { font-weight: 500; font-size: 0.9rem; color: #fafafa; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back">&larr; Home</a>
    <h1>Tools</h1>
    <div class="grid">
      <a href="/tools/check.html" class="card"><span class="name">Check</span></a>
      <a href="/tools/chronos.html" class="card"><span class="name">Chronos</span></a>
      <a href="/tools/datecal.html" class="card"><span class="name">DateCal</span></a>
      <a href="/tools/flowday.html" class="card"><span class="name">FlowDay</span></a>
      <a href="/tools/ganttlite.html" class="card"><span class="name">GanttLite</span></a>
      <a href="/tools/linso.html" class="card"><span class="name">LinSo</span></a>
      <a href="/tools/linsoo.html" class="card"><span class="name">LinSoo</span></a>
      <a href="/tools/lookey.html" class="card"><span class="name">Lookey</span></a>
      <a href="/tools/mathbank.html" class="card"><span class="name">MathBank</span></a>
      <a href="/tools/quadrant.html" class="card"><span class="name">Quadrant</span></a>
      <a href="/tools/resume-tool.html" class="card"><span class="name">Resume Tool</span></a>
      <a href="/tools/smartgoal.html" class="card"><span class="name">SmartGoal</span></a>
      <a href="/tools/snippy.html" class="card"><span class="name">Snippy</span></a>
      <a href="/tools/techfeed.html" class="card"><span class="name">TechFeed</span></a>
    </div>
  </div>
</body>
</html>
