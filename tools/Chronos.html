<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chronos 精算计时器</title>
    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --text-main: #FFFFFF;
            --text-dim: #3a3a3a;
            --color-safe: #00FF00;
            --color-warn: #FFD700;
            --color-danger: #FF4500;
            --modal-bg: #0a0a0a;
            --safe-area-bottom: env(safe-area-inset-bottom);
            --timer-gap: 15px;
            /* 核心间距基准 */
            --label-width: 35px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "SF Mono", "Menlo", monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.8s ease;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: calc(40px + var(--safe-area-bottom));
            overflow-y: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            z-index: 10;
        }

        .header-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #current-project-name {
            color: var(--text-main);
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-color: #333;
            cursor: pointer;
            font-weight: 500;
        }

        #session-title-display {
            color: var(--text-dim);
            font-weight: normal;
        }

        .text-btn {
            background: none;
            border: none;
            color: var(--text-main);
            padding: 0;
            font-size: 11px;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-color: #222;
            transition: opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .text-btn:active {
            opacity: 0.5;
        }

        .text-btn.dim {
            color: var(--text-dim);
            text-decoration: none;
        }

        .text-btn.danger {
            color: var(--color-danger);
            text-decoration-color: #411;
        }

        .page {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .page.active {
            display: flex;
        }

        /* Setup 页面修复：输入框宽度 */
        #setup,
        #onboarding {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 200;
            margin-bottom: 60px;
            letter-spacing: 14px;
        }

        input {
            background: none;
            border: none;
            color: var(--text-main);
            outline: none;
            font-family: inherit;
        }

        #new-project-input,
        #session-title-input {
            font-size: 18px;
            border-bottom: 1px solid #111;
            width: 260px;
            margin-bottom: 30px;
            padding: 10px;
            text-align: center;
        }

        .time-picker {
            display: flex;
            gap: 5px;
            align-items: baseline;
            margin-bottom: 40px;
        }

        .time-picker input {
            width: 90px;
            /* 进一步增加宽度，确保 999 也能显示 */
            font-size: 48px;
            font-weight: 200;
            text-align: right;
            padding: 0;
        }

        .unit {
            color: var(--text-dim);
            font-size: 12px;
            margin-left: 2px;
        }

        /* 计时器排版 */
        #timer-view {
            justify-content: center;
            align-items: center;
        }

        .timer-layout {
            display: flex;
            flex-direction: column;
            gap: var(--timer-gap);
        }

        .timer-line {
            display: grid;
            grid-template-columns: var(--label-width) 1fr;
            column-gap: var(--timer-gap);
            align-items: center;
        }

        .timer-label {
            display: flex;
            flex-direction: column;
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 2px;
            line-height: 1.2;
            text-align: center;
        }

        .timer-val {
            font-size: 12vw;
            font-weight: 200;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
            white-space: nowrap;
        }

        @media (min-width: 600px) {
            .timer-val {
                font-size: 60px;
            }
        }

        .timer-val .sec-part {
            font-size: 0.6em;
            opacity: 0.4;
            margin-left: 2px;
        }

        .timer-line.active .timer-val {
            color: var(--text-main);
        }

        .timer-line.active .timer-label {
            color: var(--text-main);
        }

        .timer-line.dim .timer-val {
            color: var(--text-dim);
        }

        .timer-line.dim .timer-label {
            color: var(--text-dim);
        }

        /* Efficiency 极致居中对齐 */
        .eff-row {
            margin-top: 1px;
            margin-left: 20px;
            display: flex;
            align-items: center;
        }

        .eff-tag {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 1px;
            /* 起始位置：标签宽 + 间距 */
            margin-left: calc(var(--label-width) + var(--timer-gap));
            /* 宽度：精确对应 HH:MM 的 5 个等宽字符宽度 */
            width: 5ch;
            text-align: center;
            white-space: nowrap;
        }

        /* 数据中心 */
        .tab-nav {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .tab-nav .text-btn.active {
            color: var(--text-main);
            text-decoration: underline;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .data-cell {
            cursor: pointer;
        }

        .data-cell .lbl {
            font-size: 9px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .data-cell .val {
            font-size: 18px;
            font-weight: 200;
        }

        .chart-wrap {
            height: 160px;
            margin: 20px 0;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--modal-bg);
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border: 1px solid #1a1a1a;
        }

        .stat-cluster {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .diagnosis-text {
            font-size: 13px;
            line-height: 1.8;
            color: #888;
            margin-bottom: 30px;
        }

        .session-list {
            max-height: 300px;
            overflow-y: auto;
            margin: 20px 0;
            border-top: 1px solid #111;
        }

        .session-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #111;
            font-size: 12px;
        }

        .session-info {
            flex: 1;
        }

        .session-info .title {
            color: var(--text-main);
            margin-bottom: 4px;
            display: block;
        }

        .session-info .meta {
            color: var(--text-dim);
            font-size: 10px;
        }

        .session-eff {
            color: var(--text-main);
            font-weight: 200;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="container">
        <header id="global-header" class="hidden">
            <div class="header-title-group">
                <span id="current-project-name" onclick="showModal('project-list-modal')">SELECT PROJECT</span>
                <span id="session-title-display"></span>
            </div>
            <button class="text-btn" onclick="toggleView()" id="nav-btn">数据中心</button>
        </header>

        <!-- 1. 项目创建 -->
        <div id="onboarding" class="page">
            <div class="brand-logo">CHRONOS</div>
            <input type="text" id="new-project-input" placeholder="项目名称" spellcheck="false">
            <button class="text-btn" onclick="handleCreateProject()">确认创建</button>
        </div>

        <!-- 2. 设置页面 -->
        <div id="setup" class="page">
            <div class="project-title"
                style="margin-bottom: 30px; color:var(--text-dim); font-size: 10px; letter-spacing: 2px;">NEW SESSION
            </div>
            <input type="text" id="session-title-input" placeholder="任务标题 (可选)" spellcheck="false">
            <div class="time-picker">
                <input type="number" id="input-h" value="0" min="0">
                <span class="unit">H</span>
                <input type="number" id="input-m" value="45" min="0" max="999">
                <span class="unit">M</span>
            </div>
            <button class="text-btn" onclick="startTimer()" style="font-size: 14px;">START SESSION</button>
            <div id="history-hint"
                style="margin-top: 60px; color:var(--text-dim); font-size:10px; letter-spacing: 1px;"></div>
        </div>

        <!-- 3. 计时页面 -->
        <div id="timer-view" class="page" onclick="handleTimerClick(event)">
            <div class="timer-layout">
                <div class="timer-line dim">
                    <div class="timer-label"><span>目</span><span>标</span></div>
                    <div class="timer-val" id="display-goal">00:00<span class="sec-part">:00</span></div>
                </div>
                <div class="timer-line active" id="main-timer-trigger">
                    <div class="timer-label"><span>计</span><span>时</span></div>
                    <div class="timer-val" id="timer-text">00:00<span class="sec-part">:00</span></div>
                </div>
                <div class="timer-line dim">
                    <div class="timer-label"><span>预</span><span>测</span></div>
                    <div class="timer-val" id="display-prediction">00:00<span class="sec-part">:00</span></div>
                </div>
                <!-- 效率行：通过 Margin 和宽度精确对齐 HH:MM 的几何中心 -->
                <div class="eff-row">
                    <div class="eff-tag" id="display-efficiency">EFFICIENCY 100.0%</div>
                </div>
            </div>
        </div>

        <!-- 4. 数据中心 -->
        <div id="dashboard-view" class="page">
            <div class="tab-nav">
                <button id="mode-num" class="text-btn active" onclick="setDashMode('num')">数字模式</button>
                <button id="mode-chart" class="text-btn" onclick="setDashMode('chart')">图表模式</button>
            </div>
            <div class="tab-nav" style="margin-top: -15px;">
                <button id="dim-day" class="text-btn active" onclick="setDashDim('day')">日</button>
                <button id="dim-week" class="text-btn" onclick="setDashDim('week')">周</button>
                <button id="dim-month" class="text-btn" onclick="setDashDim('month')">月</button>
            </div>

            <div id="dash-content-num"></div>
            <div id="dash-content-chart" class="hidden">
                <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
                <div id="chart-list-view"></div>
            </div>

            <div style="margin-top: auto; display: flex; flex-direction: column; align-items: flex-start; gap: 20px;">
                <button class="text-btn" onclick="handleBackFromDash()">返回</button>
                <button class="text-btn danger" onclick="resetAllData()">清除全部历史</button>
            </div>
        </div>
    </div>

    <!-- 弹窗集 -->
    <div id="settlement-modal" class="modal">
        <div class="modal-content">
            <div class="project-title" style="font-size: 10px; margin-bottom: 20px;">SESSION COMPLETED</div>
            <div class="stat-cluster" id="settlement-stats"></div>
            <div class="diagnosis-text" id="settlement-diagnosis"></div>
            <div style="display: flex; gap: 25px;">
                <button class="text-btn" onclick="closeModal('settlement-modal'); toggleView('dash');">数据详情</button>
                <button class="text-btn" onclick="closeModal('settlement-modal'); showSetup();">继续计时</button>
            </div>
        </div>
    </div>

    <div id="project-list-modal" class="modal">
        <div class="modal-content">
            <div class="brand-logo" style="font-size: 16px; margin-bottom: 30px;">PROJECTS</div>
            <div id="project-list-container"></div>
            <div style="margin-top: 30px; display: flex; gap: 20px;">
                <button class="text-btn" onclick="closeModal('project-list-modal'); showView('onboarding');">+
                    新项目</button>
                <button class="text-btn dim" onclick="closeModal('project-list-modal')">关闭</button>
            </div>
        </div>
    </div>

    <div id="history-list-modal" class="modal">
        <div class="modal-content">
            <div class="project-title" style="font-size: 10px; margin-bottom: 15px;">SESSION HISTORY</div>
            <div class="session-list" id="session-history-container"></div>
            <div style="margin-top: 20px;">
                <button class="text-btn dim" onclick="closeModal('history-list-modal')">关闭</button>
            </div>
        </div>
    </div>

    <script>
        let state = {
            projects: JSON.parse(localStorage.getItem('chronos_v1')) || {},
            activeProject: localStorage.getItem('chronos_active') || null,
            timer: {
                instance: null, startTime: null, elapsedBeforePause: 0,
                isPaused: false, goalSeconds: 0, currentTitle: "",
                isRunning: false
            },
            dashMode: 'num',
            dashDim: 'day'
        };

        const timerText = document.getElementById('timer-text');
        let myChart = null;

        window.onload = () => {
            if (!state.activeProject) showView('onboarding');
            else showSetup();
        };

        function showView(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('global-header').classList.toggle('hidden', id === 'onboarding');

            const target = document.getElementById(id);
            if (target) target.classList.add('active');

            if (id === 'dashboard-view') {
                document.getElementById('nav-btn').innerText = '关闭数据中心';
                renderDashboard();
            } else {
                document.getElementById('nav-btn').innerText = '数据中心';
            }
        }

        function handleBackFromDash() {
            if (state.timer.isRunning) showView('timer-view');
            else showSetup();
        }

        function toggleView(force) {
            const isDash = document.getElementById('dashboard-view').classList.contains('active');
            if (force === 'dash' || !isDash) showView('dashboard-view');
            else handleBackFromDash();
        }

        function showModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function handleCreateProject() {
            const name = document.getElementById('new-project-input').value.trim();
            if (!name) return;
            if (!state.projects[name]) state.projects[name] = { sessions: [], avgCost: 1.0, debt: 0 };
            state.activeProject = name;
            save();
            showSetup();
        }

        function switchProject(name) {
            state.activeProject = name;
            save();
            closeModal('project-list-modal');
            showSetup();
        }

        function showSetup() {
            document.getElementById('current-project-name').innerText = state.activeProject;
            document.getElementById('session-title-display').innerText = "";
            const p = state.projects[state.activeProject];
            document.getElementById('history-hint').innerText = p.sessions.length > 0
                ? `COST ${p.avgCost.toFixed(2)} | DEBT ${Math.round(p.debt)}M`
                : "DATA MODELING IN PROGRESS";

            const listContainer = document.getElementById('project-list-container');
            listContainer.innerHTML = Object.keys(state.projects).map(name => `
                <div style="padding:15px 0; border-bottom:1px solid #111; cursor:pointer; color:${name === state.activeProject ? '#fff' : '#444'}" 
                     onclick="switchProject('${name}')">${name}</div>
            `).join('');

            showView('setup');
        }

        function startTimer() {
            const h = parseInt(document.getElementById('input-h').value) || 0;
            const m = parseInt(document.getElementById('input-m').value) || 0;
            if (h === 0 && m === 0) return;

            state.timer.currentTitle = document.getElementById('session-title-input').value.trim();
            state.timer.goalSeconds = (h * 3600) + (m * 60);
            state.timer.startTime = Date.now();
            state.timer.elapsedBeforePause = 0;
            state.timer.isPaused = false;
            state.timer.isRunning = true;

            document.getElementById('session-title-display').innerText = state.timer.currentTitle ? " / " + state.timer.currentTitle : "";
            document.getElementById('display-goal').innerHTML = formatTimeHTML(state.timer.goalSeconds);
            showView('timer-view');
            if (state.timer.instance) clearInterval(state.timer.instance);
            state.timer.instance = setInterval(updateTimer, 100);
        }

        function updateTimer() {
            if (state.timer.isPaused) return;
            const now = Date.now();
            const elapsed = Math.floor((now - state.timer.startTime) / 1000) + state.timer.elapsedBeforePause;

            timerText.innerHTML = formatTimeHTML(elapsed);

            if (elapsed > state.timer.goalSeconds) {
                const ratio = (elapsed - state.timer.goalSeconds) / state.timer.goalSeconds;
                let color = '#000';
                if (ratio < 0.2) {
                    const f = ratio / 0.2;
                    color = `rgb(${Math.floor(180 * f)}, ${Math.floor(140 * f)}, 0)`;
                } else if (ratio < 0.5) {
                    const f = (ratio - 0.2) / 0.3;
                    color = `rgb(${Math.floor(180 + 75 * f)}, ${Math.floor(140 - 140 * f)}, 0)`;
                } else color = `#811`;
                document.body.style.backgroundColor = color;
                if (elapsed === state.timer.goalSeconds + 1) haptic(300);
            } else {
                document.body.style.backgroundColor = '#000';
            }

            const avgCost = state.projects[state.activeProject].avgCost || 1.0;
            document.getElementById('display-prediction').innerHTML = formatTimeHTML(Math.round(state.timer.goalSeconds * avgCost));
            const eff = (state.timer.goalSeconds / Math.max(elapsed, 1)) * 100;
            document.getElementById('display-efficiency').innerText = `EFFICIENCY ${eff.toFixed(1)}%`;
        }

        function handleTimerClick(e) {
            if (e.target.closest('#main-timer-trigger')) stopTimer();
            else togglePause();
        }

        function togglePause() {
            state.timer.isPaused = !state.timer.isPaused;
            if (state.timer.isPaused) {
                state.timer.elapsedBeforePause += Math.floor((Date.now() - state.timer.startTime) / 1000);
                timerText.style.opacity = '0.2';
            } else {
                state.timer.startTime = Date.now();
                timerText.style.opacity = '1';
            }
        }

        function stopTimer() {
            clearInterval(state.timer.instance);
            state.timer.isRunning = false;
            const elapsed = Math.floor((Date.now() - state.timer.startTime) / 1000) + state.timer.elapsedBeforePause;
            const goal = state.timer.goalSeconds;
            const session = {
                title: state.timer.currentTitle,
                date: new Date().toISOString(),
                goal, actual: elapsed,
                eff: (goal / elapsed) * 100, cost: elapsed / goal
            };
            const p = state.projects[state.activeProject];
            p.sessions.push(session);
            p.avgCost = p.sessions.reduce((a, b) => a + b.cost, 0) / p.sessions.length;
            p.debt += (elapsed - goal) / 60;
            save();
            renderSettlement(session, p);
            document.body.style.backgroundColor = '#000';
            document.getElementById('session-title-display').innerText = "";
        }

        function renderSettlement(curr, p) {
            const avgEff = (1 / p.avgCost) * 100;
            const diff = curr.eff - avgEff;
            document.getElementById('settlement-stats').innerHTML = `
                <div class="data-cell"><div class="lbl">效率</div><div class="val">${curr.eff.toFixed(1)}%</div></div>
                <div class="data-cell"><div class="lbl">对比历史</div><div class="val">${diff >= 0 ? '+' : ''}${diff.toFixed(1)}%</div></div>
                <div class="data-cell"><div class="lbl">时长</div><div class="val">${formatTimeSimple(curr.actual)}</div></div>
                <div class="data-cell"><div class="lbl">损益</div><div class="val">${Math.round((curr.actual - curr.goal) / 60)} M</div></div>
            `;
            document.getElementById('settlement-diagnosis').innerText = curr.eff >= 100 ? "精准控制。生成的红利已存入账户。" : "由于执行偏差，当前产生了额外的时间开支。";
            showModal('settlement-modal');
        }

        function setDashMode(m) {
            state.dashMode = m;
            document.getElementById('mode-num').classList.toggle('active', m === 'num');
            document.getElementById('mode-chart').classList.toggle('active', m === 'chart');
            renderDashboard();
        }

        function setDashDim(d) {
            state.dashDim = d;
            ['day', 'week', 'month'].forEach(id => document.getElementById('dim-' + id).classList.toggle('active', id === d));
            renderDashboard();
        }

        function renderDashboard() {
            const p = state.projects[state.activeProject];
            let filtered = p.sessions;
            const now = new Date();
            if (state.dashDim === 'day') filtered = p.sessions.filter(s => new Date(s.date).toDateString() === now.toDateString());
            else if (state.dashDim === 'week') filtered = p.sessions.filter(s => (now - new Date(s.date)) < 7 * 24 * 3600 * 1000);
            else if (state.dashDim === 'month') filtered = p.sessions.filter(s => (now - new Date(s.date)) < 30 * 24 * 3600 * 1000);

            if (state.dashMode === 'num') {
                document.getElementById('dash-content-num').classList.remove('hidden');
                document.getElementById('dash-content-chart').classList.add('hidden');
                const tActual = filtered.reduce((a, b) => a + b.actual, 0);
                const tGoal = filtered.reduce((a, b) => a + b.goal, 0);
                document.getElementById('dash-content-num').innerHTML = `
                    <div class="data-grid">
                        <div class="data-cell"><div class="lbl">时段效率</div><div class="val">${((tGoal / tActual) * 100 || 0).toFixed(1)}%</div></div>
                        <div class="data-cell"><div class="lbl">周期债</div><div class="val">${Math.round(filtered.reduce((a, b) => (a + (b.actual - b.goal) / 60), 0))} M</div></div>
                        <div class="data-cell"><div class="lbl">膨胀系数</div><div class="val">${(tActual / tGoal || 1.0).toFixed(2)}</div></div>
                        <div class="data-cell" onclick="showHistoryList()"><div class="lbl">专注次数</div><div class="val" style="text-decoration:underline">${filtered.length}</div></div>
                    </div>
                `;
            } else {
                document.getElementById('dash-content-num').classList.add('hidden');
                document.getElementById('dash-content-chart').classList.remove('hidden');
                initChart(filtered);
            }
        }

        function showHistoryList() {
            const p = state.projects[state.activeProject];
            const container = document.getElementById('session-history-container');
            container.innerHTML = p.sessions.length > 0 ? p.sessions.slice().reverse().map((s, idx) => `
                <div class="session-item">
                    <div class="session-info">
                        <span class="title">${s.title || '任务 ' + (p.sessions.length - idx)}</span>
                        <span class="meta">${new Date(s.date).toLocaleDateString()} · ${formatTimeSimple(s.actual)}</span>
                    </div>
                    <div class="session-eff">${s.eff.toFixed(0)}%</div>
                </div>
            `).join('') : "<div style='color:#333; padding:20px; font-size:10px;'>NO DATA</div>";
            showModal('history-list-modal');
        }

        function initChart(data) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const samples = data.slice(-10);
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: samples.map((_, i) => i + 1),
                    datasets: [{ data: samples.map(s => s.eff), borderColor: '#fff', borderWidth: 1, pointRadius: 0, tension: 0.1 }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { y: { display: false, min: 0, max: 120 }, x: { display: false } },
                    plugins: { legend: { display: false } }
                }
            });
            document.getElementById('chart-list-view').innerHTML = samples.reverse().slice(0, 3).map(s => `
                <div style="display:flex; justify-content:space-between; font-size:10px; color:#333; padding:8px 0; border-bottom:1px solid #111;">
                    <span>${s.title || '任务'}</span>
                    <span>EFF ${s.eff.toFixed(0)}%</span>
                </div>
            `).join('');
        }

        function pad(n) { return n.toString().padStart(2, '0'); }
        function formatTimeHTML(s) {
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            // 等宽字体：2位 + 1位冒号 + 2位 = 5字符
            return `${pad(h)}:${pad(m)}<span class="sec-part">:${pad(sec)}</span>`;
        }
        function formatTimeSimple(s) {
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            return `${pad(h)}:${pad(m)}:${pad(sec)}`;
        }
        function save() {
            localStorage.setItem('chronos_v1', JSON.stringify(state.projects));
            localStorage.setItem('chronos_active', state.activeProject);
        }
        function haptic(ms) { if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(ms); }
        function resetAllData() { if (confirm("确定永久清除所有历史？")) { localStorage.clear(); location.reload(); } }
    </script>
</body>

</html>
