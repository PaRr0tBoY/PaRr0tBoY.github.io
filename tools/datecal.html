<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日期计算器 · Acidev</title><link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
    <meta name="description" content="处理日期、间隔和日历计算。由 Acid 制作的本地优先小工具，打开即用。" />
    <link rel="canonical" href="https://acidev.cc/tools/datecal.html" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 24px;
        padding: 40px 30px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      h1 {
        text-align: center;
        color: #333;
        font-size: 24px;
        margin-bottom: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .today-box {
        background: #f8f9fa;
        border-radius: 16px;
        padding: 20px;
        text-align: center;
        margin-bottom: 30px;
      }

      .today-label {
        color: #666;
        font-size: 14px;
        margin-bottom: 8px;
      }

      .today-date {
        color: #333;
        font-size: 20px;
        font-weight: 600;
      }

      .unit-toggle {
        display: flex;
        gap: 12px;
        margin-bottom: 30px;
      }

      .unit-btn {
        flex: 1;
        padding: 14px;
        border: 2px solid #e0e0e0;
        background: white;
        border-radius: 12px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 500;
        color: #666;
        transition: all 0.2s;
      }

      .unit-btn.active {
        border-color: #667eea;
        background: #667eea;
        color: white;
      }

      .slider-container {
        margin-bottom: 30px;
      }

      .slider-labels {
        display: flex;
        justify-content: space-between;
        color: #999;
        font-size: 12px;
        margin-bottom: 8px;
      }

      .slider-wrapper {
        position: relative;
        height: 40px;
        display: flex;
        align-items: center;
      }

      input[type="range"] {
        width: 100%;
        height: 6px;
        border-radius: 3px;
        background: #e0e0e0;
        outline: none;
        -webkit-appearance: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #667eea;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
      }

      input[type="range"]::-moz-range-thumb {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #667eea;
        cursor: pointer;
        border: none;
        box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
      }

      .current-value {
        text-align: center;
        margin-top: 12px;
        font-size: 18px;
        color: #667eea;
        font-weight: 600;
      }

      .result-box {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 20px;
        padding: 30px;
        color: white;
        text-align: center;
        margin-bottom: 20px;
      }

      .result-label {
        font-size: 14px;
        opacity: 0.9;
        margin-bottom: 12px;
      }

      .result-date {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
        line-height: 1.3;
      }

      .result-diff {
        font-size: 14px;
        opacity: 0.85;
      }

      .actions {
        display: flex;
        gap: 12px;
      }

      .action-btn {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .btn-copy {
        background: #f0f0f0;
        color: #333;
      }

      .btn-copy:hover {
        background: #e0e0e0;
      }

      .btn-calendar {
        background: #667eea;
        color: white;
      }

      .btn-calendar:hover {
        background: #5a6fd6;
      }

      .toast {
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: #333;
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        opacity: 0;
        transition: all 0.3s;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .workday-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        color: #666;
      }

      .workday-toggle input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #667eea;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📅 日期计算器</h1>

      <div class="today-box">
        <div class="today-label">今天是</div>
        <div class="today-date" id="todayDisplay">--</div>
      </div>

      <div class="unit-toggle">
        <button class="unit-btn active" data-unit="week">周</button>
        <button class="unit-btn" data-unit="month">月</button>
      </div>

      <div class="workday-toggle">
        <input type="checkbox" id="workdayMode" />
        <label for="workdayMode">只算工作日（跳过周末）</label>
      </div>

      <div class="slider-container">
        <div class="slider-labels">
          <span id="minLabel">-52周</span>
          <span id="maxLabel">+52周</span>
        </div>
        <div class="slider-wrapper">
          <input
            type="range"
            id="slider"
            min="-52"
            max="52"
            value="0"
            step="1"
          />
        </div>
        <div class="current-value" id="currentValue">今天</div>
      </div>

      <div class="result-box">
        <div class="result-label">目标日期</div>
        <div class="result-date" id="resultDate">--</div>
        <div class="result-diff" id="resultDiff">--</div>
      </div>

      <div class="actions">
        <button class="action-btn btn-copy" id="copyBtn">📋 复制</button>
        <button class="action-btn btn-calendar" id="calendarBtn">
          📅 日历
        </button>
      </div>
    </div>

    <div class="toast" id="toast">已复制到剪贴板</div>

    <script>
      // 状态
      let currentUnit = "week"; // 'week' | 'month'
      let currentValue = 0;
      let isWorkdayMode = false;
      const today = new Date();

      // DOM元素
      const todayDisplay = document.getElementById("todayDisplay");
      const unitBtns = document.querySelectorAll(".unit-btn");
      const slider = document.getElementById("slider");
      const minLabel = document.getElementById("minLabel");
      const maxLabel = document.getElementById("maxLabel");
      const currentValueDisplay = document.getElementById("currentValue");
      const resultDate = document.getElementById("resultDate");
      const resultDiff = document.getElementById("resultDiff");
      const copyBtn = document.getElementById("copyBtn");
      const calendarBtn = document.getElementById("calendarBtn");
      const toast = document.getElementById("toast");
      const workdayCheckbox = document.getElementById("workdayMode");

      // 初始化
      function init() {
        // 显示今天
        todayDisplay.textContent = formatDateFull(today);

        // 从URL读取状态
        const params = new URLSearchParams(window.location.search);
        const unitParam = params.get("unit");
        const valParam = params.get("val");
        const workdayParam = params.get("workday");

        if (unitParam && ["week", "month"].includes(unitParam)) {
          currentUnit = unitParam;
        }
        if (valParam !== null) {
          currentValue = parseInt(valParam) || 0;
        }
        if (workdayParam === "1") {
          isWorkdayMode = true;
          workdayCheckbox.checked = true;
        }

        updateUnitUI();
        updateSliderRange();
        slider.value = currentValue;
        calculate();
      }

      // 格式化日期
      function formatDateFull(date) {
        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        const day = date.getDate();
        const weekDays = ["日", "一", "二", "三", "四", "五", "六"];
        const weekDay = weekDays[date.getDay()];
        return `${year}年${month}月${day}日 星期${weekDay}`;
      }

      function formatDateShort(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      // 计算目标日期
      function calculateTargetDate() {
        let target = new Date(today);

        if (isWorkdayMode && currentValue !== 0) {
          // 工作日模式：逐天添加，跳过周末
          let daysToAdd = currentValue;
          let direction = daysToAdd > 0 ? 1 : -1;
          daysToAdd = Math.abs(daysToAdd);

          if (currentUnit === "week") {
            daysToAdd *= 5; // 一周5个工作日
          } else {
            // 一月约22个工作日
            daysToAdd = Math.round(daysToAdd * 22);
          }

          let addedDays = 0;
          while (addedDays < daysToAdd) {
            target.setDate(target.getDate() + direction);
            const dayOfWeek = target.getDay();
            if (dayOfWeek !== 0 && dayOfWeek !== 6) {
              addedDays++;
            }
          }
        } else {
          // 自然日模式
          if (currentUnit === "week") {
            target.setDate(target.getDate() + currentValue * 7);
          } else {
            target.setMonth(target.getMonth() + currentValue);
          }
        }

        return target;
      }

      // 计算日期差
      function getDateDiff(start, end) {
        const msPerDay = 1000 * 60 * 60 * 24;
        const diffDays = Math.round((end - start) / msPerDay);
        const diffWeeks = Math.round((diffDays / 7) * 10) / 10;
        const diffMonths = Math.round((diffDays / 30) * 10) / 10;

        if (diffDays === 0) return "今天";
        const prefix = diffDays > 0 ? "还有" : "已过";
        const absDays = Math.abs(diffDays);

        return `${prefix} ${absDays}天 / ${Math.abs(diffWeeks)}周 / ${Math.abs(diffMonths)}月`;
      }

      // 更新单位UI
      function updateUnitUI() {
        unitBtns.forEach((btn) => {
          if (btn.dataset.unit === currentUnit) {
            btn.classList.add("active");
          } else {
            btn.classList.remove("active");
          }
        });
      }

      // 更新滑块范围
      function updateSliderRange() {
        const max = currentUnit === "week" ? 52 : 24;
        const unitText = currentUnit === "week" ? "周" : "月";

        slider.min = -max;
        slider.max = max;
        minLabel.textContent = `-${max}${unitText}`;
        maxLabel.textContent = `+${max}${unitText}`;

        // 限制当前值在新范围内
        if (currentValue < -max) currentValue = -max;
        if (currentValue > max) currentValue = max;
        slider.value = currentValue;
      }

      // 更新当前值显示
      function updateValueDisplay() {
        const unitText = currentUnit === "week" ? "周" : "月";
        if (currentValue === 0) {
          currentValueDisplay.textContent = "今天";
        } else if (currentValue > 0) {
          currentValueDisplay.textContent = `+${currentValue}${unitText}后`;
        } else {
          currentValueDisplay.textContent = `${currentValue}${unitText}前`;
        }
      }

      // 主计算函数
      function calculate() {
        const target = calculateTargetDate();
        resultDate.textContent = formatDateFull(target);
        resultDiff.textContent = getDateDiff(today, target);
        updateValueDisplay();
        updateURL();
      }

      // 更新URL
      function updateURL() {
        const params = new URLSearchParams();
        if (currentUnit !== "week") params.set("unit", currentUnit);
        if (currentValue !== 0) params.set("val", currentValue);
        if (isWorkdayMode) params.set("workday", "1");

        const newURL = params.toString()
          ? `${window.location.pathname}?${params.toString()}`
          : window.location.pathname;

        window.history.replaceState({}, "", newURL);
      }

      // 显示提示
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2000);
      }

      // 事件监听
      unitBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          currentUnit = btn.dataset.unit;
          updateUnitUI();
          updateSliderRange();
          calculate();
        });
      });

      slider.addEventListener("input", (e) => {
        currentValue = parseInt(e.target.value);
        calculate();
      });

      workdayCheckbox.addEventListener("change", (e) => {
        isWorkdayMode = e.target.checked;
        calculate();
      });

      copyBtn.addEventListener("click", () => {
        const target = calculateTargetDate();
        const text = formatDateFull(target);
        navigator.clipboard
          .writeText(text)
          .then(() => {
            showToast("已复制到剪贴板");
          })
          .catch(() => {
            // 降级方案
            const textarea = document.createElement("textarea");
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand("copy");
            document.body.removeChild(textarea);
            showToast("已复制到剪贴板");
          });
      });

      calendarBtn.addEventListener("click", () => {
        const target = calculateTargetDate();
        const dateStr = formatDateShort(target);
        // 尝试打开系统日历
        const calendarUrl = `webcal://`; // iOS
        // 或者生成.ics文件下载
        const icsContent = `BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
DTSTART;VALUE=DATE:${dateStr.replace(/-/g, "")}
SUMMARY:目标日期
END:VEVENT
END:VCALENDAR`;

        const blob = new Blob([icsContent], { type: "text/calendar" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `date-${dateStr}.ics`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("日历文件已下载");
      });

      // 启动
      init();
    </script>
  </body>
</html>
