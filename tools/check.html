<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>每日备考复盘</title><link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d0f14;
        --surface: #161923;
        --surface2: #1e2230;
        --ink: #e4e0d8;
        --ink2: #9a958a;
        --ink3: #4a4640;
        --accent: #d4893a;
        --accent2: #f0c070;
        --accent-dim: rgba(212, 137, 58, 0.12);
        --green: #4a9e7a;
        --green-dim: rgba(74, 158, 122, 0.12);
        --red: #c05858;
        --border: #2a2e3a;
        --radius: 14px;
        --shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
      }
      [data-theme="light"] {
        --bg: #f4f0e8;
        --surface: #ffffff;
        --surface2: #f8f6f0;
        --ink: #2c2416;
        --ink2: #6b5f4e;
        --ink3: #b5a99a;
        --accent: #c17f3a;
        --accent2: #c17f3a;
        --accent-dim: #fdf3e8;
        --green: #27735a;
        --green-dim: #f0faf6;
        --red: #c0392b;
        --border: #e0d8cc;
        --shadow: 0 4px 24px rgba(44, 36, 22, 0.08);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: "Noto Sans SC", sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        transition:
          background 0.3s,
          color 0.3s;
      }

      /* ── Header ── */
      .header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 18px 20px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 50;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .header-left {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .header-date {
        font-size: 11px;
        color: var(--ink2);
        letter-spacing: 1px;
      }
      .header-title {
        font-family: "Noto Serif SC", serif;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .countdown-badge {
        font-size: 11px;
        color: var(--accent);
        background: var(--accent-dim);
        padding: 4px 12px;
        border-radius: 20px;
        white-space: nowrap;
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface2);
        color: var(--ink2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        transition: all 0.15s;
      }
      .icon-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-dim);
      }

      /* ── Step Indicator ── */
      .step-bar {
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .step-dot {
        height: 3px;
        flex: 1;
        border-radius: 3px;
        background: var(--border);
        transition: background 0.3s;
      }
      .step-dot.done {
        background: var(--accent);
      }
      .step-dot.active {
        background: var(--accent2);
      }

      /* ── Main Card ── */
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px 16px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 560px;
        overflow: hidden;
        animation: fadeUp 0.35s ease;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .card-head {
        padding: 20px 24px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .card-icon {
        font-size: 20px;
      }
      .card-step {
        font-size: 11px;
        color: var(--ink3);
        background: var(--surface2);
        padding: 2px 8px;
        border-radius: 8px;
      }
      .card-title {
        font-family: "Noto Serif SC", serif;
        font-size: 16px;
        font-weight: 500;
      }
      .card-body {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* ── Question ── */
      .q-label {
        font-size: 12px;
        color: var(--ink2);
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .q-label .opt {
        font-size: 10px;
        color: var(--ink3);
        background: var(--surface2);
        padding: 1px 6px;
        border-radius: 6px;
        border: 1px solid var(--border);
      }

      /* ── Exam Checkboxes ── */
      .exam-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .exam-chip {
        padding: 10px 18px;
        border-radius: 12px;
        border: 1.5px solid var(--border);
        background: var(--surface2);
        font-size: 13px;
        color: var(--ink2);
        cursor: pointer;
        transition: all 0.15s;
        user-select: none;
      }
      .exam-chip:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .exam-chip.on {
        background: var(--accent-dim);
        border-color: var(--accent);
        color: var(--accent);
      }

      /* ── Duration Slider ── */
      .dur-wrap {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .dur-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .dur-value {
        font-size: 36px;
        font-weight: 600;
        color: var(--accent);
        font-family: "Noto Serif SC", serif;
        min-width: 60px;
        text-align: center;
        transition: color 0.2s;
      }
      .dur-value span {
        font-size: 14px;
        font-weight: 400;
        color: var(--ink2);
      }
      .dur-slider {
        flex: 1;
        -webkit-appearance: none;
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(
          to right,
          var(--green) 0%,
          #f0a500 50%,
          var(--red) 100%
        );
        outline: none;
      }
      .dur-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--surface);
        border: 2.5px solid var(--accent);
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
      .dur-labels {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--ink3);
      }

      /* ── State Chips ── */
      .state-chips {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .state-chip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1.5px solid var(--border);
        background: var(--surface2);
        cursor: pointer;
        transition: all 0.15s;
        user-select: none;
      }
      .state-chip:hover {
        border-color: var(--accent);
        background: var(--accent-dim);
      }
      .state-chip.on {
        border-color: var(--accent);
        background: var(--accent-dim);
      }
      .state-emoji {
        font-size: 20px;
      }
      .state-info {
        flex: 1;
      }
      .state-name {
        font-size: 14px;
        font-weight: 500;
        color: var(--ink);
      }
      .state-desc {
        font-size: 11px;
        color: var(--ink2);
        margin-top: 1px;
      }
      .state-check {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        color: transparent;
        transition: all 0.15s;
        flex-shrink: 0;
      }
      .state-chip.on .state-check {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      /* ── Mood Picker ── */
      .mood-picker {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .mood-btn {
        width: 54px;
        height: 54px;
        border-radius: 14px;
        border: 2px solid var(--border);
        background: var(--surface2);
        font-size: 26px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
      }
      .mood-btn:hover {
        transform: scale(1.08);
        border-color: var(--accent);
      }
      .mood-btn.on {
        border-color: var(--accent);
        background: var(--accent-dim);
        transform: scale(1.05);
        box-shadow: 0 0 0 3px rgba(212, 137, 58, 0.2);
      }

      /* ── Stress Slider ── */
      .stress-wrap {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .stress-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .stress-val {
        font-size: 28px;
        font-weight: 600;
        color: var(--accent);
        font-family: "Noto Serif SC", serif;
        min-width: 40px;
        text-align: center;
      }
      .stress-slider {
        flex: 1;
        -webkit-appearance: none;
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(
          to right,
          var(--green) 0%,
          #f0a500 50%,
          var(--red) 100%
        );
        outline: none;
      }
      .stress-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--surface);
        border: 2.5px solid var(--accent);
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      }
      .stress-labels {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--ink3);
      }

      /* ── Chips ── */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        padding: 8px 16px;
        border-radius: 20px;
        border: 1.5px solid var(--border);
        background: var(--surface2);
        font-size: 12px;
        color: var(--ink2);
        cursor: pointer;
        transition: all 0.15s;
        user-select: none;
      }
      .chip:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .chip.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      /* ── Distraction ── */
      .distract-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .distract-item {
        background: var(--surface2);
        border: 1.5px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        transition: border-color 0.2s;
      }
      .distract-item.active {
        border-color: #d4703a;
        background: rgba(212, 112, 58, 0.08);
      }
      .distract-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .distract-name {
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
        flex: 1;
      }
      .distract-toggle {
        display: flex;
        gap: 5px;
      }
      .d-chip {
        padding: 4px 10px;
        border-radius: 10px;
        font-size: 11px;
        border: 1.5px solid var(--border);
        background: transparent;
        color: var(--ink2);
        cursor: pointer;
        transition: all 0.12s;
        user-select: none;
      }
      .d-chip.on {
        background: #d4703a;
        border-color: #d4703a;
        color: #fff;
      }

      /* ── Textarea ── */
      .text-input {
        width: 100%;
        border: 1.5px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px;
        font-family: "Noto Sans SC", sans-serif;
        font-size: 13px;
        color: var(--ink);
        background: var(--surface2);
        outline: none;
        resize: none;
        transition: border-color 0.2s;
        line-height: 1.6;
      }
      .text-input:focus {
        border-color: var(--accent);
        background: var(--surface);
      }
      .text-input::placeholder {
        color: var(--ink3);
      }

      /* ── Nav ── */
      .nav {
        padding: 16px 20px 32px;
        max-width: 560px;
        margin: 0 auto;
        width: 100%;
        display: flex;
        gap: 10px;
      }
      .btn {
        padding: 13px 20px;
        border-radius: 12px;
        font-size: 13px;
        font-family: "Noto Sans SC", sans-serif;
        font-weight: 500;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .btn-ghost {
        background: var(--surface2);
        color: var(--ink2);
        border: 1.5px solid var(--border);
      }
      .btn-ghost:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn-primary {
        flex: 1;
        background: var(--accent);
        color: #fff;
        justify-content: center;
      }
      .btn-primary:hover {
        filter: brightness(1.1);
        transform: translateY(-1px);
      }
      .btn-skip {
        background: transparent;
        color: var(--ink3);
        font-size: 12px;
        padding: 13px 12px;
      }
      .btn-skip:hover {
        color: var(--ink2);
      }

      /* ── Summary Card ── */
      .summary-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 560px;
        overflow: hidden;
        animation: fadeUp 0.35s ease;
      }
      .summary-head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .summary-title {
        font-family: "Noto Serif SC", serif;
        font-size: 15px;
        font-weight: 500;
      }
      .summary-body {
        padding: 16px 20px;
        font-size: 13px;
        line-height: 1.8;
        color: var(--ink2);
        white-space: pre-wrap;
        max-height: 60vh;
        overflow-y: auto;
      }
      .summary-actions {
        padding: 12px 20px 16px;
        display: flex;
        gap: 10px;
      }

      /* ── Toast ── */
      .toast {
        position: fixed;
        top: 80px;
        left: 50%;
        transform: translateX(-50%) translateY(-20px);
        opacity: 0;
        visibility: hidden;
        background: var(--ink);
        color: var(--bg);
        padding: 10px 20px;
        border-radius: 12px;
        font-size: 12px;
        z-index: 200;
        transition:
          transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
          opacity 0.25s ease,
          visibility 0.25s;
        white-space: nowrap;
        max-width: 90vw;
        pointer-events: none;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
        visibility: visible;
      }

      /* Safe area */
      @supports (padding-bottom: env(safe-area-inset-bottom)) {
        .nav {
          padding-bottom: calc(16px + env(safe-area-inset-bottom));
        }
        .toast {
          top: calc(80px + env(safe-area-inset-bottom));
        }
      }
      @media (max-width: 480px) {
        .card-body {
          padding: 20px 16px;
        }
        .dur-value {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-left">
        <div class="header-date" id="headerDate">加载中…</div>
        <div class="header-title">每日备考复盘</div>
      </div>
      <div class="header-right">
        <div class="countdown-badge" id="countdownBadge">距考试 — 天</div>
        <button class="icon-btn" id="themeBtn" title="切换主题">◐</button>
      </div>
    </div>

    <div class="step-bar" id="stepBar"></div>

    <main class="main" id="mainArea"></main>

    <nav class="nav" id="navArea"></nav>

    <div class="toast" id="toast"></div>

    <script>
      // ─── Sections Definition ──────────────────────────────────────────────────────
      const SECTIONS = [
        {
          id: "exams",
          icon: "📋",
          title: "基础信息",
          step: 1,
          content: `
      <div>
        <div class="q-label">今日主攻科目</div>
        <div class="exam-chips" id="examChips">
          <div class="exam-chip" onclick="toggleExam(this)">📐 数学</div>
          <div class="exam-chip" onclick="toggleExam(this)">🔤 英语</div>
          <div class="exam-chip" onclick="toggleExam(this)">🏛️ 政治</div>
          <div class="exam-chip" onclick="toggleExam(this)">⚙️ 机械</div>
        </div>
      </div>
      <div>
        <div class="q-label">今日学习时长</div>
        <div class="dur-wrap">
          <div class="dur-row">
            <div class="dur-value" id="durVal">0<span>h</span></div>
            <input type="range" class="dur-slider" id="durSlider" min="0" max="16" step="0.5" value="0"
              oninput="document.getElementById('durVal').innerHTML=this.value+'<span>h</span>'"/>
          </div>
          <div class="dur-labels"><span>0h</span><span>4h</span><span>8h</span><span>12h</span><span>16h</span></div>
        </div>
      </div>`,
        },
        {
          id: "mood",
          icon: "🌡️",
          title: "今日状态",
          step: 2,
          content: `
      <div>
        <div class="q-label">心情怎么样？</div>
        <div class="mood-picker">
          <button class="mood-btn" data-val="非常好" onclick="selectMood(this)">🥳</button>
          <button class="mood-btn" data-val="不错" onclick="selectMood(this)">😊</button>
          <button class="mood-btn" data-val="一般" onclick="selectMood(this)">😐</button>
          <button class="mood-btn" data-val="有点低落" onclick="selectMood(this)">😔</button>
          <button class="mood-btn" data-val="很差" onclick="selectMood(this)">😫</button>
        </div>
      </div>
      <div>
        <div class="q-label">整体学习状态</div>
        <div class="state-chips" id="stateChips">
          <div class="state-chip" onclick="selectState(this,0)">
            <div class="state-emoji">💀</div>
            <div class="state-info"><div class="state-name">自暴自弃</div><div class="state-desc">状态极差，完全不想学</div></div>
            <div class="state-check">✓</div>
          </div>
          <div class="state-chip" onclick="selectState(this,1)">
            <div class="state-emoji">🐒</div>
            <div class="state-info"><div class="state-name">心猿意马</div><div class="state-desc">状态差，注意力飘忽</div></div>
            <div class="state-check">✓</div>
          </div>
          <div class="state-chip" onclick="selectState(this,2)">
            <div class="state-emoji">🤖</div>
            <div class="state-info"><div class="state-name">循规蹈矩</div><div class="state-desc">状态中等，按部就班</div></div>
            <div class="state-check">✓</div>
          </div>
          <div class="state-chip" onclick="selectState(this,3)">
            <div class="state-emoji">🎯</div>
            <div class="state-info"><div class="state-name">心无旁骛</div><div class="state-desc">状态好，专注投入</div></div>
            <div class="state-check">✓</div>
          </div>
          <div class="state-chip" onclick="selectState(this,4)">
            <div class="state-emoji">🌀</div>
            <div class="state-info"><div class="state-name">浑然忘我</div><div class="state-desc">状态极好，效率爆棚</div></div>
            <div class="state-check">✓</div>
          </div>
        </div>
      </div>
      <div>
        <div class="q-label">压力值</div>
        <div class="stress-wrap">
          <div class="stress-row">
            <div class="stress-val" id="stressVal">5</div>
            <input type="range" class="stress-slider" id="stressSlider" min="1" max="10" value="5"
              oninput="document.getElementById('stressVal').textContent=this.value"/>
          </div>
          <div class="stress-labels"><span>🌿 轻松</span><span>🔥 高压</span></div>
        </div>
      </div>`,
        },
        {
          id: "study",
          icon: "📚",
          title: "学习记录",
          step: 3,
          content: `
      <div>
        <div class="q-label">今日主攻内容 <span class="opt">选填</span></div>

        {
          id: "review",
          icon: "🔍",
          title: "复盘总结",
          step: 5,
          optional: true,
          content: `
      <div>
        <div class="q-label">✅ 今天做得最好的一件事 <span class="opt">选填</span></div>

      </div>`,
        },
        {
          id: "gain",
          icon: "✨",
          title: "今日收获",
          step: 6,
          optional: true,
          content: `
      <div>
        <div class="q-label">今天最重要的知识点 / 突破 <span class="opt">选填</span></div>
        <textarea class="text-input" id="knowledge" rows="2" placeholder="写下让你印象最深的一个点…"></textarea>
      </div>
      <div>
        <div class="q-label">今天的感悟 <span class="opt">选填</span></div>
        <textarea class="text-input" id="insight" rows="2" placeholder="关于学习、状态、方法的一点想法…"></textarea>
      </div>`,
        },
      ];

      // ─── State ───────────────────────────────────────────────────────────────────
      // stepData saves per-step form data so returning to a step restores it
      const state = {
        theme: localStorage.getItem("check_theme") || "dark",
        currentStep: 0,
        exams: [],
        dur: 0,
        mood: "",
        studyState: -1,
        stress: 5,
        studyContent: "",
        progressVal: "",
        distractLevels: ["", "", "", "", ""],
        keepGood: "",
        keepWhy: "",
        improveProblem: "",
        knowledge: "",
        insight: "",
        mdContent: "",
      };

      // ─── Init ─────────────────────────────────────────────────────────────────────
      (function init() {
        applyTheme();

        const now = new Date();
        const days = ["日", "一", "二", "三", "四", "五", "六"];
        const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
        document.getElementById("headerDate").textContent =
          `${dateStr} 星期${days[now.getDay()]}`;

        const target = new Date(now.getFullYear(), 11, 20);
        if (now > target) target.setFullYear(target.getFullYear() + 1);
        const diff = Math.ceil((target - now) / 86400000);
        document.getElementById("countdownBadge").textContent =
          `距考试 ${diff} 天`;

        document
          .getElementById("themeBtn")
          .addEventListener("click", toggleTheme);

        renderStep();
      })();

      // ─── Theme ───────────────────────────────────────────────────────────────────
      function toggleTheme() {
        state.theme = state.theme === "dark" ? "light" : "dark";
        localStorage.setItem("check_theme", state.theme);
        applyTheme();
      }
      function applyTheme() {
        document.body.dataset.theme = state.theme === "light" ? "light" : "";
        document.getElementById("themeBtn").textContent =
          state.theme === "light" ? "◑" : "◐";
      }

      // ─── Step Rendering ───────────────────────────────────────────────────────────
      function renderStep() {
        const total = SECTIONS.length;
        // step dots
        const barHtml = SECTIONS.map((s, i) => {
          const cls =
            i < state.currentStep
              ? "done"
              : i === state.currentStep
                ? "active"
                : "";
          return `<div class="step-dot ${cls}"></div>`;
        }).join("");
        document.getElementById("stepBar").innerHTML = barHtml;

        const section = SECTIONS[state.currentStep];
        const card = `
    <div class="card">
      <div class="card-head">
        <span class="card-icon">${section.icon}</span>
        <span class="card-step">${section.step} / ${total}</span>
        <span class="card-title">${section.title}</span>
      </div>
      <div class="card-body">${section.content}</div>
    </div>`;
        document.getElementById("mainArea").innerHTML = card;

        // nav
        const isLast = state.currentStep === total - 1;
        const isFirst = state.currentStep === 0;
        let nav = "";
        if (!isFirst) {
          nav += `<button class="btn btn-ghost" onclick="prevStep()">← 上一步</button>`;
        }
        if (section.optional) {
          nav += `<button class="btn btn-skip" onclick="skipSection()">跳过</button>`;
        }
        nav += `<button class="btn btn-primary" onclick="nextStep()">${isLast ? "📄 生成记录" : "下一步 →"}</button>`;
        document.getElementById("navArea").innerHTML = nav;

        // Restore DOM state from saved step data
        requestAnimationFrame(() => restoreStepDOM(section.id));
      }

      function restoreStepDOM(id) {
        const s = state;
        switch (id) {
          case "exams":
            document.getElementById("durSlider").value = s.dur;
            document.getElementById("durVal").innerHTML =
              s.dur + "<span>h</span>";
            document.querySelectorAll(".exam-chip").forEach((chip) => {
              const name = chip.textContent.trim();
              if (s.exams.includes(name)) chip.classList.add("on");
            });
            break;
          case "mood":
            if (s.mood) {
              document.querySelectorAll(".mood-btn").forEach((b) => {
                if (b.dataset.val === s.mood) b.classList.add("on");
              });
            }
            if (s.studyState >= 0) {
              document.querySelectorAll(".state-chip").forEach((c, i) => {
                if (i === s.studyState) c.classList.add("on");
              });
            }
            document.getElementById("stressSlider").value = s.stress;
            document.getElementById("stressVal").textContent = s.stress;
            break;
          case "study":
            if (document.getElementById("studyContent"))
              document.getElementById("studyContent").value = s.studyContent;
            if (s.progressVal) {
              document.querySelectorAll("#progressChips .chip").forEach((c) => {
                if (c.textContent.trim() === s.progressVal)
                  c.classList.add("on");
              });
              const hv = document.getElementById("progressVal");
              if (hv) hv.value = s.progressVal;
            }
            break;
          case "distract":
            s.distractLevels.forEach((lv, i) => {
              if (!lv) return;
              document.querySelectorAll(`#d${i} .d-chip`).forEach((c) => {
                if (c.textContent.trim() === lv) c.classList.add("on");
              });
              if (lv !== "无")
                document.getElementById(`d${i}`).classList.add("active");
            });
            break;
          case "review":
            if (document.getElementById("keepGood"))
              document.getElementById("keepGood").value = s.keepGood;
            if (document.getElementById("keepWhy"))
              document.getElementById("keepWhy").value = s.keepWhy;
            if (document.getElementById("improveProblem"))
              document.getElementById("improveProblem").value =
                s.improveProblem;
            break;
          case "gain":
            if (document.getElementById("knowledge"))
              document.getElementById("knowledge").value = s.knowledge;
            if (document.getElementById("insight"))
              document.getElementById("insight").value = s.insight;
            break;
        }
      }

      function saveCurrentStep() {
        const s = state;
        switch (SECTIONS[state.currentStep].id) {
          case "exams":
            // exams already saved on toggle
            s.dur = parseFloat(
              document.getElementById("durSlider")?.value || 0,
            );
            break;
          case "mood":
            // mood/studyState already saved on click
            s.stress = parseInt(
              document.getElementById("stressSlider")?.value || 5,
            );
            break;
          case "study":
            s.studyContent = v("studyContent");
            s.progressVal = v("progressVal");
            break;
          case "distract":
            // distractLevels already saved on click
            break;
          case "review":
            s.keepGood = v("keepGood");
            s.keepWhy = v("keepWhy");
            s.improveProblem = v("improveProblem");
            break;
          case "gain":
            s.knowledge = v("knowledge");
            s.insight = v("insight");
            break;
        }
      }

      function prevStep() {
        saveCurrentStep();
        state.currentStep--;
        renderStep();
      }

      function skipSection() {
        if (state.currentStep === SECTIONS.length - 1) {
          try {
            generate();
          } catch (e) {
            showToast("生成失败：" + e.message);
          }
        } else {
          state.currentStep++;
          renderStep();
        }
      }

      function nextStep() {
        saveCurrentStep();
        if (state.currentStep < SECTIONS.length - 1) {
          state.currentStep++;
          renderStep();
        } else {
          try {
            generate();
          } catch (e) {
            showToast("生成失败：" + e.message);
          }
        }
      }

      // ─── Interactions ────────────────────────────────────────────────────────────
      function toggleExam(el) {
        el.classList.toggle("on");
        const name = el.textContent.trim();
        if (el.classList.contains("on")) {
          if (!state.exams.includes(name)) state.exams.push(name);
        } else {
          state.exams = state.exams.filter((e) => e !== name);
        }
      }

      function selectMood(btn) {
        document
          .querySelectorAll(".mood-btn")
          .forEach((b) => b.classList.remove("on"));
        btn.classList.add("on");
        state.mood = btn.dataset.val;
      }

      function selectState(el, idx) {
        document
          .querySelectorAll(".state-chip")
          .forEach((c) => c.classList.remove("on"));
        el.classList.add("on");
        state.studyState = idx;
      }

      function selectChip(el, groupId, hiddenId) {
        document
          .querySelectorAll(`#${groupId} .chip`)
          .forEach((c) => c.classList.remove("on"));
        el.classList.add("on");
        document.getElementById(hiddenId).value = el.textContent.trim();
      }

      function toggleDistract(idx, btn, level) {
        const prev = state.distractLevels[idx];
        const chips = document.querySelectorAll(`#d${idx} .d-chip`);
        chips.forEach((c) => c.classList.remove("on"));

        if (prev === level) {
          state.distractLevels[idx] = "";
          document.getElementById(`d${idx}`).classList.remove("active");
        } else {
          state.distractLevels[idx] = level;
          btn.classList.add("on");
          if (level !== "无")
            document.getElementById(`d${idx}`).classList.add("active");
          else document.getElementById(`d${idx}`).classList.remove("active");
        }
      }

      // ─── Generate ────────────────────────────────────────────────────────────────
      function generate() {
        const now = new Date();
        const days = ["日", "一", "二", "三", "四", "五", "六"];
        const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
        const dayStr = `星期${days[now.getDay()]}`;

        const target = new Date(now.getFullYear(), 11, 20);
        if (now > target) target.setFullYear(target.getFullYear() + 1);
        const diff = Math.ceil((target - now) / 86400000);

        const examStr = state.exams.length
          ? state.exams.join("、")
          : "（未选）";
        const dur = state.dur;
        const mood = state.mood || "（未选）";
        const stateNames = [
          "",
          "自暴自弃 💀",
          "心猿意马 🐒",
          "循规蹈矩 🤖",
          "心无旁骛 🎯",
          "浑然忘我 🌀",
        ];
        const studyState =
          state.studyState >= 0 ? stateNames[state.studyState + 1] : "（未选）";
        const stress = state.stress;
        const studyContent = state.studyContent || "（未填写）";
        const progressChip = state.progressVal || "（未选）";

        const distractNames = [
          "手机/社交软件",
          "疲劳/犯困",
          "环境噪音",
          "情绪/焦虑",
          "其他",
        ];
        const distractMd = state.distractLevels
          .map((lv, i) => {
            return `| ${distractNames[i]} | ${lv || "—"} |`;
          })
          .join("\n");

        const keepGood = state.keepGood || "—";
        const keepWhy = state.keepWhy || "—";
        const impProblem = state.improveProblem || "—";
        const knowledge = state.knowledge || "—";
        const insight = state.insight || "—";

        const md = `# 📋 每日备考复盘｜${dateStr} ${dayStr}

> **科目**：${examStr}　｜　**倒计时**：${diff} 天

---

## 基础信息

| 项目 | 数据 |
|------|------|
| 日期 | ${dateStr} ${dayStr} |
| 主攻科目 | ${examStr} |
| 学习时长 | ${dur}h |
| 倒计时 | ${diff} 天 |

---

## 今日状态

| 心情 | 学习状态 | 压力值 |
|------|---------|--------|
| ${mood} | ${studyState} | ${stress} / 10 |

---

## 学习记录

- **主攻内容**：${studyContent}
- **进度感觉**：${progressChip}

---

## 干扰源记录

| 干扰类型 | 程度 |
|---------|------|
${distractMd}

---

## 复盘总结

- **做得好的事**：${keepGood}
- **原因**：${keepWhy}
- **需改进的问题**：${impProblem}

---

## 今日收获

- **知识点 / 突破**：${knowledge}
- **感悟**：${insight}

---

*由「每日备考复盘」自动生成 · ${dateStr}*
`;

        state.mdContent = md;

        const summaryHtml = `
    <div class="summary-card">
      <div class="summary-head">
        <div class="summary-title">📄 复盘记录预览</div>
        <button class="icon-btn" onclick="closeSummary()" style="width:30px;height:30px;font-size:13px;border:none;background:var(--surface2)">✕</button>
      </div>
      <div class="summary-body">${md}</div>
      <div class="summary-actions">
        <button class="btn btn-ghost" onclick="closeSummary()">← 继续修改</button>
        <button class="btn btn-primary" onclick="downloadMd()">⬇ 下载 .md</button>
      </div>
    </div>`;
        document.getElementById("mainArea").innerHTML = summaryHtml;
        document.getElementById("navArea").innerHTML = "";
        document.getElementById("stepBar").innerHTML = "";
      }

      function closeSummary() {
        renderStep();
      }

      function downloadMd() {
        if (!state.mdContent) return;
        const now = new Date();
        const dateStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, "0")}${String(now.getDate()).padStart(2, "0")}`;
        const blob = new Blob([state.mdContent], {
          type: "text/markdown;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `备考复盘_${dateStr}.md`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast("📥 已下载到本地");
      }

      function v(id) {
        const el = document.getElementById(id);
        return el ? el.value.trim() : "";
      }

      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 3000);
      }
    </script>
  </body>
</html>
