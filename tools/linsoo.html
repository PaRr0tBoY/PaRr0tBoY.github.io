        },
        {
          title: "做决策",
          body: "把搜索结果变成可执行建议",
          prompt: "我想做一个 AI 搜索工具，应该优先实现哪些交互，哪些可以延后？",
        },
        {
          title: "继续研究",
          body: "围绕一个问题连续追问",
          prompt: "用 Perplexity 风格帮我研究：AI 搜索产品如何处理来源可信度？",
        },
      ];

      const ICON_COPY = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
      const ICON_RETRY = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>';
      const ICON_EDIT = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
      const ICON_CONTINUE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>';
      const ICON_FOLDER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5h6l2 2h10v8.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M3 7.5V6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1.5"/></svg>';
      const HERO_LINES = [
        "Linsoo 这一块",
        "Linsoo, 欸没搜呢",
        "Linsoooooooooooooooooo",
        "Linsoo\n我从未见过有如此精辟之回答",
        "Linsoo，你这答案保真吗？\n我一个 AI 搜索引擎，能给你查生答案？",
        "Linsoo 在答案里保留了一部分原始网页的味儿，\n这样你才知道你搜的是真信息。",
        "Linsoo\n练习搜索两年半",
      ];

      let state = {
        baseUrl: "",
        apiKey: "",
        models: [],
        activeModel: "",
        prompt: DEFAULT_PROMPT,
        mode: "search",
        theme: "light",
        sidebarCollapsed: false,
      };

      let messages = [];
      let currentChat = null;
      let chatIndex = [];
      let activeFolder = "";
      let activeChatMenuSlug = "";
      let attachments = {
        hero: [],
        thread: [],
      };
      let modelCache = {};
      let fetchedModels = [];
      let running = false;
      let aborter = null;
      let autoFollow = true;
      let toastTimer = null;
      let opfsRoot = null;
      let opfsReady = false;
      let saveTimer = null;
      let mathJaxReady = null;

      const els = {};

      async function boot() {
        cacheEls();
        await initStorage();
        await loadState();
        await loadModelCache();
        hydrateModelsFromCache();
        ensureActiveModel();
        applyTheme();
        applySidebarState();
        loadMathJax();
        renderHeroLine();
        await loadChatIndex();
        renderModelPickers();
        renderAttachments("hero");
        renderAttachments("thread");
        renderSidebar();
        renderModelList();
        bindEvents();
        updateSendState();

        const route = parseRoute();
        if (route) {
          await loadChatBySlug(route);
          return;
        }

        const q = new URLSearchParams(window.location.search).get("q");
        if (q && q.trim()) {
          els.heroInput.value = q.trim();
          submitFrom(els.heroInput);
        }
      }

      function cacheEls() {
        [
          "hero",
          "thread",
          "messages",
          "heroInput",
          "threadInput",
          "heroAttachments",
          "threadAttachments",
          "heroSendBtn",
          "threadSendBtn",
          "threadComposer",
          "heroFileInput",
          "threadFileInput",
          "heroModelTrigger",
          "threadModelTrigger",
          "heroModelLabel",
          "threadModelLabel",
          "heroModelDropdown",
          "threadModelDropdown",
          "homeBtn",
          "sidebarToggle",
          "searchHistoryBtn",
          "searchOverlay",
          "globalSearchInput",
          "globalSearchResults",
          "searchClose",
          "folderList",
          "pinnedList",
          "recentList",
          "chatMenu",
          "settingsBtn",
          "settingsOverlay",
          "settingsClose",
          "settingsCancel",
          "settingsSave",
          "newChatBtn",
          "themeBtn",
          "scrollBtn",
          "toast",
          "cfgBaseUrl",
          "cfgApiKey",
          "cfgModelInput",
          "refreshModelsBtn",
          "settingsModelDropdown",
          "modelList",
          "cfgPrompt",
          "resetPromptBtn",
          "tabApi",
          "tabPrompt",
        ].forEach((id) => {
          els[id] = document.getElementById(id);
        });
      }

      async function initStorage() {
        try {
          if (navigator.storage?.getDirectory) {
            opfsRoot = await navigator.storage.getDirectory();
            opfsReady = true;
          }
        } catch (e) {
          opfsRoot = null;
          opfsReady = false;
        }
      }

      async function readJsonFile(path, fallback) {
        if (!opfsReady) {
          try {
            const raw = localStorage.getItem(path);
            return raw ? JSON.parse(raw) : fallback;
          } catch (e) {
            return fallback;
          }
        }
        try {
          const file = await getOpfsFile(path, { create: false });
          if (!file) return fallback;
          return JSON.parse(await file.text());
        } catch (e) {
          return fallback;
        }
      }

      async function writeJsonFile(path, data) {
        if (!opfsReady) {
          try {
            localStorage.setItem(path, JSON.stringify(data));
          } catch (e) {}
          return;
        }
        const handle = await getOpfsHandle(path, { create: true });
        const writable = await handle.createWritable();
        await writable.write(JSON.stringify(data, null, 2));
        await writable.close();
      }

      async function getOpfsFile(path, opts = {}) {
        const handle = await getOpfsHandle(path, opts);
        return handle ? handle.getFile() : null;
      }

      async function getOpfsHandle(path, opts = {}) {
        if (!opfsRoot) return null;
        const parts = path.split("/").filter(Boolean);
        let dir = opfsRoot;
        for (let i = 0; i < parts.length - 1; i++) {
          dir = await dir.getDirectoryHandle(parts[i], { create: opts.create });
        }
        try {
          return await dir.getFileHandle(parts[parts.length - 1], { create: opts.create });
        } catch (e) {
          if (opts.create) throw e;
          return null;
        }
      }

      async function getOpfsDirectory(path, opts = {}) {
        if (!opfsRoot) return null;
        const parts = path.split("/").filter(Boolean);
        let dir = opfsRoot;
        for (const part of parts) {
          dir = await dir.getDirectoryHandle(part, { create: opts.create });
        }
        return dir;
      }

      async function loadChatIndex() {
        chatIndex = [];
        if (!opfsReady) {
          renderSidebar();
          return;
        }
        try {
          const dir = await getOpfsDirectory(OPFS_CHAT_DIR, { create: true });
          for await (const [name, handle] of dir.entries()) {
            if (handle.kind !== "file" || !name.endsWith(".json")) continue;
            try {
              const chat = JSON.parse(await (await handle.getFile()).text());
              chatIndex.push(chatSummary(chat));
            } catch (e) {}
          }
          chatIndex.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        } catch (e) {
          chatIndex = [];
        }
        renderSidebar();
      }

      function chatSummary(chat) {
        const text = (chat.messages || [])
          .map((m) => `${m.role}: ${m.content || ""}`)
          .join("\n")
          .slice(0, 4000);
        return {
          id: chat.id,
          slug: chat.slug,
          title: chat.title || chat.slug,
          pinned: !!chat.pinned,
          folder: chat.folder || "",
          createdAt: chat.createdAt || 0,
          updatedAt: chat.updatedAt || 0,
          text,
        };
      }

      async function loadState() {
        try {
          const stored = await readJsonFile(OPFS_SETTINGS_FILE, null);
          if (stored) Object.assign(state, stored);
          if (!stored) {
            const rawLegacy = localStorage.getItem(STORAGE_KEY);
            if (rawLegacy) Object.assign(state, JSON.parse(rawLegacy));
          }
        } catch (e) {}

        try {
          const linso = JSON.parse(localStorage.getItem(LINSO_STORAGE_KEY) || "{}");
          if (!state.baseUrl && linso.baseUrl) state.baseUrl = linso.baseUrl;
          if (!state.apiKey && linso.apiKey) state.apiKey = linso.apiKey;
          if (!state.models.length && Array.isArray(linso.models)) {
            state.models = linso.models.slice(0, 4);
          }
        } catch (e) {}

        if (!state.prompt) state.prompt = DEFAULT_PROMPT;
      }

      async function saveState() {
        try {
          await writeJsonFile(OPFS_SETTINGS_FILE, state);
        } catch (e) {}
      }

      async function loadModelCache() {
        try {
          modelCache = await readJsonFile(OPFS_MODEL_CACHE_FILE, {});
          if (!Object.keys(modelCache).length) {
            modelCache = JSON.parse(localStorage.getItem(MODEL_CACHE_KEY) || "{}");
          }
        } catch (e) {
          modelCache = {};
        }
      }

      async function saveModelCache() {
        try {
          await writeJsonFile(OPFS_MODEL_CACHE_FILE, modelCache);
        } catch (e) {}
      }

      function modelCacheUrl() {
        return (state.baseUrl || DEFAULT_BASE_URL).trim();
      }

      function hydrateModelsFromCache() {
        const cached = modelCache[modelCacheUrl()];
        if (cached && Array.isArray(cached.models)) {
          fetchedModels = cached.models;
          if (!state.models.length) state.models = cached.models.slice(0, 8);
        }
      }

      function ensureActiveModel() {
        if (state.activeModel) return;
        state.activeModel = state.models[0] || fetchedModels[0] || "";
      }

      function bindEvents() {
        bindComposer(els.heroInput, els.heroSendBtn);
        bindComposer(els.threadInput, els.threadSendBtn);
        bindFileInput("hero");
        bindFileInput("thread");
        bindModelPicker("hero");
        bindModelPicker("thread");

        els.homeBtn.addEventListener("click", () => newChat());
        els.sidebarToggle.addEventListener("click", toggleSidebar);
        els.searchHistoryBtn.addEventListener("click", openGlobalSearch);
        els.searchClose.addEventListener("click", closeGlobalSearch);
        els.searchOverlay.addEventListener("click", (event) => {
          if (event.target === els.searchOverlay) closeGlobalSearch();
        });
        els.globalSearchInput.addEventListener("input", renderGlobalSearchResults);
        els.globalSearchInput.addEventListener("keydown", (event) => {
          if (event.key === "Escape") closeGlobalSearch();
          if (event.key === "Enter") {
            const first = els.globalSearchResults.querySelector(".search-result-row");
            if (first) first.click();
          }
        });
        els.settingsBtn.addEventListener("click", openSettings);
        els.settingsClose.addEventListener("click", closeSettings);
        els.settingsCancel.addEventListener("click", closeSettings);
        els.settingsOverlay.addEventListener("click", (event) => {
          if (event.target === els.settingsOverlay) closeSettings();
        });
        els.settingsSave.addEventListener("click", saveSettings);
        els.newChatBtn.addEventListener("click", newChat);
        els.themeBtn.addEventListener("click", toggleTheme);
        els.scrollBtn.addEventListener("click", () => {
          autoFollow = true;
          scrollToBottom();
        });

        document.querySelectorAll(".tab").forEach((tab) => {
          tab.addEventListener("click", () => switchTab(tab.dataset.tab));
        });

        els.refreshModelsBtn.addEventListener("click", () => fetchModels({ force: true, open: true }));
        els.cfgModelInput.addEventListener("focus", () => {
          els.cfgModelInput.select();
          fetchModels({ open: true, filter: "" });
        });
        els.cfgModelInput.addEventListener("input", () => renderSettingsModelDropdown(els.cfgModelInput.value));
        els.cfgModelInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            selectModel(els.cfgModelInput.value.trim());
          }
          if (event.key === "Escape") {
            closeSettingsModelDropdown();
          }
        });
        els.cfgModelInput.addEventListener("blur", () => {
          setTimeout(closeSettingsModelDropdown, 140);
        });
        els.resetPromptBtn.addEventListener("click", () => {
          els.cfgPrompt.value = DEFAULT_PROMPT;
        });

        document.addEventListener("click", (event) => {
          if (!event.target.closest(".model-picker")) closeComposerModelDropdowns();
          if (!event.target.closest(".chat-menu") && !event.target.closest(".chat-menu-btn")) closeChatMenu();
        });

        window.addEventListener("scroll", () => {
          const distance = document.documentElement.scrollHeight - window.innerHeight - window.scrollY;
          autoFollow = distance < 120;
          els.scrollBtn.classList.toggle("visible", !autoFollow && messages.length > 0);
        }, { passive: true });
        window.addEventListener("resize", updateScrollButtonOffset, { passive: true });

        window.addEventListener("hashchange", async () => {
          const route = parseRoute();
          if (route && route !== currentChat?.slug) await loadChatBySlug(route);
          if (!route && currentChat) newChat({ preserveHash: true });
        });
      }

      function bindComposer(input, button) {
        input.addEventListener("input", () => {
          autosize(input);
          updateSendState();
        });
        input.addEventListener("paste", (event) => handlePasteAttachment(event, input));
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            submitFrom(input);
          }
          if (event.key === "Escape" && running) {
            cancelRun();
          }
        });
        button.addEventListener("click", () => {
          if (running) {
            cancelRun();
            return;
          }
          submitFrom(input);
        });
        bindDropZone(input);
      }

      function autosize(input) {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 210) + "px";
        updateScrollButtonOffset();
      }

      function scopeOfInput(input) {
        return input === els.heroInput ? "hero" : "thread";
      }

      function shellOfInput(input) {
        return input.closest(".composer-shell");
      }

      function bindDropZone(input) {
        const shell = shellOfInput(input);
        if (!shell) return;
        let depth = 0;
        shell.addEventListener("dragenter", (event) => {
          if (!event.dataTransfer?.types?.includes("Files")) return;
          event.preventDefault();
          depth++;
          shell.classList.add("drop-active");
        });
        shell.addEventListener("dragover", (event) => {
          if (!event.dataTransfer?.types?.includes("Files")) return;
          event.preventDefault();
          event.dataTransfer.dropEffect = "copy";
          shell.classList.add("drop-active");
        });
        shell.addEventListener("dragleave", () => {
          depth = Math.max(0, depth - 1);
          if (!depth) shell.classList.remove("drop-active");
        });
        shell.addEventListener("drop", async (event) => {
          if (!event.dataTransfer?.files?.length) return;
          event.preventDefault();
          depth = 0;
          shell.classList.remove("drop-active");
          await addFiles(scopeOfInput(input), [...event.dataTransfer.files]);
        });
      }

      async function handlePasteAttachment(event, input) {
        const text = event.clipboardData?.getData("text/plain") || "";
        if (text.length <= PASTE_ATTACHMENT_LIMIT) return;
        event.preventDefault();
        await addTextAttachment(scopeOfInput(input), text, "pasted");
        updateSendState();
      }

      function bindFileInput(scope) {
        const input = els[`${scope}FileInput`];
        input.addEventListener("change", async () => {
          await addFiles(scope, [...input.files]);
          input.value = "";
        });
        document.querySelectorAll(`.upload-btn[data-input="${input.id}"]`).forEach((btn) => {
          btn.addEventListener("click", () => input.click());
        });
      }

      async function addFiles(scope, files) {
        for (const file of files) {
          const item = {
            id: window.crypto?.randomUUID ? window.crypto.randomUUID() : String(Date.now() + Math.random()),
            name: file.name,
            type: file.type || "file",
            size: file.size,
            kind: "file",
            text: "",
          };
          if (isReadableTextFile(file)) {
            try {
              item.text = (await file.text()).slice(0, MAX_FILE_CHARS);
            } catch (e) {
              item.text = "";
            }
          }
          attachments[scope].push(item);
        }
        renderAttachments(scope);
        updateSendState();
      }

      async function addTextAttachment(scope, text, name = "pasted") {
        attachments[scope].push({
          id: window.crypto?.randomUUID ? window.crypto.randomUUID() : String(Date.now() + Math.random()),
          name,
          type: "text/plain",
          size: text.length,
          kind: "pasted",
          text: text.slice(0, MAX_FILE_CHARS),
        });
        renderAttachments(scope);
      }

      function isReadableTextFile(file) {
        return (
          file.type.startsWith("text/") ||
          file.type.includes("json") ||
          file.type.includes("xml") ||
          /\.(md|txt|json|csv|tsv|xml|html|css|js|ts|tsx|jsx|py|rb|go|rs|java|c|cpp|h|yaml|yml)$/i.test(file.name)
        );
      }

      function renderAttachments(scope) {
        const mount = els[`${scope}Attachments`];
        mount.innerHTML = "";
        attachments[scope].forEach((file) => {
          const template = document.createElement("template");
          template.innerHTML = attachmentCardHTML(file, true).trim();
          const chip = template.content.firstElementChild;
          chip.querySelector("button").addEventListener("click", () => {
            attachments[scope] = attachments[scope].filter((item) => item.id !== file.id);
            renderAttachments(scope);
            updateSendState();
          });
          mount.appendChild(chip);
        });
        mount.classList.toggle("visible", attachments[scope].length > 0);
        updateScrollButtonOffset();
      }

      function attachmentCardHTML(file, removable = true) {
        return `
          <span class="attachment-chip">
            <span class="attachment-icon">${esc(fileExt(file))}</span>
            <span class="attachment-name">${esc(file.name)}</span>
            <span class="attachment-meta">${esc(file.kind === "pasted" ? "pasted" : formatBytes(file.size))}</span>
            ${removable ? '<button title="移除" aria-label="移除">×</button>' : ""}
          </span>`;
      }

      function fileExt(file) {
        if (file.kind === "pasted") return "TXT";
        const name = file.name || "";
        const ext = name.includes(".") ? name.split(".").pop() : "";
        return (ext || (file.type || "file").split("/").pop() || "FILE").slice(0, 5).toUpperCase();
      }

      function formatBytes(bytes) {
        if (!bytes) return "0 B";
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
        return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      }

      function bindModelPicker(scope) {
        const trigger = els[`${scope}ModelTrigger`];
        trigger.addEventListener("click", (event) => {
          event.stopPropagation();
          toggleComposerModelDropdown(scope);
        });
      }

      function renderModelPickers() {
        ensureActiveModel();
        ["hero", "thread"].forEach((scope) => {
          els[`${scope}ModelLabel`].textContent = state.activeModel || "Model";
          renderComposerModelDropdown(scope);
        });
      }

      function renderHeroLine() {
        const title = document.querySelector(".hero-copy h1");
        if (!title) return;
        const line = HERO_LINES[Math.floor(Math.random() * HERO_LINES.length)];
        title.innerHTML = esc(line).replace(/Linsoo/g, "<em>Linsoo</em>");
      }

      function toggleComposerModelDropdown(scope) {
        const dropdown = els[`${scope}ModelDropdown`];
        const isOpen = dropdown.classList.contains("open");
        closeComposerModelDropdowns();
        if (!isOpen) {
          fetchModels({ open: false });
          dropdown.classList.add("open");
          els[`${scope}ModelTrigger`].setAttribute("aria-expanded", "true");
          renderComposerModelDropdown(scope);
          positionComposerModelDropdown(scope);
        }
      }

      function closeComposerModelDropdowns() {
        ["hero", "thread"].forEach((scope) => {
          els[`${scope}ModelDropdown`].classList.remove("open", "open-up");
          els[`${scope}ModelTrigger`].setAttribute("aria-expanded", "false");
        });
      }

      function modelChoices() {
        const seen = new Set();
        return [state.activeModel, ...state.models, ...fetchedModels]
          .filter(Boolean)
          .filter((model) => {
            if (seen.has(model)) return false;
            seen.add(model);
            return true;
          });
      }

      function renderComposerModelDropdown(scope) {
        const dropdown = els[`${scope}ModelDropdown`];
        const models = modelChoices();
        dropdown.innerHTML = models.length
          ? models.map((model) => modelOptionHTML(model)).join("")
          : `<div class="model-empty">先在设置中获取或填写模型。</div>`;
        dropdown.querySelectorAll(".model-option").forEach((btn) => {
          btn.addEventListener("click", () => {
            selectModel(btn.dataset.model);
            closeComposerModelDropdowns();
          });
        });
      }

      function positionComposerModelDropdown(scope) {
        const trigger = els[`${scope}ModelTrigger`];
        const dropdown = els[`${scope}ModelDropdown`];
        dropdown.classList.remove("open-up");
        requestAnimationFrame(() => {
          const triggerRect = trigger.getBoundingClientRect();
          const dropdownRect = dropdown.getBoundingClientRect();
          const below = window.innerHeight - triggerRect.bottom - 10;
          const above = triggerRect.top - 10;
          if (below < dropdownRect.height && above > below) dropdown.classList.add("open-up");
        });
      }

      function modelOptionHTML(model) {
        return `
          <button class="model-option${model === state.activeModel ? " active" : ""}" data-model="${esc(model)}">
            <span class="model-option-name">${esc(model)}</span>
            ${model === state.activeModel ? '<span class="model-option-check">✓</span>' : ""}
          </button>`;
      }

      function renderSidebar() {
        const folders = [...new Set(chatIndex.map((chat) => chat.folder).filter(Boolean))].sort((a, b) => a.localeCompare(b));
        els.folderList.innerHTML = folders.length
          ? folders.map((folder) => `
              <button class="folder-row${folder === activeFolder ? " active" : ""}" data-folder="${esc(folder)}">
                <span class="sidebar-icon">${ICON_FOLDER}</span><span class="folder-name">${esc(folder)}</span>
              </button>`).join("")
          : `<div class="empty-row">No folders</div>`;
        els.folderList.querySelectorAll(".folder-row").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeFolder = btn.dataset.folder === activeFolder ? "" : btn.dataset.folder;
            renderSidebar();
          });
        });

        const matches = chatIndex.filter((chat) => !activeFolder || chat.folder === activeFolder);
        const pinned = matches.filter((chat) => chat.pinned);
        const recents = matches.filter((chat) => !chat.pinned);
        els.pinnedList.innerHTML = pinned.length ? pinned.map(chatRowHTML).join("") : emptySidebarRow("No pinned chats");
        els.recentList.innerHTML = recents.length ? recents.map(chatRowHTML).join("") : emptySidebarRow("No recent chats");
        bindChatRows();
      }

      function emptySidebarRow(text) {
        return `<div class="empty-row">${esc(text)}</div>`;
      }

      function chatRowHTML(chat) {
        return `
          <button class="chat-row${currentChat?.slug === chat.slug ? " active" : ""}" data-slug="${esc(chat.slug)}">
            <span class="chat-title">${esc(chat.title)}</span>
            <span class="chat-menu-btn" data-menu="${esc(chat.slug)}" title="更多" aria-label="更多">•••</span>
          </button>`;
      }

      function openGlobalSearch() {
        els.searchOverlay.classList.add("open");
        els.globalSearchInput.value = "";
        renderGlobalSearchResults();
        setTimeout(() => els.globalSearchInput.focus(), 30);
      }

      function closeGlobalSearch() {
        els.searchOverlay.classList.remove("open");
      }

      function renderGlobalSearchResults() {
        const query = els.globalSearchInput.value.trim().toLowerCase();
        const rows = chatIndex
          .filter((chat) => !query || `${chat.title}\n${chat.text}\n${chat.folder}`.toLowerCase().includes(query))
          .slice(0, 24);
        els.globalSearchResults.innerHTML = rows.length
          ? rows.map((chat) => `
              <button class="search-result-row${chat.slug === currentChat?.slug ? " active" : ""}" data-slug="${esc(chat.slug)}">
                <span class="search-result-title">${esc(chat.title)}</span>
                <span class="search-result-time">${esc(relativeTime(chat.updatedAt))}</span>
              </button>`).join("")
          : `<div class="empty-row">No matching chats</div>`;
        els.globalSearchResults.querySelectorAll(".search-result-row").forEach((row) => {
          row.addEventListener("click", async () => {
            closeGlobalSearch();
            const slug = row.dataset.slug;
            location.hash = `chat/${encodeURIComponent(slug)}`;
            await loadChatBySlug(slug);
          });
        });
      }

      function relativeTime(value) {
        const ts = Number(value) || Date.now();
        const diff = Date.now() - ts;
        if (diff < 7 * 24 * 60 * 60 * 1000) return "Past week";
        if (diff < 31 * 24 * 60 * 60 * 1000) return "Past month";
        return "Older";
      }

      function bindChatRows() {
        document.querySelectorAll(".chat-row").forEach((row) => {
          row.addEventListener("click", async (event) => {
            if (event.target.closest(".chat-menu-btn")) return;
            const slug = row.dataset.slug;
            location.hash = `chat/${encodeURIComponent(slug)}`;
            await loadChatBySlug(slug);
          });
        });
        document.querySelectorAll(".chat-menu-btn").forEach((btn) => {
          btn.addEventListener("click", (event) => {
            event.stopPropagation();
            openChatMenu(btn.dataset.menu, btn.getBoundingClientRect());
          });
        });
      }

      function openChatMenu(slug, rect) {
        activeChatMenuSlug = slug;
        const chat = chatIndex.find((item) => item.slug === slug);
        if (!chat) return;
        els.chatMenu.innerHTML = `
          <button data-action="pin">${chat.pinned ? "取消固定" : "固定对话"}</button>
          <button data-action="rename">重命名</button>
          <button data-action="folder">添加到文件夹</button>`;
        els.chatMenu.style.left = `${Math.min(window.innerWidth - 190, rect.right + 6)}px`;
        els.chatMenu.style.top = `${Math.min(window.innerHeight - 126, rect.top)}px`;
        els.chatMenu.classList.add("open");
        document.querySelectorAll(".chat-menu-btn").forEach((item) => item.classList.toggle("open", item.dataset.menu === slug));
        els.chatMenu.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => handleChatMenu(button.dataset.action));
        });
      }

      function closeChatMenu() {
        els.chatMenu.classList.remove("open");
        document.querySelectorAll(".chat-menu-btn.open").forEach((btn) => btn.classList.remove("open"));
        activeChatMenuSlug = "";
      }

      async function handleChatMenu(action) {
        let chat = await readJsonFile(`${OPFS_CHAT_DIR}/${activeChatMenuSlug}.json`, null);
        if (!chat && currentChat?.slug === activeChatMenuSlug) {
          chat = { ...currentChat, messages };
        }
        if (!chat) return;
        if (action === "pin") {
          chat.pinned = !chat.pinned;
        }
        if (action === "rename") {
          const title = prompt("重命名对话", chat.title || chat.slug);
          if (!title) return closeChatMenu();
          chat.title = title.trim().slice(0, 80);
          chat.titlePending = false;
        }
        if (action === "folder") {
          const folder = prompt("添加到文件夹", chat.folder || "");
          if (folder === null) return closeChatMenu();
          chat.folder = folder.trim().slice(0, 48);
        }
        chat.updatedAt = Date.now();
        if (currentChat?.slug === chat.slug) {
          currentChat = {
            ...currentChat,
            title: chat.title,
            titlePending: !!chat.titlePending,
            pinned: !!chat.pinned,
            folder: chat.folder || "",
          };
        }
        await writeJsonFile(`${OPFS_CHAT_DIR}/${chat.slug}.json`, chat);
        const idx = chatIndex.findIndex((item) => item.slug === chat.slug);
        const summary = chatSummary(chat);
        if (idx >= 0) chatIndex[idx] = summary;
        else chatIndex.unshift(summary);
        chatIndex.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        closeChatMenu();
        renderSidebar();
      }

      function submitFrom(input) {
        const text = input.value.trim();
        const scope = scopeOfInput(input);
        if (running) {
          cancelRun();
          return;
        }
        if (!text && !attachments[scope].length) return;
        if (!state.apiKey) {
          openSettings();
          showToast("先填 API Key，然后就能直接进入 AI 搜索对话。");
          return;
        }

        input.value = "";
        autosize(input);
        const activeAttachments = attachments[scope].slice();
        attachments[scope] = [];
        renderAttachments(scope);
        startThread();
        ensureCurrentChat(text, activeAttachments);
        pushMessage({ role: "user", content: text || "请阅读附件。", attachments: activeAttachments });
        runAssistant();
      }

      function startThread() {
        document.body.classList.add("chat-active");
        els.hero.classList.add("hidden");
        els.thread.classList.add("active");
        els.threadComposer.style.display = "";
        updateScrollButtonOffset();
        setTimeout(() => els.threadInput.focus(), 60);
      }

      function newChat(opts = {}) {
        cancelRun();
        messages = [];
        currentChat = null;
        activeFolder = "";
        closeChatMenu();
        document.body.classList.remove("chat-active");
        els.messages.innerHTML = "";
        els.hero.classList.remove("hidden");
        els.thread.classList.remove("active");
        els.threadComposer.style.display = "none";
        els.heroInput.value = "";
        els.threadInput.value = "";
        attachments.hero = [];
        attachments.thread = [];
        renderAttachments("hero");
        renderAttachments("thread");
        updateScrollButtonOffset();
        if (!opts.preserveHash) history.pushState(null, "", location.pathname + location.search);
        renderSidebar();
        updateSendState();
        setTimeout(() => els.heroInput.focus(), 60);
      }

      function pushMessage(message) {
        const next = {
          id: window.crypto?.randomUUID ? window.crypto.randomUUID() : String(Date.now() + Math.random()),
          ...message,
        };
        messages.push(next);
        renderMessage(next);
        scrollToBottom();
        scheduleSaveChat();
        return next;
      }

      function ensureCurrentChat(text, files = []) {
        if (currentChat) return currentChat;
        const seed = text || files[0]?.name || "new chat";
        const slug = makeSlug(seed);
        currentChat = {
          id: window.crypto?.randomUUID ? window.crypto.randomUUID() : String(Date.now()),
          slug,
          title: seed.slice(0, 64),
          titlePending: true,
          pinned: false,
          folder: "",
          createdAt: Date.now(),
          updatedAt: Date.now(),
        };
        history.replaceState(null, "", `#chat/${encodeURIComponent(slug)}`);
        chatIndex.unshift(chatSummary({ ...currentChat, messages: [] }));
        renderSidebar();
        return currentChat;
      }

      function makeSlug(text) {
        const ascii = String(text || "")
          .toLowerCase()
          .replace(/https?:\/\/\S+/g, " link ")
          .replace(/[^a-z0-9\u4e00-\u9fa5]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 54);
        return `${ascii || "chat"}-${Date.now().toString(36)}`;
      }

      function parseRoute() {
        const match = location.hash.match(/^#chat\/([^/?#]+)$/);
        return match ? decodeURIComponent(match[1]) : "";
      }

      async function loadChatBySlug(slug) {
        const chat = await readJsonFile(`${OPFS_CHAT_DIR}/${slug}.json`, null);
        if (!chat) {
          showToast("没有找到这条历史对话。");
          return;
        }
        currentChat = {
          id: chat.id,
          slug: chat.slug,
          title: chat.title || chat.slug,
          titlePending: !!chat.titlePending,
          pinned: !!chat.pinned,
          folder: chat.folder || "",
          createdAt: chat.createdAt || Date.now(),
          updatedAt: chat.updatedAt || Date.now(),
        };
        messages = normalizeLoadedMessages(Array.isArray(chat.messages) ? chat.messages : []);
        els.messages.innerHTML = "";
        messages.forEach(renderMessage);
        startThread();
        updateSendState();
        renderSidebar();
        scrollToBottom();
      }

      function normalizeLoadedMessages(items) {
        return items.map((message) => {
          if (!message?.loading) return message;
          const next = { ...message, loading: false };
          if (!next.content) next.content = "生成已中断。";
          return next;
        });
      }

      function scheduleSaveChat() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveCurrentChat, 180);
      }

      async function saveCurrentChat() {
        if (!currentChat) return;
        currentChat.updatedAt = Date.now();
        await writeJsonFile(`${OPFS_CHAT_DIR}/${currentChat.slug}.json`, {
          ...currentChat,
          messages,
        });
        const idx = chatIndex.findIndex((chat) => chat.slug === currentChat.slug);
        const summary = chatSummary({ ...currentChat, messages });
        if (idx >= 0) chatIndex[idx] = summary;
        else chatIndex.unshift(summary);
        chatIndex.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        renderSidebar();
      }

      function renderMessage(message) {
        const node = document.createElement("article");
        node.className = `message ${message.role}`;
        node.dataset.id = message.id;

        if (message.role === "user") {
          const files = (message.attachments || [])
            .map((file) => attachmentCardHTML(file, false))
            .join("");
          node.innerHTML = `
            <div class="bubble">${esc(message.content)}${files ? `<div class="attachment-strip visible" style="padding:10px 0 0">${files}</div>` : ""}</div>
            <div class="user-footer">
              <button class="mini-btn copy-user-btn" title="复制" aria-label="复制">${ICON_COPY}</button>
              <button class="mini-btn edit-user-btn" title="编辑" aria-label="编辑">${ICON_EDIT}</button>
            </div>`;
          node.querySelector(".copy-user-btn").addEventListener("click", () => copyText(message.content || ""));
          node.querySelector(".edit-user-btn").addEventListener("click", () => editUserMessage(message.id));
        } else {
          node.innerHTML = `
            <div class="assistant-head">
              <div class="assistant-id"><span class="assistant-mark">L</span> Linsoo</div>
              <div class="message-actions">
                <button class="mini-btn copy-btn" title="复制" aria-label="复制">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                </button>
                <button class="mini-btn retry-btn" title="重试" aria-label="重试">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
                </button>
              </div>
            </div>
            <div class="bubble"><div class="sources"></div><div class="answer"></div><div class="assistant-footer"></div></div>`;
          node.querySelector(".copy-btn").addEventListener("click", () => copyText(message.content || ""));
          node.querySelector(".retry-btn").addEventListener("click", () => retryFrom(message.id));
          renderAssistantContent(node, message);
        }

        els.messages.appendChild(node);
      }

      function updateMessage(id, patch) {
        const message = messages.find((m) => m.id === id);
        if (!message) return;
        Object.assign(message, patch);
        const node = els.messages.querySelector(`[data-id="${CSS.escape(id)}"]`);
        if (node && message.role === "assistant") renderAssistantContent(node, message);
        scheduleSaveChat();
      }

      function editUserMessage(id) {
        if (running) return;
        const idx = messages.findIndex((m) => m.id === id);
        const message = messages[idx];
        if (!message || message.role !== "user") return;
        els.threadInput.value = message.content || "";
        attachments.thread = (message.attachments || []).map((file) => ({ ...file }));
        renderAttachments("thread");
        autosize(els.threadInput);
        messages = messages.slice(0, idx);
        els.messages.innerHTML = "";
        messages.forEach(renderMessage);
        updateSendState();
        els.threadInput.focus();
        scheduleSaveChat();
      }

      function renderAssistantContent(node, message) {
        const sources = node.querySelector(".sources");
        const answer = node.querySelector(".answer");
        const footer = node.querySelector(".assistant-footer");
        const sourceItems = extractSources(message);
        sources.innerHTML = sourceItems.map((source, i) => `
          <a class="source-chip" href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">
            <span class="source-index">${i + 1}</span>
            <span>${esc(source.title || domainOf(source.url))}</span>
          </a>`).join("");
        sources.style.display = sourceItems.length ? "" : "none";

        if (message.loading && !message.content && !message.thinking) {
          answer.innerHTML = loadingDotsHTML();
          footer.innerHTML = "";
          return;
        }
        const thinking = renderThinking(message);
        const body = message.content ? renderMarkdown(message.content) : loadingDotsHTML();
        answer.innerHTML = thinking + body;
        bindThinking(answer, message);
        bindCodeCopyButtons(answer);
        footer.innerHTML = `
          <button class="mini-btn message-action-btn copy-answer-btn" title="复制" aria-label="复制">${ICON_COPY}</button>
          <button class="mini-btn message-action-btn retry-answer-btn" title="重试" aria-label="重试">${ICON_RETRY}</button>
          <button class="mini-btn message-action-btn continue-answer-btn" title="继续追问" aria-label="继续追问">${ICON_CONTINUE}</button>`;
        footer.querySelector(".copy-answer-btn").addEventListener("click", () => copyText(message.content || ""));
        footer.querySelector(".retry-answer-btn").addEventListener("click", () => retryFrom(message.id));
        footer.querySelector(".continue-answer-btn").addEventListener("click", () => {
          els.threadInput.focus();
        });
        queueMathTypeset(answer);
      }

      function renderThinking(message) {
        if (!message.thinking) return "";
        const done = !message.loading && message.content;
        const seconds = Math.max(1, Math.round((message.thoughtSeconds || 0) / 1000));
        const label = done ? `thought for ${seconds} seconds` : "thinking...";
        return `
          <div class="thinking-block${message.thoughtOpen ? " open" : ""}">
            <button class="thinking-toggle" type="button">${esc(label)}<span>›</span></button>
            <div class="thinking-content">${esc(message.thinking)}</div>
          </div>`;
      }

      function loadingDotsHTML() {
        return `<div class="loading-line" aria-label="loading"><span class="dots"><span></span><span></span><span></span></span></div>`;
      }

      function bindThinking(root, message) {
        const button = root.querySelector(".thinking-toggle");
        if (!button) return;
        button.addEventListener("click", () => {
          message.thoughtOpen = !message.thoughtOpen;
          const node = els.messages.querySelector(`[data-id="${CSS.escape(message.id)}"]`);
          if (node) renderAssistantContent(node, message);
          scheduleSaveChat();
        });
      }

      async function runAssistant() {
        const assistant = pushMessage({ role: "assistant", content: "", loading: true });
        running = true;
        aborter = new AbortController();
        updateSendState();

        try {
          const content = await callChat(assistant.id, aborter.signal);
          updateMessage(assistant.id, { content, loading: false });
          maybeGenerateTitle();
        } catch (error) {
          if (error.name === "AbortError") {
            updateMessage(assistant.id, { content: "已停止生成。", loading: false });
          } else {
            updateMessage(assistant.id, {
              content: `请求失败：${error.message || error}\n\n请检查 Base URL、API Key、模型名，或换一个支持搜索/联网的模型。`,
              loading: false,
            });
          }
        } finally {
          running = false;
          aborter = null;
          updateSendState();
          scheduleSaveChat();
          scrollToBottom();
        }
      }

      async function maybeGenerateTitle() {
        if (!currentChat?.titlePending || !state.apiKey) return;
        const firstUser = messages.find((m) => m.role === "user");
        const firstAssistant = messages.find((m) => m.role === "assistant" && m.content);
        if (!firstUser || !firstAssistant) return;
        try {
          const response = await fetch(state.baseUrl || DEFAULT_BASE_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${state.apiKey}`,
            },
            body: JSON.stringify({
              model: state.activeModel || modelChoices()[0],
              messages: [
                { role: "system", content: "Create a concise conversation title. Return only the title, no quotes." },
                { role: "user", content: `${firstUser.content}\n\n${firstAssistant.content.slice(0, 1200)}` },
              ],
              temperature: 0.2,
              max_tokens: 24,
              stream: false,
            }),
          });
          if (!response.ok) return;
          const data = await response.json();
          const title = extractContentFromResponse(data).replace(/^["“]|["”]$/g, "").trim();
          if (title) {
            currentChat.title = title.slice(0, 80);
            currentChat.titlePending = false;
            scheduleSaveChat();
            renderSidebar();
          }
        } catch (e) {}
      }

      async function callChat(assistantId, signal) {
        const modelList = modelChoices();
        if (!modelList.length) {
          openSettings();
          throw new Error("请先在设置中选择模型。");
        }
        let lastError;
        for (const model of modelList) {
          try {
            return await callChatModel(model, assistantId, signal);
          } catch (error) {
            if (error.name === "AbortError") throw error;
            lastError = error;
          }
        }
        throw lastError || new Error("所有模型都请求失败");
      }

      async function callChatModel(model, assistantId, signal) {
        const bodyMessages = [
          { role: "system", content: buildSystemPrompt() },
          ...messages
            .filter((m) => !(m.role === "assistant" && m.id === assistantId))
            .map((m) => ({ role: m.role, content: serializeMessageContent(m) })),
        ];

        const response = await fetch(state.baseUrl || DEFAULT_BASE_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${state.apiKey}`,
          },
          body: JSON.stringify({
            model,
            messages: bodyMessages,
            temperature: state.mode === "quick" ? 0.15 : 0.35,
            max_tokens: state.mode === "quick" ? 1400 : 3800,
            stream: true,
          }),
          signal,
        });

        if (!response.ok) {
          let msg = `HTTP ${response.status}`;
          try {
            const data = await response.json();
            msg = data?.error?.message || data?.message || msg;
          } catch (e) {}
          throw new Error(msg);
        }

        const type = response.headers.get("content-type") || "";
        if (!response.body || !type.includes("text/event-stream")) {
          const data = await response.json();
          return extractContentFromResponse(data);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let content = "";
        let thinking = "";
        let thinkingStartedAt = 0;
        let thinkingEndedAt = 0;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop() || "";

          for (const part of parts) {
            const lines = part.split("\n").filter((line) => line.startsWith("data:"));
            for (const line of lines) {
              const data = line.slice(5).trim();
              if (!data || data === "[DONE]") continue;
              try {
                const json = JSON.parse(data);
                const reasoningDelta = extractReasoningDelta(json);
                const contentDelta = extractContentDelta(json);
                if (reasoningDelta) {
                  if (!thinkingStartedAt) thinkingStartedAt = Date.now();
                  thinking += reasoningDelta;
                  updateMessage(assistantId, { thinking, loading: true });
                  if (autoFollow) scrollToBottom();
                }
                if (contentDelta) {
                  if (thinkingStartedAt && !thinkingEndedAt) thinkingEndedAt = Date.now();
                  content += contentDelta;
                  updateMessage(assistantId, {
                    content,
                    thinking,
                    thoughtSeconds: thinkingEndedAt ? thinkingEndedAt - thinkingStartedAt : 0,
                    loading: false,
                  });
                  if (autoFollow) scrollToBottom();
                }
              } catch (e) {}
            }
          }
        }

        return content.trim() || "模型没有返回内容。";
      }

      function buildSystemPrompt() {
        const modeHint = {
          search: "Mode: search. Prioritize grounded answer, citations, and follow-up research directions.",
          deep: "Mode: deep. Compare possibilities, explain tradeoffs, and include a compact research map.",
          quick: "Mode: quick. Start with the answer in 2-4 sentences, then include only essential detail.",
        }[state.mode];
        return `${state.prompt || DEFAULT_PROMPT}\n\n${modeHint}`;
      }

      function serializeMessageContent(message) {
        const files = message.attachments || [];
        if (!files.length) return message.content;
        const fileContext = files
          .map((file) => {
            const body = file.text
              ? `\n${file.text}`
              : "\n[This file was attached, but its contents are not readable as plain text in the browser.]";
            return `<file name="${file.name}" type="${file.type}" size="${file.size}">${body}\n</file>`;
          })
          .join("\n\n");
        return `${message.content}\n\nAttached files:\n${fileContext}`;
      }

      function extractContentDelta(json) {
        const choice = json.choices?.[0];
        return choice?.delta?.content || choice?.message?.content || "";
      }

      function extractReasoningDelta(json) {
        const choice = json.choices?.[0];
        return choice?.delta?.reasoning_content || choice?.delta?.reasoning || choice?.message?.reasoning_content || "";
      }

      function extractContentFromResponse(data) {
        return (
          data?.choices?.[0]?.message?.content ||
          data?.choices?.[0]?.text ||
          data?.message?.content ||
          data?.content ||
          ""
        ).trim();
      }

      function retryFrom(assistantId) {
        if (running) return;
        const idx = messages.findIndex((m) => m.id === assistantId);
        if (idx <= 0) return;
        messages = messages.slice(0, idx);
        els.messages.innerHTML = "";
        messages.forEach(renderMessage);
        runAssistant();
      }

      function cancelRun() {
        if (aborter) aborter.abort();
      }

      function updateSendState() {
        const hasHero = els.heroInput.value.trim().length > 0 || attachments.hero.length > 0;
        const hasThread = els.threadInput.value.trim().length > 0 || attachments.thread.length > 0;
        [
          [els.heroSendBtn, hasHero],
          [els.threadSendBtn, hasThread],
        ].forEach(([button, hasContent]) => {
          button.disabled = running ? false : !hasContent;
          button.classList.toggle("running", running);
          button.title = running ? "停止生成" : "发送";
          button.setAttribute("aria-label", running ? "停止生成" : "发送");
        });
      }

      function openSettings() {
        els.cfgBaseUrl.value = state.baseUrl;
        els.cfgApiKey.value = state.apiKey;
        els.cfgModelInput.value = state.activeModel || state.models[0] || "";
        els.cfgPrompt.value = state.prompt || DEFAULT_PROMPT;
        renderModelList();
        switchTab("api");
        els.settingsOverlay.classList.add("open");
      }

      function closeSettings() {
        els.settingsOverlay.classList.remove("open");
      }

      async function saveSettings() {
        const oldUrl = state.baseUrl;
        state.baseUrl = els.cfgBaseUrl.value.trim();
        state.apiKey = els.cfgApiKey.value.trim();
        if (els.cfgModelInput.value.trim()) selectModel(els.cfgModelInput.value.trim(), { silent: true });
        state.prompt = els.cfgPrompt.value.trim() || DEFAULT_PROMPT;
        if (oldUrl !== state.baseUrl) {
          fetchedModels = [];
          hydrateModelsFromCache();
        }
        ensureActiveModel();
        await saveState();
        renderModelPickers();
        renderModelList();
        closeSettings();
        showToast("设置已保存。");
      }

      function applyTheme() {
        document.body.dataset.theme = state.theme === "dark" ? "dark" : "light";
      }

      function toggleTheme() {
        state.theme = state.theme === "dark" ? "light" : "dark";
        applyTheme();
        saveState();
      }

      function applySidebarState() {
        document.body.classList.toggle("sidebar-collapsed", !!state.sidebarCollapsed);
      }

      function toggleSidebar() {
        state.sidebarCollapsed = !state.sidebarCollapsed;
        applySidebarState();
        saveState();
      }

      function loadMathJax() {
        if (!/^https?:$/.test(location.protocol)) {
          mathJaxReady = Promise.resolve();
          return;
        }
        mathJaxReady = new Promise((resolve) => {
          const script = document.createElement("script");
          script.src = "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js";
          script.async = true;
          script.onload = resolve;
          script.onerror = resolve;
          document.head.appendChild(script);
        });
      }

      function switchTab(id) {
        document.querySelectorAll(".tab").forEach((tab) => {
          tab.classList.toggle("active", tab.dataset.tab === id);
        });
        els.tabApi.style.display = id === "api" ? "" : "none";
        els.tabPrompt.style.display = id === "prompt" ? "" : "none";
      }

      function selectModel(model, opts = {}) {
        if (!model) return;
        if (!state.models.includes(model)) state.models.unshift(model);
        state.activeModel = model;
        saveState();
        renderModelPickers();
        renderModelList();
        renderSettingsModelDropdown(els.cfgModelInput.value);
        if (!opts.silent) showToast(`已选择模型：${model}`);
      }

      function renderModelList() {
        els.modelList.innerHTML = "";
        if (!state.models.length) {
          const empty = document.createElement("div");
          empty.className = "field-hint";
          empty.textContent = "未添加模型。聚焦模型输入框可从当前 Base URL 获取列表。";
          els.modelList.appendChild(empty);
          return;
        }
        state.models.forEach((model, index) => {
          const token = document.createElement("span");
          token.className = "model-token";
          token.innerHTML = `<span>${esc(model)}</span><button title="移除" aria-label="移除">×</button>`;
          token.querySelector("button").addEventListener("click", () => {
            state.models.splice(index, 1);
            saveState();
            renderModelList();
          });
          els.modelList.appendChild(token);
        });
      }

      async function fetchModels({ force = false, open = false, filter = null } = {}) {
        const url = (els.cfgBaseUrl?.value.trim() || state.baseUrl || DEFAULT_BASE_URL).trim();
        const key = els.cfgApiKey?.value.trim() || state.apiKey;
        const cached = modelCache[url];
        if (!force && cached && Array.isArray(cached.models)) {
          fetchedModels = cached.models;
          if (!state.models.length) state.models = fetchedModels.slice(0, 8);
          renderModelList();
          renderModelPickers();
          if (open) renderSettingsModelDropdown(filter ?? els.cfgModelInput.value);
          return fetchedModels;
        }
        if (!key) {
          if (open) renderSettingsModelDropdown(filter ?? els.cfgModelInput.value, "填写 API Key 后可获取模型列表。");
          return [];
        }

        if (open) renderSettingsModelDropdown(filter ?? els.cfgModelInput.value, "正在获取模型列表…");
        const modelsUrl = buildModelsUrl(url);
        try {
          const response = await fetch(modelsUrl, {
            headers: { Authorization: `Bearer ${key}` },
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          fetchedModels = normalizeModels(data);
          modelCache[url] = {
            models: fetchedModels,
            savedAt: Date.now(),
          };
          await saveModelCache();
          if (!state.models.length && fetchedModels.length) state.models = fetchedModels.slice(0, 8);
          ensureActiveModel();
          await saveState();
          renderModelList();
          renderModelPickers();
          if (open) renderSettingsModelDropdown(filter ?? els.cfgModelInput.value);
          return fetchedModels;
        } catch (error) {
          if (open) renderSettingsModelDropdown(filter ?? els.cfgModelInput.value, `获取失败：${error.message}`);
          return [];
        }
      }

      function buildModelsUrl(baseUrl) {
        let url = baseUrl || DEFAULT_BASE_URL;
        url = url.replace(/\/chat\/completions\/?$/i, "/models");
        if (!/\/models\/?$/i.test(url)) url = url.replace(/\/$/, "") + "/models";
        return url;
      }

      function normalizeModels(data) {
        const list = Array.isArray(data?.data) ? data.data : Array.isArray(data?.models) ? data.models : [];
        return list
          .map((item) => (typeof item === "string" ? item : item.id || item.name))
          .filter(Boolean)
          .sort((a, b) => a.localeCompare(b));
      }

      function renderSettingsModelDropdown(filter = "", message = "") {
        const dropdown = els.settingsModelDropdown;
        const needle = filter.trim().toLowerCase();
        const models = modelChoices().filter((model) => !needle || model.toLowerCase().includes(needle));
        if (message) {
          dropdown.innerHTML = `<div class="model-empty">${esc(message)}</div>`;
        } else if (!models.length) {
          dropdown.innerHTML = `<div class="model-empty">没有匹配的模型；按 Enter 可使用当前输入。</div>`;
        } else {
          dropdown.innerHTML = models.map((model) => modelOptionHTML(model)).join("");
          dropdown.querySelectorAll(".model-option").forEach((btn) => {
            btn.addEventListener("mousedown", (event) => {
              event.preventDefault();
              els.cfgModelInput.value = btn.dataset.model;
              selectModel(btn.dataset.model, { silent: true });
              closeSettingsModelDropdown();
            });
          });
        }
        dropdown.classList.add("open");
      }

      function closeSettingsModelDropdown() {
        els.settingsModelDropdown.classList.remove("open");
      }

      function extractSources(message) {
        const fromMetadata = Array.isArray(message.sources) ? message.sources : [];
        const links = [];
        const re = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g;
        let match;
        while ((match = re.exec(message.content || ""))) {
          links.push({ title: match[1], url: match[2] });
        }
        const map = new Map();
        [...fromMetadata, ...links].forEach((source) => {
          if (source.url && !map.has(source.url)) map.set(source.url, source);
        });
        return [...map.values()].slice(0, 8);
      }

      function renderMarkdown(text) {
        const lines = String(text || "").replace(/\r\n/g, "\n").split("\n");
        const html = [];
        let i = 0;

        while (i < lines.length) {
          const line = lines[i];
          if (!line.trim()) {
            i++;
            continue;
          }

          const fence = line.match(/^```([A-Za-z0-9_+.-]*)\s*$/);
          if (fence) {
            const lang = fence[1] || "text";
            const codeLines = [];
            i++;
            while (i < lines.length && !/^```\s*$/.test(lines[i])) {
              codeLines.push(lines[i]);
              i++;
            }
            if (i < lines.length) i++;
            html.push(renderCodeBlock(codeLines.join("\n"), lang));
            continue;
          }

          if (/^\s*\$\$\s*$/.test(line)) {
            const formula = [];
            i++;
            while (i < lines.length && !/^\s*\$\$\s*$/.test(lines[i])) {
              formula.push(lines[i]);
              i++;
            }
            if (i < lines.length) i++;
            html.push(renderMathDisplay(formula.join("\n")));
            continue;
          }

          const bracketMath = line.match(/^\\\[\s*$/);
          if (bracketMath) {
            const formula = [];
            i++;
            while (i < lines.length && !/^\\\]\s*$/.test(lines[i])) {
              formula.push(lines[i]);
              i++;
            }
            if (i < lines.length) i++;
            html.push(renderMathDisplay(formula.join("\n")));
            continue;
          }

          const table = collectTable(lines, i);
          if (table) {
            html.push(renderTable(table.rows));
            i = table.next;
            continue;
          }

          const heading = line.match(/^(#{1,4})\s+(.+)$/);
          if (heading) {
            const level = Math.min(Math.max(heading[1].length, 2), 4);
            html.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            i++;
            continue;
          }

          if (/^>\s?/.test(line)) {
            const quote = [];
            while (i < lines.length && /^>\s?/.test(lines[i])) {
              quote.push(lines[i].replace(/^>\s?/, ""));
              i++;
            }
            html.push(`<blockquote>${quote.map(inlineMarkdown).join("<br>")}</blockquote>`);
            continue;
          }

          if (/^\s*[-*]\s+/.test(line)) {
            const items = [];
            while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
              items.push(lines[i].replace(/^\s*[-*]\s+/, ""));
              i++;
            }
            html.push(`<ul>${items.map((item) => `<li>${inlineMarkdown(item)}</li>`).join("")}</ul>`);
            continue;
          }

          if (/^\s*\d+\.\s+/.test(line)) {
            const items = [];
            while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
              items.push(lines[i].replace(/^\s*\d+\.\s+/, ""));
              i++;
            }
            html.push(`<ol>${items.map((item) => `<li>${inlineMarkdown(item)}</li>`).join("")}</ol>`);
            continue;
          }

          const paragraph = [line];
          i++;
          while (
            i < lines.length &&
            lines[i].trim() &&
            !/^```/.test(lines[i]) &&
            !/^(#{1,4})\s+/.test(lines[i]) &&
            !/^>\s?/.test(lines[i]) &&
            !/^\s*[-*]\s+/.test(lines[i]) &&
            !/^\s*\d+\.\s+/.test(lines[i]) &&
            !collectTable(lines, i)
          ) {
            paragraph.push(lines[i]);
            i++;
          }
          html.push(`<p>${paragraph.map(inlineMarkdown).join("<br>")}</p>`);
        }

        return html.join("");
      }

      function renderCodeBlock(code, lang) {
        return `
          <div class="code-block">
            <div class="code-head">
              <span class="code-lang">${esc(lang || "text")}</span>
              <button class="code-copy" type="button">复制</button>
            </div>
            <pre><code>${esc(code)}</code></pre>
          </div>`;
      }

      function renderMathDisplay(formula) {
        return `<div class="math-display">\\[${esc(formula)}\\]</div>`;
      }

      function collectTable(lines, start) {
        if (start + 1 >= lines.length) return null;
        if (!/^\s*\|.+\|\s*$/.test(lines[start])) return null;
        if (!/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[start + 1])) return null;
        const rows = [splitTableRow(lines[start])];
        let i = start + 2;
        while (i < lines.length && /^\s*\|.+\|\s*$/.test(lines[i])) {
          rows.push(splitTableRow(lines[i]));
          i++;
        }
        return { rows, next: i };
      }

      function splitTableRow(line) {
        return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
      }

      function renderTable(rows) {
        const [head, ...body] = rows;
        return `
          <table>
            <thead><tr>${head.map((cell) => `<th>${inlineMarkdown(cell)}</th>`).join("")}</tr></thead>
            <tbody>${body.map((row) => `<tr>${row.map((cell) => `<td>${inlineMarkdown(cell)}</td>`).join("")}</tr>`).join("")}</tbody>
          </table>`;
      }

      function inlineMarkdown(text) {
        const math = [];
        let source = String(text || "").replace(/\\\(([\s\S]+?)\\\)/g, (_, formula) => {
          const key = `@@MATH${math.length}@@`;
          math.push(`\\(${esc(formula)}\\)`);
          return key;
        });
        source = esc(source)
          .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/__([^_]+)__/g, "<strong>$1</strong>")
          .replace(/\*([^*]+)\*/g, "<em>$1</em>")
          .replace(/_([^_]+)_/g, "<em>$1</em>");
        math.forEach((formula, index) => {
          source = source.replace(`@@MATH${index}@@`, formula);
        });
        return source;
      }

      function queueMathTypeset(root) {
        if (!mathJaxReady) return;
        mathJaxReady.then(() => {
          if (!window.MathJax?.typesetPromise) return;
          window.MathJax.typesetPromise([root]).catch(() => {});
        });
      }

      function bindCodeCopyButtons(root) {
        root.querySelectorAll(".code-copy").forEach((button) => {
          button.addEventListener("click", () => {
            const code = button.closest(".code-block")?.querySelector("code")?.innerText || "";
            copyText(code);
          });
        });
      }

      function copyText(text) {
        if (!navigator.clipboard) {
          fallbackCopyText(text);
          return;
        }
        navigator.clipboard.writeText(text).then(
          () => showToast("已复制。"),
          () => fallbackCopyText(text),
        );
      }

      function fallbackCopyText(text) {
        const area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.left = "-9999px";
        area.style.top = "0";
        document.body.appendChild(area);
        area.select();
        try {
          const ok = document.execCommand("copy");
          showToast(ok ? "已复制。" : "复制失败，浏览器不允许访问剪贴板。");
        } catch (e) {
          showToast("复制失败，浏览器不允许访问剪贴板。");
        } finally {
          area.remove();
        }
      }

      function showToast(text) {
        clearTimeout(toastTimer);
        els.toast.textContent = text;
        els.toast.classList.add("visible");
        toastTimer = setTimeout(() => els.toast.classList.remove("visible"), 2300);
      }

      function scrollToBottom() {
        requestAnimationFrame(() => {
          window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "smooth" });
        });
      }

      function updateScrollButtonOffset() {
        if (!els.threadComposer || !els.scrollBtn) return;
        const visible = els.threadComposer.style.display !== "none";
        const height = visible ? els.threadComposer.getBoundingClientRect().height : 0;
        els.scrollBtn.style.bottom = `${Math.max(120, height + 34)}px`;
      }

      function domainOf(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, "");
        } catch (e) {
          return url;
        }
      }

      function esc(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      boot().catch((error) => {
        console.error(error);
        showToast("初始化失败，请刷新页面。");
      });
    </script>
  </body>
</html>
