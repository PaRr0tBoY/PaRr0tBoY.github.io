<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linsoo — AI 搜索对话</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&amp;family=DM+Mono:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f5f4ed;
        --ivory: #faf9f5;
        --white: #ffffff;
        --sand: #e8e6dc;
        --sand-2: #f0eee6;
        --ink: #141413;
        --charcoal: #30302e;
        --text-strong: #4d4c48;
        --muted: #5e5d59;
        --faint: #87867f;
        --silver: #b0aea5;
        --line: #f0eee6;
        --line-strong: #e8e6dc;
        --ring: #d1cfc5;
        --ring-deep: #c2c0b6;
        --accent: #c96442;
        --accent-2: #d97757;
        --accent-soft: #f1ded5;
        --olive: #66725d;
        --olive-soft: #e5e8de;
        --focus: #3898ec;
        --danger: #b53333;
        --danger-soft: #f4dfdc;
        --shadow-soft: 0 0 0 1px var(--line), 0 4px 24px rgba(0, 0, 0, 0.05);
        --shadow-ring: 0 0 0 1px var(--ring);
        --shadow-ring-deep: 0 0 0 1px var(--ring-deep);
        --radius-lg: 32px;
        --radius-md: 16px;
        --radius-sm: 8px;
        --speed: 0.16s ease;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        min-height: 100%;
        background: var(--paper);
      }

      body {
        min-height: 100vh;
        color: var(--ink);
        font-family: "DM Sans", Arial, sans-serif;
        background: var(--paper);
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 16% 20%, rgba(201, 100, 66, 0.045), transparent 24%),
          radial-gradient(circle at 84% 12%, rgba(102, 114, 93, 0.045), transparent 26%);
        opacity: 0.75;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .shell {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px clamp(16px, 4vw, 34px);
        background: rgba(245, 244, 237, 0.92);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 9px;
        min-width: 0;
        user-select: none;
      }

      .logo {
        font-family: "Newsreader", Georgia, serif;
        font-size: 29px;
        font-weight: 500;
        letter-spacing: -0.7px;
        line-height: 1;
      }

      .logo em {
        color: var(--accent);
        font-style: italic;
      }

      .brand-sub {
        color: var(--faint);
        font-size: 10px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .icon-btn,
      .pill-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: var(--sand);
        box-shadow: var(--shadow-ring);
        cursor: pointer;
        transition:
          background var(--speed),
          box-shadow var(--speed),
          color var(--speed);
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
      }

      .pill-btn {
        min-height: 40px;
        gap: 7px;
        border-radius: 12px;
        padding: 0 14px 0 10px;
        color: var(--text-strong);
        font-size: 14px;
        font-weight: 600;
      }

      .icon-btn:hover,
      .pill-btn:hover {
        background: var(--white);
        box-shadow: var(--shadow-ring-deep);
        color: var(--ink);
      }

      .main {
        width: min(100%, 1120px);
        margin: 0 auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: clamp(26px, 5vw, 70px) clamp(16px, 3vw, 28px) 24px;
      }

      .hero {
        min-height: min(650px, calc(100vh - 126px));
        display: grid;
        align-content: center;
        gap: 26px;
        padding: 24px 0 52px;
      }

      .hero.hidden {
        display: none;
      }

      .hero-copy {
        max-width: 720px;
        margin: 0 auto;
        text-align: center;
      }

      h1 {
        font-family: "Newsreader", Georgia, serif;
        font-size: clamp(39px, 6vw, 66px);
        line-height: 1.1;
        letter-spacing: -0.018em;
        font-weight: 500;
        text-wrap: balance;
      }

      h1 em {
        color: var(--accent);
        font-style: normal;
      }

      .composer-panel {
        width: min(100%, 760px);
        margin: 0 auto;
      }

      .composer-shell {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: var(--ivory);
        box-shadow: var(--shadow-soft);
        padding: 14px;
        transition:
          border-color var(--speed),
          box-shadow var(--speed);
      }

      .composer-shell:focus-within {
        border-color: var(--focus);
        box-shadow:
          var(--shadow-soft),
          0 0 0 3px rgba(56, 152, 236, 0.16);
      }

      .composer-input {
        width: 100%;
        min-height: 72px;
        max-height: 210px;
        resize: none;
        border: none;
        outline: none;
        background: transparent;
        color: var(--ink);
        padding: 7px 8px 0;
        font-size: 17px;
        line-height: 1.6;
      }

      .composer-input::placeholder {
        color: var(--faint);
      }

      .composer-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 40px;
      }

      .mode-strip {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .composer-tools,
      .composer-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .tool-btn,
      .model-trigger,
      .message-action-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: none;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition:
          background var(--speed),
          color var(--speed),
          box-shadow var(--speed);
      }

      .tool-btn {
        width: 36px;
        height: 36px;
        font-size: 20px;
        line-height: 1;
      }

      .tool-btn:hover,
      .message-action-btn:hover {
        background: var(--sand-2);
        color: var(--ink);
      }

      .model-picker {
        position: relative;
      }

      .model-trigger {
        min-width: 142px;
        max-width: 220px;
        height: 36px;
        justify-content: flex-start;
        padding: 0 10px;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
      }

      .model-trigger:hover,
      .model-trigger[aria-expanded="true"] {
        background: var(--sand-2);
        color: var(--ink);
      }

      .model-trigger-text {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .model-trigger-caret {
        color: var(--faint);
        flex-shrink: 0;
      }

      .model-dropdown {
        position: absolute;
        right: 0;
        bottom: calc(100% + 8px);
        z-index: 40;
        width: min(320px, calc(100vw - 32px));
        max-height: 260px;
        overflow-y: auto;
        border: 1px solid var(--line-strong);
        border-radius: 16px;
        background: var(--ivory);
        box-shadow: var(--shadow-soft), 0 18px 70px rgba(20, 20, 19, 0.1);
        padding: 6px;
        display: none;
      }

      .model-dropdown.open {
        display: block;
      }

      .model-option {
        width: 100%;
        min-height: 36px;
        display: flex;
        align-items: center;
        gap: 8px;
        border: none;
        border-radius: 10px;
        background: transparent;
        color: var(--text-strong);
        cursor: pointer;
        padding: 8px 10px;
        font-size: 13px;
        text-align: left;
      }

      .model-option:hover,
      .model-option.active {
        background: var(--sand);
      }

      .model-option-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        font-family: "DM Mono", ui-monospace, monospace;
        font-size: 12px;
      }

      .model-option-check {
        color: var(--accent);
        flex-shrink: 0;
      }

      .model-empty {
        padding: 10px 11px;
        color: var(--faint);
        font-size: 12px;
        line-height: 1.45;
      }

      .attachment-strip {
        display: none;
        flex-wrap: wrap;
        gap: 6px;
        padding: 0 4px;
      }

      .attachment-strip.visible {
        display: flex;
      }

      .attachment-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 100%;
        border-radius: 999px;
        background: var(--sand);
        box-shadow: var(--shadow-ring);
        color: var(--text-strong);
        padding: 5px 8px;
        font-size: 12px;
      }

      .attachment-chip span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .attachment-chip button {
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
      }

      .send-btn {
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 12px;
        background: var(--accent);
        color: var(--ivory);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition:
          background var(--speed),
          box-shadow var(--speed),
          opacity var(--speed);
      }

      .send-btn:hover {
        background: var(--accent-2);
        box-shadow: 0 0 0 1px var(--accent);
      }

      .send-btn:disabled {
        opacity: 0.34;
        cursor: default;
      }

      .suggestions {
        width: min(100%, 760px);
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

      .suggestion {
        min-height: 72px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(250, 249, 245, 0.74);
        padding: 16px 18px;
        text-align: left;
        cursor: pointer;
        transition:
          border-color var(--speed),
          background var(--speed),
          box-shadow var(--speed);
      }

      .suggestion:hover {
        border-color: var(--ring);
        background: var(--ivory);
        box-shadow: var(--shadow-ring);
      }

      .suggestion b {
        display: block;
        margin-bottom: 7px;
        color: var(--ink);
        font-family: "Newsreader", Georgia, serif;
        font-size: 18px;
        font-weight: 500;
        line-height: 1.2;
      }

      .suggestion span {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.43;
      }

      .thread {
        display: none;
        width: min(100%, 820px);
        margin: 0 auto;
        flex: 1;
        min-height: calc(100vh - 88px);
        flex-direction: column;
      }

      .thread.active {
        display: flex;
      }

      .messages {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 34px;
        padding: 10px 0 168px;
      }

      .message {
        display: grid;
        gap: 9px;
        animation: messageIn 0.2s ease both;
      }

      @keyframes messageIn {
        from {
          opacity: 0.86;
          transform: translateY(7px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        justify-items: end;
      }

      .bubble {
        max-width: min(92%, 720px);
        border-radius: 16px;
        padding: 13px 15px;
        line-height: 1.6;
        font-size: 16px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .user .bubble {
        background: var(--sand);
        color: var(--text-strong);
        box-shadow: var(--shadow-ring);
      }

      .assistant .bubble {
        max-width: 100%;
        padding: 0 2px;
        border-radius: 0;
        color: var(--ink);
        background: transparent;
      }

      .assistant-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 13px;
      }

      .assistant-id {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .assistant-mark {
        width: 20px;
        height: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent);
        font-family: "Newsreader", Georgia, serif;
        font-size: 14px;
        font-weight: 500;
      }

      .message-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .mini-btn {
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 10px;
        background: var(--sand-2);
        box-shadow: var(--shadow-ring);
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          color var(--speed),
          background var(--speed),
          border-color var(--speed);
      }

      .mini-btn:hover {
        color: var(--ink);
        background: var(--white);
        box-shadow: var(--shadow-ring-deep);
      }

      .assistant-footer {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 12px;
      }

      .message-action-btn {
        min-height: 32px;
        padding: 0 10px;
        font-size: 12px;
        font-weight: 500;
      }

      .answer {
        color: var(--text-strong);
        font-size: 16.5px;
        line-height: 1.72;
      }

      .answer h2,
      .answer h3 {
        margin: 18px 0 8px;
        color: var(--ink);
        font-family: "Newsreader", Georgia, serif;
        font-weight: 500;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }

      .answer p {
        margin: 0 0 12px;
      }

      .answer ul,
      .answer ol {
        margin: 8px 0 14px 22px;
      }

      .answer li {
        margin: 5px 0;
      }

      .answer code {
        border: 1px solid var(--line);
        background: var(--ivory);
        border-radius: 5px;
        padding: 1px 5px;
        font-family: "DM Mono", monospace;
        font-size: 0.88em;
      }

      .answer pre {
        overflow-x: auto;
        margin: 12px 0 16px;
        border: 1px solid var(--charcoal);
        border-radius: var(--radius-md);
        background: var(--ink);
        color: var(--silver);
        padding: 14px;
      }

      .code-block {
        margin: 14px 0 18px;
        overflow: hidden;
        border: 1px solid var(--charcoal);
        border-radius: var(--radius-md);
        background: var(--ink);
      }

      .code-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 38px;
        border-bottom: 1px solid var(--charcoal);
        padding: 0 10px 0 13px;
        color: var(--silver);
        font-size: 12px;
      }

      .code-lang {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: "DM Mono", ui-monospace, monospace;
      }

      .code-copy {
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--silver);
        cursor: pointer;
        padding: 5px 8px;
        font-size: 12px;
      }

      .code-copy:hover {
        background: var(--charcoal);
        color: var(--ivory);
      }

      .code-block pre {
        margin: 0;
        border: none;
        border-radius: 0;
      }

      .answer pre code {
        border: none;
        background: transparent;
        color: inherit;
        padding: 0;
      }

      .answer blockquote {
        margin: 12px 0 14px;
        border-left: 3px solid var(--line-strong);
        padding: 2px 0 2px 14px;
        color: var(--muted);
      }

      .answer table {
        width: 100%;
        border-collapse: collapse;
        margin: 12px 0 16px;
        font-size: 14px;
      }

      .answer th,
      .answer td {
        border: 1px solid var(--line-strong);
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
      }

      .answer th {
        background: var(--sand);
        color: var(--ink);
        font-weight: 600;
      }

      .answer a {
        color: var(--accent);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      .sources {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0 18px;
      }

      .source-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        max-width: 100%;
        border: none;
        border-radius: 999px;
        background: var(--ivory);
        box-shadow: var(--shadow-ring);
        color: var(--muted);
        padding: 7px 10px;
        font-size: 12px;
        text-decoration: none;
      }

      .source-chip:hover {
        color: var(--ink);
        background: var(--white);
        box-shadow: var(--shadow-ring-deep);
      }

      .source-index {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--sand);
        color: var(--text-strong);
        font-size: 10px;
        font-weight: 700;
        flex-shrink: 0;
      }

      .loading-line {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      .dots {
        display: inline-flex;
        gap: 4px;
      }

      .dots span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
        animation: blink 1.1s ease-in-out infinite;
      }

      .dots span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .dots span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.2;
          transform: scale(0.72);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }

      .thread-composer {
        position: fixed;
        left: 50%;
        bottom: 20px;
        z-index: 15;
        width: min(calc(100% - 28px), 820px);
        transform: translateX(-50%);
      }

      .thread-composer .composer-shell {
        box-shadow: var(--shadow-soft), 0 18px 70px rgba(20, 20, 19, 0.08);
      }

      .thread-composer .composer-input {
        min-height: 44px;
      }

      .scroll-btn {
        position: fixed;
        left: 50%;
        bottom: 136px;
        z-index: 16;
        transform: translateX(-50%);
        opacity: 0;
        pointer-events: none;
      }

      .scroll-btn.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .toast {
        position: fixed;
        top: 78px;
        left: 50%;
        z-index: 80;
        transform: translate(-50%, -14px);
        opacity: 0;
        visibility: hidden;
        max-width: min(92vw, 560px);
        border: none;
        border-radius: 16px;
        background: var(--ivory);
        box-shadow: var(--shadow-soft);
        color: var(--muted);
        padding: 9px 14px;
        font-size: 13px;
        transition:
          opacity var(--speed),
          visibility var(--speed),
          transform var(--speed);
      }

      .toast.visible {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, 0);
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(20, 20, 19, 0.38);
      }

      .overlay.open {
        display: flex;
      }

      .modal {
        width: min(100%, 560px);
        max-height: 88vh;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--ivory);
        box-shadow: 0 0 0 1px rgba(209, 207, 197, 0.7), 0 4px 24px rgba(0, 0, 0, 0.05);
        animation: modalIn 0.17s ease both;
      }

      @keyframes modalIn {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .modal-head {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        background: var(--ivory);
        padding: 18px 20px 14px;
      }

      .modal-title {
        font-family: "Newsreader", Georgia, serif;
        font-size: 23px;
        font-weight: 500;
      }

      .modal-body {
        padding: 18px 20px 20px;
      }

      .tabs {
        display: flex;
        gap: 4px;
        border-radius: var(--radius-md);
        background: var(--sand);
        padding: 4px;
        margin-bottom: 18px;
      }

      .tab {
        flex: 1;
        border: none;
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        padding: 8px 10px;
        font-size: 13px;
        font-weight: 500;
      }

      .tab.active {
        background: var(--ivory);
        color: var(--ink);
        box-shadow: 0 1px 2px rgba(54, 44, 32, 0.05);
      }

      .field {
        margin-bottom: 16px;
      }

      .field-label {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .field-hint {
        margin-top: 6px;
        color: var(--faint);
        font-size: 11.5px;
        line-height: 1.55;
      }

      .input,
      .textarea {
        width: 100%;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: var(--paper);
        color: var(--ink);
        outline: none;
        padding: 10px 12px;
        font-size: 13.5px;
        transition:
          border-color var(--speed),
          box-shadow var(--speed),
          background var(--speed);
      }

      .input:focus,
      .textarea:focus {
        border-color: var(--focus);
        background: var(--ivory);
        box-shadow: 0 0 0 3px rgba(56, 152, 236, 0.16);
      }

      .mono {
        font-family: "DM Mono", ui-monospace, monospace;
        font-size: 12.5px;
      }

      .textarea {
        min-height: 210px;
        resize: vertical;
        line-height: 1.65;
      }

      .modal-foot {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      .primary-btn,
      .ghost-btn {
        min-height: 40px;
        border-radius: 12px;
        cursor: pointer;
        padding: 0 16px;
        font-size: 13px;
        font-weight: 600;
        transition:
          background var(--speed),
          border-color var(--speed),
          color var(--speed);
      }

      .primary-btn {
        border: none;
        background: var(--accent);
        color: var(--ivory);
        box-shadow: 0 0 0 1px var(--accent);
      }

      .primary-btn:hover {
        background: var(--accent-2);
      }

      .ghost-btn {
        border: none;
        background: transparent;
        color: var(--muted);
      }

      .ghost-btn:hover {
        background: var(--sand);
        color: var(--ink);
      }

      .model-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .model-row .input {
        flex: 1;
      }

      .settings-model-wrap {
        position: relative;
        flex: 1;
      }

      .settings-model-wrap .input {
        border-radius: 12px 12px 0 0;
      }

      .settings-model-dd {
        position: absolute;
        top: calc(100% - 1px);
        left: 0;
        right: 0;
        z-index: 70;
        max-height: 220px;
        overflow-y: auto;
        border: 1px solid var(--line-strong);
        border-top: none;
        border-radius: 0 0 12px 12px;
        background: var(--ivory);
        box-shadow: 0 16px 34px rgba(20, 20, 19, 0.08);
        display: none;
        padding: 4px;
      }

      .settings-model-dd.open {
        display: block;
      }

      .model-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 9px;
      }

      .model-token {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: none;
        border-radius: 999px;
        background: var(--sand);
        box-shadow: var(--shadow-ring);
        padding: 5px 9px;
        color: var(--muted);
        font-family: "DM Mono", ui-monospace, monospace;
        font-size: 11.5px;
      }

      .model-token:first-child {
        color: var(--text-strong);
        background: var(--olive-soft);
      }

      .model-token button {
        border: none;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
      }

      @media (max-width: 720px) {
        .topbar {
          height: 64px;
        }

        .brand-sub {
          display: none;
        }

        .pill-btn span {
          display: none;
        }

        .hero {
          min-height: calc(100vh - 110px);
          padding-top: 8px;
        }

        .suggestions {
          grid-template-columns: 1fr;
        }

        .model-trigger {
          min-width: 112px;
          max-width: 146px;
        }

        .composer-input {
          font-size: 16px;
        }

        h1 {
          font-size: clamp(35px, 10vw, 44px);
          line-height: 1.15;
        }

        .messages {
          padding-bottom: 152px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand" aria-label="Linsoo">
          <div class="logo">L<em>i</em>nsoo</div>
          <div class="brand-sub">answer-first search</div>
        </div>
        <div class="top-actions">
          <button class="pill-btn" id="newChatBtn" title="新对话">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 5v14M5 12h14" />
            </svg>
            <span>新对话</span>
          </button>
          <button class="icon-btn" id="settingsBtn" title="设置" aria-label="设置">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </header>

      <main class="main">
        <section class="hero" id="hero">
          <div class="hero-copy">
            <h1>研究任何问题。<br /><em>Linsoo</em> 直接回答。</h1>
          </div>
          <div class="composer-panel">
            <div class="composer-shell">
              <textarea
                class="composer-input"
                id="heroInput"
                placeholder="How can I help you today?"
                spellcheck="false"
              ></textarea>
              <div class="attachment-strip" id="heroAttachments"></div>
              <div class="composer-row">
                <div class="composer-tools">
                  <button class="tool-btn upload-btn" data-input="heroFileInput" title="上传文件" aria-label="上传文件">+</button>
                  <input id="heroFileInput" class="file-input" type="file" multiple hidden />
                </div>
                <div class="composer-actions">
                  <div class="model-picker" id="heroModelPicker">
                    <button class="model-trigger" id="heroModelTrigger" aria-expanded="false" title="选择模型">
                      <span class="model-trigger-text" id="heroModelLabel"></span>
                      <span class="model-trigger-caret">⌄</span>
                    </button>
                    <div class="model-dropdown" id="heroModelDropdown"></div>
                  </div>
                  <button class="send-btn" id="heroSendBtn" title="发送" aria-label="发送">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
                      <path d="M12 19V5M5 12l7-7 7 7" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="suggestions" id="suggestions"></div>
        </section>

        <section class="thread" id="thread" aria-live="polite">
          <div class="messages" id="messages"></div>
        </section>
      </main>

      <button class="icon-btn scroll-btn" id="scrollBtn" title="回到底部" aria-label="回到底部">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12l7 7 7-7" />
        </svg>
      </button>

      <div class="thread-composer" id="threadComposer" style="display: none">
        <div class="composer-shell">
          <textarea
            class="composer-input"
            id="threadInput"
            placeholder="Ask anything"
            spellcheck="false"
          ></textarea>
          <div class="attachment-strip" id="threadAttachments"></div>
          <div class="composer-row">
            <div class="composer-tools">
              <button class="tool-btn upload-btn" data-input="threadFileInput" title="上传文件" aria-label="上传文件">+</button>
              <input id="threadFileInput" class="file-input" type="file" multiple hidden />
            </div>
            <div class="composer-actions">
              <div class="model-picker" id="threadModelPicker">
                <button class="model-trigger" id="threadModelTrigger" aria-expanded="false" title="选择模型">
                  <span class="model-trigger-text" id="threadModelLabel"></span>
                  <span class="model-trigger-caret">⌄</span>
                </button>
                <div class="model-dropdown" id="threadModelDropdown"></div>
              </div>
              <button class="send-btn" id="threadSendBtn" title="发送" aria-label="发送">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
                  <path d="M12 19V5M5 12l7-7 7 7" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="overlay" id="settingsOverlay">
      <div class="modal">
        <div class="modal-head">
          <div class="modal-title">Linsoo 设置</div>
          <button class="icon-btn" id="settingsClose" title="关闭" aria-label="关闭">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="tabs">
            <button class="tab active" data-tab="api">API</button>
            <button class="tab" data-tab="prompt">Prompt</button>
          </div>
          <div id="tabApi">
            <div class="field">
              <div class="field-label">Base URL</div>
              <input class="input mono" id="cfgBaseUrl" type="text" placeholder="https://open.bigmodel.cn/api/paas/v4/chat/completions" />
              <div class="field-hint">OpenAI 兼容 chat completions 端点；留空沿用默认智谱 AI 地址。</div>
            </div>
            <div class="field">
              <div class="field-label">API Key</div>
              <input class="input mono" id="cfgApiKey" type="password" placeholder="sk-..." />
              <div class="field-hint">仅保存在本机 localStorage。新页面会尝试读取原 Linso 的 API 配置作为初始值。</div>
            </div>
            <div class="field">
              <div class="field-label">Models</div>
              <div class="model-row">
                <div class="settings-model-wrap">
                  <input class="input mono" id="cfgModelInput" type="text" placeholder="聚焦后自动获取模型列表" autocomplete="off" spellcheck="false" />
                  <div class="settings-model-dd" id="settingsModelDropdown"></div>
                </div>
                <button class="primary-btn" id="refreshModelsBtn">刷新</button>
              </div>
              <div class="field-hint">模型列表来自当前 Base URL 的 /models 端点，并按 Base URL 缓存在本地。</div>
              <div class="model-list" id="modelList"></div>
            </div>
          </div>
          <div id="tabPrompt" style="display: none">
            <div class="field">
              <div class="field-label">
                System Prompt
                <button class="ghost-btn" id="resetPromptBtn" style="min-height: 24px; padding: 0 9px">恢复默认</button>
              </div>
              <textarea class="textarea mono" id="cfgPrompt"></textarea>
              <div class="field-hint">这个提示词用于“搜索回答”模式，不再要求模型输出查询词 JSON。</div>
            </div>
          </div>
          <div class="modal-foot">
            <button class="ghost-btn" id="settingsCancel">取消</button>
            <button class="primary-btn" id="settingsSave">保存</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const DEFAULT_BASE_URL = "https://open.bigmodel.cn/api/paas/v4/chat/completions";
      const STORAGE_KEY = "linsoo_v1";
      const LINSO_STORAGE_KEY = "linso_v3";
      const MODEL_CACHE_KEY = "linsoo_model_cache_v1";
      const MAX_FILE_CHARS = 12000;
      const DEFAULT_PROMPT = `You are Linsoo, an answer-first AI search engine in the style of Perplexity and Grok.

Your job:
- Answer the user's search question directly, then help them continue the investigation.
- Prefer current, source-grounded answers when the selected model has web/search access.
- If you do not have live web access, say that clearly and answer from available knowledge without pretending you browsed.
- When sources are available in the model output or tool results, cite them with Markdown links near the claims.
- Keep the answer structured, concrete, and concise.
- For Chinese questions, answer in Chinese unless the user asks otherwise.

Output normal Markdown. Do not output JSON unless the user asks for it.`;

      const SUGGESTIONS = [
        {
          title: "追踪最新动态",
          body: "Claude、Grok、Perplexity 最近的搜索体验差异",
          prompt: "Claude、Grok、Perplexity 最近的搜索体验有什么差异？请按设计、引用、追问体验比较。",
        },
        {
          title: "找资料并给出处",
          body: "某个技术主题的核心来源和阅读路径",
          prompt: "帮我梳理 assistant-ui 的核心设计思想，并给我一个阅读它源码的路径。",
        },
        {
          title: "做决策",
          body: "把搜索结果变成可执行建议",
          prompt: "我想做一个 AI 搜索工具，应该优先实现哪些交互，哪些可以延后？",
        },
        {
          title: "继续研究",
          body: "围绕一个问题连续追问",
          prompt: "用 Perplexity 风格帮我研究：AI 搜索产品如何处理来源可信度？",
        },
      ];

      let state = {
        baseUrl: "",
        apiKey: "",
        models: [],
        activeModel: "",
        prompt: DEFAULT_PROMPT,
        mode: "search",
      };

      let messages = [];
      let attachments = {
        hero: [],
        thread: [],
      };
      let modelCache = {};
      let fetchedModels = [];
      let running = false;
      let aborter = null;
      let autoFollow = true;
      let toastTimer = null;

      const els = {};

      function boot() {
        cacheEls();
        loadState();
        loadModelCache();
        hydrateModelsFromCache();
        ensureActiveModel();
        renderModelPickers();
        renderAttachments("hero");
        renderAttachments("thread");
        renderSuggestions();
        renderModelList();
        bindEvents();
        updateSendState();

        const q = new URLSearchParams(window.location.search).get("q");
        if (q && q.trim()) {
          els.heroInput.value = q.trim();
          submitFrom(els.heroInput);
        }
      }

      function cacheEls() {
        [
          "hero",
          "thread",
          "messages",
          "heroInput",
          "threadInput",
          "heroAttachments",
          "threadAttachments",
          "heroSendBtn",
          "threadSendBtn",
          "threadComposer",
          "heroFileInput",
          "threadFileInput",
          "heroModelTrigger",
          "threadModelTrigger",
          "heroModelLabel",
          "threadModelLabel",
          "heroModelDropdown",
          "threadModelDropdown",
          "suggestions",
          "settingsBtn",
          "settingsOverlay",
          "settingsClose",
          "settingsCancel",
          "settingsSave",
          "newChatBtn",
          "scrollBtn",
          "toast",
          "cfgBaseUrl",
          "cfgApiKey",
          "cfgModelInput",
          "refreshModelsBtn",
          "settingsModelDropdown",
          "modelList",
          "cfgPrompt",
          "resetPromptBtn",
          "tabApi",
          "tabPrompt",
        ].forEach((id) => {
          els[id] = document.getElementById(id);
        });
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) Object.assign(state, JSON.parse(raw));
        } catch (e) {}

        try {
          const linso = JSON.parse(localStorage.getItem(LINSO_STORAGE_KEY) || "{}");
          if (!state.baseUrl && linso.baseUrl) state.baseUrl = linso.baseUrl;
          if (!state.apiKey && linso.apiKey) state.apiKey = linso.apiKey;
          if (!state.models.length && Array.isArray(linso.models)) {
            state.models = linso.models.slice(0, 4);
          }
        } catch (e) {}

        if (!state.prompt) state.prompt = DEFAULT_PROMPT;
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      function loadModelCache() {
        try {
          modelCache = JSON.parse(localStorage.getItem(MODEL_CACHE_KEY) || "{}");
        } catch (e) {
          modelCache = {};
        }
      }

      function saveModelCache() {
        try {
          localStorage.setItem(MODEL_CACHE_KEY, JSON.stringify(modelCache));
        } catch (e) {}
      }

      function modelCacheUrl() {
        return (state.baseUrl || DEFAULT_BASE_URL).trim();
      }

      function hydrateModelsFromCache() {
        const cached = modelCache[modelCacheUrl()];
        if (cached && Array.isArray(cached.models)) {
          fetchedModels = cached.models;
          if (!state.models.length) state.models = cached.models.slice(0, 8);
        }
      }

      function ensureActiveModel() {
        if (state.activeModel) return;
        state.activeModel = state.models[0] || fetchedModels[0] || "glm-4-flash";
      }

      function bindEvents() {
        bindComposer(els.heroInput, els.heroSendBtn);
        bindComposer(els.threadInput, els.threadSendBtn);
        bindFileInput("hero");
        bindFileInput("thread");
        bindModelPicker("hero");
        bindModelPicker("thread");

        els.settingsBtn.addEventListener("click", openSettings);
        els.settingsClose.addEventListener("click", closeSettings);
        els.settingsCancel.addEventListener("click", closeSettings);
        els.settingsOverlay.addEventListener("click", (event) => {
          if (event.target === els.settingsOverlay) closeSettings();
        });
        els.settingsSave.addEventListener("click", saveSettings);
        els.newChatBtn.addEventListener("click", newChat);
        els.scrollBtn.addEventListener("click", () => {
          autoFollow = true;
          scrollToBottom();
        });

        document.querySelectorAll(".tab").forEach((tab) => {
          tab.addEventListener("click", () => switchTab(tab.dataset.tab));
        });

        els.refreshModelsBtn.addEventListener("click", () => fetchModels({ force: true, open: true }));
        els.cfgModelInput.addEventListener("focus", () => {
          els.cfgModelInput.select();
          fetchModels({ open: true, filter: "" });
        });
        els.cfgModelInput.addEventListener("input", () => renderSettingsModelDropdown(els.cfgModelInput.value));
        els.cfgModelInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            selectModel(els.cfgModelInput.value.trim());
          }
          if (event.key === "Escape") {
            closeSettingsModelDropdown();
          }
        });
        els.cfgModelInput.addEventListener("blur", () => {
          setTimeout(closeSettingsModelDropdown, 140);
        });
        els.resetPromptBtn.addEventListener("click", () => {
          els.cfgPrompt.value = DEFAULT_PROMPT;
        });

        document.addEventListener("click", (event) => {
          if (!event.target.closest(".model-picker")) closeComposerModelDropdowns();
        });

        window.addEventListener("scroll", () => {
          const distance = document.documentElement.scrollHeight - window.innerHeight - window.scrollY;
          autoFollow = distance < 120;
          els.scrollBtn.classList.toggle("visible", !autoFollow && messages.length > 0);
        }, { passive: true });
      }

      function bindComposer(input, button) {
        input.addEventListener("input", () => {
          autosize(input);
          updateSendState();
        });
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            submitFrom(input);
          }
          if (event.key === "Escape" && running) {
            cancelRun();
          }
        });
        button.addEventListener("click", () => submitFrom(input));
      }

      function autosize(input) {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 210) + "px";
      }

      function bindFileInput(scope) {
        const input = els[`${scope}FileInput`];
        input.addEventListener("change", async () => {
          await addFiles(scope, [...input.files]);
          input.value = "";
        });
        document.querySelectorAll(`.upload-btn[data-input="${input.id}"]`).forEach((btn) => {
          btn.addEventListener("click", () => input.click());
        });
      }

      async function addFiles(scope, files) {
        for (const file of files) {
          const item = {
            id: window.crypto?.randomUUID ? window.crypto.randomUUID() : String(Date.now() + Math.random()),
            name: file.name,
            type: file.type || "file",
            size: file.size,
            text: "",
          };
          if (isReadableTextFile(file)) {
            try {
              item.text = (await file.text()).slice(0, MAX_FILE_CHARS);
            } catch (e) {
              item.text = "";
            }
          }
          attachments[scope].push(item);
        }
        renderAttachments(scope);
      }

      function isReadableTextFile(file) {
        return (
          file.type.startsWith("text/") ||
          file.type.includes("json") ||
          file.type.includes("xml") ||
          /\.(md|txt|json|csv|tsv|xml|html|css|js|ts|tsx|jsx|py|rb|go|rs|java|c|cpp|h|yaml|yml)$/i.test(file.name)
        );
      }

      function renderAttachments(scope) {
        const mount = els[`${scope}Attachments`];
        mount.innerHTML = "";
        attachments[scope].forEach((file) => {
          const chip = document.createElement("span");
          chip.className = "attachment-chip";
          chip.innerHTML = `<span>${esc(file.name)}</span><button title="移除" aria-label="移除">×</button>`;
          chip.querySelector("button").addEventListener("click", () => {
            attachments[scope] = attachments[scope].filter((item) => item.id !== file.id);
            renderAttachments(scope);
          });
          mount.appendChild(chip);
        });
        mount.classList.toggle("visible", attachments[scope].length > 0);
      }

      function bindModelPicker(scope) {
        const trigger = els[`${scope}ModelTrigger`];
        trigger.addEventListener("click", (event) => {
          event.stopPropagation();
          toggleComposerModelDropdown(scope);
        });
      }

      function renderModelPickers() {
        ensureActiveModel();
        ["hero", "thread"].forEach((scope) => {
          els[`${scope}ModelLabel`].textContent = state.activeModel;
          renderComposerModelDropdown(scope);
        });
      }

      function toggleComposerModelDropdown(scope) {
        const dropdown = els[`${scope}ModelDropdown`];
        const isOpen = dropdown.classList.contains("open");
        closeComposerModelDropdowns();
        if (!isOpen) {
          fetchModels({ open: false });
          dropdown.classList.add("open");
          els[`${scope}ModelTrigger`].setAttribute("aria-expanded", "true");
          renderComposerModelDropdown(scope);
        }
      }

      function closeComposerModelDropdowns() {
        ["hero", "thread"].forEach((scope) => {
          els[`${scope}ModelDropdown`].classList.remove("open");
          els[`${scope}ModelTrigger`].setAttribute("aria-expanded", "false");
        });
      }

      function modelChoices() {
        const seen = new Set();
        return [state.activeModel, ...state.models, ...fetchedModels, "glm-4-flash"]
          .filter(Boolean)
          .filter((model) => {
            if (seen.has(model)) return false;
            seen.add(model);
            return true;
          });
      }

      function renderComposerModelDropdown(scope) {
        const dropdown = els[`${scope}ModelDropdown`];
        const models = modelChoices();
        dropdown.innerHTML = models
          .map((model) => modelOptionHTML(model))
          .join("");
        dropdown.querySelectorAll(".model-option").forEach((btn) => {
          btn.addEventListener("click", () => {
            selectModel(btn.dataset.model);
            closeComposerModelDropdowns();
          });
        });
      }

      function modelOptionHTML(model) {
        return `
          <button class="model-option${model === state.activeModel ? " active" : ""}" data-model="${esc(model)}">
            <span class="model-option-name">${esc(model)}</span>
            ${model === state.activeModel ? '<span class="model-option-check">✓</span>' : ""}
          </button>`;
      }

      function renderSuggestions() {
        els.suggestions.innerHTML = "";
        SUGGESTIONS.forEach((item) => {
          const btn = document.createElement("button");
          btn.className = "suggestion";
          btn.innerHTML = `<b>${esc(item.title)}</b><span>${esc(item.body)}</span>`;
          btn.addEventListener("click", () => {
            els.heroInput.value = item.prompt;
            autosize(els.heroInput);
            submitFrom(els.heroInput);
          });
          els.suggestions.appendChild(btn);
        });
      }

      function submitFrom(input) {
        const text = input.value.trim();
        if (!text || running) return;
        if (!state.apiKey) {
          openSettings();
          showToast("先填 API Key，然后就能直接进入 AI 搜索对话。");
          return;
        }

        input.value = "";
        autosize(input);
        const scope = input === els.heroInput ? "hero" : "thread";
        const activeAttachments = attachments[scope].slice();
        attachments[scope] = [];
        renderAttachments(scope);
        startThread();
        pushMessage({ role: "user", content: text, attachments: activeAttachments });
        runAssistant();
      }

      function startThread() {
        els.hero.classList.add("hidden");
        els.thread.classList.add("active");
        els.threadComposer.style.display = "";
        setTimeout(() => els.threadInput.focus(), 60);
      }

      function newChat() {
        cancelRun();
        messages = [];
        els.messages.innerHTML = "";
        els.hero.classList.remove("hidden");
        els.thread.classList.remove("active");
        els.threadComposer.style.display = "none";
        els.heroInput.value = "";
        els.threadInput.value = "";
        updateSendState();
        setTimeout(() => els.heroInput.focus(), 60);
      }

      function pushMessage(message) {
        const next = {
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
          ...message,
        };
        messages.push(next);
        renderMessage(next);
        scrollToBottom();
        return next;
      }

      function renderMessage(message) {
        const node = document.createElement("article");
        node.className = `message ${message.role}`;
        node.dataset.id = message.id;

        if (message.role === "user") {
          const files = (message.attachments || [])
            .map((file) => `<span class="attachment-chip"><span>${esc(file.name)}</span></span>`)
            .join("");
          node.innerHTML = `<div class="bubble">${esc(message.content)}${files ? `<div class="attachment-strip visible" style="padding:10px 0 0">${files}</div>` : ""}</div>`;
        } else {
          node.innerHTML = `
            <div class="assistant-head">
              <div class="assistant-id"><span class="assistant-mark">L</span> Linsoo</div>
              <div class="message-actions">
                <button class="mini-btn copy-btn" title="复制" aria-label="复制">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                </button>
                <button class="mini-btn retry-btn" title="重试" aria-label="重试">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
                </button>
              </div>
            </div>
            <div class="bubble"><div class="sources"></div><div class="answer"></div><div class="assistant-footer"></div></div>`;
          node.querySelector(".copy-btn").addEventListener("click", () => copyText(message.content || ""));
          node.querySelector(".retry-btn").addEventListener("click", () => retryFrom(message.id));
          renderAssistantContent(node, message);
        }

        els.messages.appendChild(node);
      }

      function updateMessage(id, patch) {
        const message = messages.find((m) => m.id === id);
        if (!message) return;
        Object.assign(message, patch);
        const node = els.messages.querySelector(`[data-id="${CSS.escape(id)}"]`);
        if (node && message.role === "assistant") renderAssistantContent(node, message);
      }

      function renderAssistantContent(node, message) {
        const sources = node.querySelector(".sources");
        const answer = node.querySelector(".answer");
        const footer = node.querySelector(".assistant-footer");
        const sourceItems = extractSources(message);
        sources.innerHTML = sourceItems.map((source, i) => `
          <a class="source-chip" href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">
            <span class="source-index">${i + 1}</span>
            <span>${esc(source.title || domainOf(source.url))}</span>
          </a>`).join("");
        sources.style.display = sourceItems.length ? "" : "none";

        if (message.loading && !message.content) {
          answer.innerHTML = `<div class="loading-line"><span class="dots"><span></span><span></span><span></span></span><span>正在检索和组织答案…</span></div>`;
          footer.innerHTML = "";
          return;
        }
        answer.innerHTML = renderMarkdown(message.content || "");
        bindCodeCopyButtons(answer);
        footer.innerHTML = `
          <button class="message-action-btn copy-answer-btn">复制</button>
          <button class="message-action-btn retry-answer-btn">重试</button>
          <button class="message-action-btn continue-answer-btn">继续追问</button>`;
        footer.querySelector(".copy-answer-btn").addEventListener("click", () => copyText(message.content || ""));
        footer.querySelector(".retry-answer-btn").addEventListener("click", () => retryFrom(message.id));
        footer.querySelector(".continue-answer-btn").addEventListener("click", () => {
          els.threadInput.focus();
        });
      }

      async function runAssistant() {
        const assistant = pushMessage({ role: "assistant", content: "", loading: true });
        running = true;
        aborter = new AbortController();
        updateSendState();

        try {
          const content = await callChat(assistant.id, aborter.signal);
          updateMessage(assistant.id, { content, loading: false });
        } catch (error) {
          if (error.name === "AbortError") {
            updateMessage(assistant.id, { content: "已停止生成。", loading: false });
          } else {
            updateMessage(assistant.id, {
              content: `请求失败：${error.message || error}\n\n请检查 Base URL、API Key、模型名，或换一个支持搜索/联网的模型。`,
              loading: false,
            });
          }
        } finally {
          running = false;
          aborter = null;
          updateSendState();
          scrollToBottom();
        }
      }

      async function callChat(assistantId, signal) {
        const modelList = modelChoices();
        let lastError;
        for (const model of modelList) {
          try {
            return await callChatModel(model, assistantId, signal);
          } catch (error) {
            if (error.name === "AbortError") throw error;
            lastError = error;
          }
        }
        throw lastError || new Error("所有模型都请求失败");
      }

      async function callChatModel(model, assistantId, signal) {
        const bodyMessages = [
          { role: "system", content: buildSystemPrompt() },
          ...messages
            .filter((m) => !(m.role === "assistant" && m.id === assistantId))
            .map((m) => ({ role: m.role, content: serializeMessageContent(m) })),
        ];

        const response = await fetch(state.baseUrl || DEFAULT_BASE_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${state.apiKey}`,
          },
          body: JSON.stringify({
            model,
            messages: bodyMessages,
            temperature: state.mode === "quick" ? 0.15 : 0.35,
            max_tokens: state.mode === "quick" ? 1400 : 3800,
            stream: true,
          }),
          signal,
        });

        if (!response.ok) {
          let msg = `HTTP ${response.status}`;
          try {
            const data = await response.json();
            msg = data?.error?.message || data?.message || msg;
          } catch (e) {}
          throw new Error(msg);
        }

        const type = response.headers.get("content-type") || "";
        if (!response.body || !type.includes("text/event-stream")) {
          const data = await response.json();
          return extractContentFromResponse(data);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let content = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop() || "";

          for (const part of parts) {
            const lines = part.split("\n").filter((line) => line.startsWith("data:"));
            for (const line of lines) {
              const data = line.slice(5).trim();
              if (!data || data === "[DONE]") continue;
              try {
                const json = JSON.parse(data);
                const delta = extractDelta(json);
                if (delta) {
                  content += delta;
                  updateMessage(assistantId, { content, loading: false });
                  if (autoFollow) scrollToBottom();
                }
              } catch (e) {}
            }
          }
        }

        return content.trim() || "模型没有返回内容。";
      }

      function buildSystemPrompt() {
        const modeHint = {
          search: "Mode: search. Prioritize grounded answer, citations, and follow-up research directions.",
          deep: "Mode: deep. Compare possibilities, explain tradeoffs, and include a compact research map.",
          quick: "Mode: quick. Start with the answer in 2-4 sentences, then include only essential detail.",
        }[state.mode];
        return `${state.prompt || DEFAULT_PROMPT}\n\n${modeHint}`;
      }

      function serializeMessageContent(message) {
        const files = message.attachments || [];
        if (!files.length) return message.content;
        const fileContext = files
          .map((file) => {
            const body = file.text
              ? `\n${file.text}`
              : "\n[This file was attached, but its contents are not readable as plain text in the browser.]";
            return `<file name="${file.name}" type="${file.type}" size="${file.size}">${body}\n</file>`;
          })
          .join("\n\n");
        return `${message.content}\n\nAttached files:\n${fileContext}`;
      }

      function extractDelta(json) {
        const choice = json.choices?.[0];
        return choice?.delta?.content || choice?.delta?.reasoning_content || choice?.message?.content || "";
      }

      function extractContentFromResponse(data) {
        return (
          data?.choices?.[0]?.message?.content ||
          data?.choices?.[0]?.text ||
          data?.message?.content ||
          data?.content ||
          ""
        ).trim();
      }

      function retryFrom(assistantId) {
        if (running) return;
        const idx = messages.findIndex((m) => m.id === assistantId);
        if (idx <= 0) return;
        messages = messages.slice(0, idx);
        els.messages.innerHTML = "";
        messages.forEach(renderMessage);
        runAssistant();
      }

      function cancelRun() {
        if (aborter) aborter.abort();
      }

      function updateSendState() {
        const hasHero = els.heroInput.value.trim().length > 0;
        const hasThread = els.threadInput.value.trim().length > 0;
        els.heroSendBtn.disabled = !hasHero || running;
        els.threadSendBtn.disabled = !hasThread || running;
      }

      function openSettings() {
        els.cfgBaseUrl.value = state.baseUrl;
        els.cfgApiKey.value = state.apiKey;
        els.cfgModelInput.value = state.activeModel || state.models[0] || "";
        els.cfgPrompt.value = state.prompt || DEFAULT_PROMPT;
        renderModelList();
        switchTab("api");
        els.settingsOverlay.classList.add("open");
      }

      function closeSettings() {
        els.settingsOverlay.classList.remove("open");
      }

      function saveSettings() {
        const oldUrl = state.baseUrl;
        state.baseUrl = els.cfgBaseUrl.value.trim();
        state.apiKey = els.cfgApiKey.value.trim();
        if (els.cfgModelInput.value.trim()) selectModel(els.cfgModelInput.value.trim(), { silent: true });
        state.prompt = els.cfgPrompt.value.trim() || DEFAULT_PROMPT;
        if (oldUrl !== state.baseUrl) {
          fetchedModels = [];
          hydrateModelsFromCache();
        }
        ensureActiveModel();
        saveState();
        renderModelPickers();
        renderModelList();
        closeSettings();
        showToast("设置已保存。");
      }

      function switchTab(id) {
        document.querySelectorAll(".tab").forEach((tab) => {
          tab.classList.toggle("active", tab.dataset.tab === id);
        });
        els.tabApi.style.display = id === "api" ? "" : "none";
        els.tabPrompt.style.display = id === "prompt" ? "" : "none";
      }

      function selectModel(model, opts = {}) {
        if (!model) return;
        if (!state.models.includes(model)) state.models.unshift(model);
        state.activeModel = model;
        saveState();
        renderModelPickers();
        renderModelList();
        renderSettingsModelDropdown(els.cfgModelInput.value);
        if (!opts.silent) showToast(`已选择模型：${model}`);
      }

      function renderModelList() {
        els.modelList.innerHTML = "";
        if (!state.models.length) {
          const empty = document.createElement("div");
          empty.className = "field-hint";
          empty.textContent = "未添加模型时默认使用 glm-4-flash。";
          els.modelList.appendChild(empty);
          return;
        }
        state.models.forEach((model, index) => {
          const token = document.createElement("span");
          token.className = "model-token";
          token.innerHTML = `<span>${esc(model)}</span><button title="移除" aria-label="移除">×</button>`;
          token.querySelector("button").addEventListener("click", () => {
            state.models.splice(index, 1);
            saveState();
            renderModelList();
          });
          els.modelList.appendChild(token);
        });
      }

      async function fetchModels({ force = false, open = false, filter = null } = {}) {
        const url = (els.cfgBaseUrl?.value.trim() || state.baseUrl || DEFAULT_BASE_URL).trim();
        const key = els.cfgApiKey?.value.trim() || state.apiKey;
        const cached = modelCache[url];
        if (!force && cached && Array.isArray(cached.models)) {
          fetchedModels = cached.models;
          if (!state.models.length) state.models = fetchedModels.slice(0, 8);
          renderModelList();
          renderModelPickers();
          if (open) renderSettingsModelDropdown(filter ?? els.cfgModelInput.value);
          return fetchedModels;
        }
        if (!key) {
          if (open) renderSettingsModelDropdown(filter ?? els.cfgModelInput.value, "填写 API Key 后可获取模型列表。");
          return [];
        }

        if (open) renderSettingsModelDropdown(filter ?? els.cfgModelInput.value, "正在获取模型列表…");
        const modelsUrl = buildModelsUrl(url);
        try {
          const response = await fetch(modelsUrl, {
            headers: { Authorization: `Bearer ${key}` },
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          fetchedModels = normalizeModels(data);
          modelCache[url] = {
            models: fetchedModels,
            savedAt: Date.now(),
          };
          saveModelCache();
          if (!state.models.length && fetchedModels.length) state.models = fetchedModels.slice(0, 8);
          ensureActiveModel();
          saveState();
          renderModelList();
          renderModelPickers();
          if (open) renderSettingsModelDropdown(filter ?? els.cfgModelInput.value);
          return fetchedModels;
        } catch (error) {
          if (open) renderSettingsModelDropdown(filter ?? els.cfgModelInput.value, `获取失败：${error.message}`);
          return [];
        }
      }

      function buildModelsUrl(baseUrl) {
        let url = baseUrl || DEFAULT_BASE_URL;
        url = url.replace(/\/chat\/completions\/?$/i, "/models");
        if (!/\/models\/?$/i.test(url)) url = url.replace(/\/$/, "") + "/models";
        return url;
      }

      function normalizeModels(data) {
        const list = Array.isArray(data?.data) ? data.data : Array.isArray(data?.models) ? data.models : [];
        return list
          .map((item) => (typeof item === "string" ? item : item.id || item.name))
          .filter(Boolean)
          .sort((a, b) => a.localeCompare(b));
      }

      function renderSettingsModelDropdown(filter = "", message = "") {
        const dropdown = els.settingsModelDropdown;
        const needle = filter.trim().toLowerCase();
        const models = modelChoices().filter((model) => !needle || model.toLowerCase().includes(needle));
        if (message) {
          dropdown.innerHTML = `<div class="model-empty">${esc(message)}</div>`;
        } else if (!models.length) {
          dropdown.innerHTML = `<div class="model-empty">没有匹配的模型；按 Enter 可使用当前输入。</div>`;
        } else {
          dropdown.innerHTML = models.map((model) => modelOptionHTML(model)).join("");
          dropdown.querySelectorAll(".model-option").forEach((btn) => {
            btn.addEventListener("mousedown", (event) => {
              event.preventDefault();
              els.cfgModelInput.value = btn.dataset.model;
              selectModel(btn.dataset.model, { silent: true });
              closeSettingsModelDropdown();
            });
          });
        }
        dropdown.classList.add("open");
      }

      function closeSettingsModelDropdown() {
        els.settingsModelDropdown.classList.remove("open");
      }

      function extractSources(message) {
        const fromMetadata = Array.isArray(message.sources) ? message.sources : [];
        const links = [];
        const re = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g;
        let match;
        while ((match = re.exec(message.content || ""))) {
          links.push({ title: match[1], url: match[2] });
        }
        const map = new Map();
        [...fromMetadata, ...links].forEach((source) => {
          if (source.url && !map.has(source.url)) map.set(source.url, source);
        });
        return [...map.values()].slice(0, 8);
      }

      function renderMarkdown(text) {
        const lines = String(text || "").replace(/\r\n/g, "\n").split("\n");
        const html = [];
        let i = 0;

        while (i < lines.length) {
          const line = lines[i];
          if (!line.trim()) {
            i++;
            continue;
          }

          const fence = line.match(/^```([A-Za-z0-9_+.-]*)\s*$/);
          if (fence) {
            const lang = fence[1] || "text";
            const codeLines = [];
            i++;
            while (i < lines.length && !/^```\s*$/.test(lines[i])) {
              codeLines.push(lines[i]);
              i++;
            }
            if (i < lines.length) i++;
            html.push(renderCodeBlock(codeLines.join("\n"), lang));
            continue;
          }

          const table = collectTable(lines, i);
          if (table) {
            html.push(renderTable(table.rows));
            i = table.next;
            continue;
          }

          const heading = line.match(/^(#{1,4})\s+(.+)$/);
          if (heading) {
            const level = Math.min(Math.max(heading[1].length, 2), 4);
            html.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            i++;
            continue;
          }

          if (/^>\s?/.test(line)) {
            const quote = [];
            while (i < lines.length && /^>\s?/.test(lines[i])) {
              quote.push(lines[i].replace(/^>\s?/, ""));
              i++;
            }
            html.push(`<blockquote>${quote.map(inlineMarkdown).join("<br>")}</blockquote>`);
            continue;
          }

          if (/^\s*[-*]\s+/.test(line)) {
            const items = [];
            while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
              items.push(lines[i].replace(/^\s*[-*]\s+/, ""));
              i++;
            }
            html.push(`<ul>${items.map((item) => `<li>${inlineMarkdown(item)}</li>`).join("")}</ul>`);
            continue;
          }

          if (/^\s*\d+\.\s+/.test(line)) {
            const items = [];
            while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
              items.push(lines[i].replace(/^\s*\d+\.\s+/, ""));
              i++;
            }
            html.push(`<ol>${items.map((item) => `<li>${inlineMarkdown(item)}</li>`).join("")}</ol>`);
            continue;
          }

          const paragraph = [line];
          i++;
          while (
            i < lines.length &&
            lines[i].trim() &&
            !/^```/.test(lines[i]) &&
            !/^(#{1,4})\s+/.test(lines[i]) &&
            !/^>\s?/.test(lines[i]) &&
            !/^\s*[-*]\s+/.test(lines[i]) &&
            !/^\s*\d+\.\s+/.test(lines[i]) &&
            !collectTable(lines, i)
          ) {
            paragraph.push(lines[i]);
            i++;
          }
          html.push(`<p>${paragraph.map(inlineMarkdown).join("<br>")}</p>`);
        }

        return html.join("");
      }

      function renderCodeBlock(code, lang) {
        return `
          <div class="code-block">
            <div class="code-head">
              <span class="code-lang">${esc(lang || "text")}</span>
              <button class="code-copy" type="button">复制</button>
            </div>
            <pre><code>${esc(code)}</code></pre>
          </div>`;
      }

      function collectTable(lines, start) {
        if (start + 1 >= lines.length) return null;
        if (!/^\s*\|.+\|\s*$/.test(lines[start])) return null;
        if (!/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[start + 1])) return null;
        const rows = [splitTableRow(lines[start])];
        let i = start + 2;
        while (i < lines.length && /^\s*\|.+\|\s*$/.test(lines[i])) {
          rows.push(splitTableRow(lines[i]));
          i++;
        }
        return { rows, next: i };
      }

      function splitTableRow(line) {
        return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
      }

      function renderTable(rows) {
        const [head, ...body] = rows;
        return `
          <table>
            <thead><tr>${head.map((cell) => `<th>${inlineMarkdown(cell)}</th>`).join("")}</tr></thead>
            <tbody>${body.map((row) => `<tr>${row.map((cell) => `<td>${inlineMarkdown(cell)}</td>`).join("")}</tr>`).join("")}</tbody>
          </table>`;
      }

      function inlineMarkdown(text) {
        return esc(text)
          .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/__([^_]+)__/g, "<strong>$1</strong>")
          .replace(/\*([^*]+)\*/g, "<em>$1</em>")
          .replace(/_([^_]+)_/g, "<em>$1</em>");
      }

      function bindCodeCopyButtons(root) {
        root.querySelectorAll(".code-copy").forEach((button) => {
          button.addEventListener("click", () => {
            const code = button.closest(".code-block")?.querySelector("code")?.innerText || "";
            copyText(code);
          });
        });
      }

      function copyText(text) {
        if (!navigator.clipboard) {
          fallbackCopyText(text);
          return;
        }
        navigator.clipboard.writeText(text).then(
          () => showToast("已复制。"),
          () => fallbackCopyText(text),
        );
      }

      function fallbackCopyText(text) {
        const area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.left = "-9999px";
        area.style.top = "0";
        document.body.appendChild(area);
        area.select();
        try {
          const ok = document.execCommand("copy");
          showToast(ok ? "已复制。" : "复制失败，浏览器不允许访问剪贴板。");
        } catch (e) {
          showToast("复制失败，浏览器不允许访问剪贴板。");
        } finally {
          area.remove();
        }
      }

      function showToast(text) {
        clearTimeout(toastTimer);
        els.toast.textContent = text;
        els.toast.classList.add("visible");
        toastTimer = setTimeout(() => els.toast.classList.remove("visible"), 2300);
      }

      function scrollToBottom() {
        requestAnimationFrame(() => {
          window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "smooth" });
        });
      }

      function domainOf(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, "");
        } catch (e) {
          return url;
        }
      }

      function esc(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      boot();
    </script>
  </body>
</html>
