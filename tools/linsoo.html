<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linsoo — AI 搜索对话</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&amp;family=DM+Mono:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]],
          processEscapes: true,
        },
        chtml: {
          matchFontHeight: false,
        },
        startup: {
          typeset: false,
        },
      };
    </script>
    <style>
      :root {
        --paper: #f5f4ed;
        --ivory: #faf9f5;
        --white: #ffffff;
        --sand: #e8e6dc;
        --sand-2: #f0eee6;
        --ink: #141413;
        --charcoal: #30302e;
        --text-strong: #4d4c48;
        --muted: #5e5d59;
        --faint: #87867f;
        --silver: #b0aea5;
        --line: #f0eee6;
        --line-strong: #e8e6dc;
        --ring: #d1cfc5;
        --ring-deep: #c2c0b6;
        --accent: #c96442;
        --accent-2: #d97757;
        --accent-soft: #f1ded5;
        --olive: #66725d;
        --olive-soft: #e5e8de;
        --focus: #3898ec;
        --danger: #b53333;
        --danger-soft: #f4dfdc;
        --shadow-soft: 0 0 0 1px var(--line), 0 4px 24px rgba(0, 0, 0, 0.05);
        --shadow-ring: 0 0 0 1px var(--ring);
        --shadow-ring-deep: 0 0 0 1px var(--ring-deep);
        --radius-lg: 32px;
        --radius-md: 16px;
        --radius-sm: 8px;
        --speed: 0.16s ease;
      }

      body[data-theme="dark"] {
        --paper: #1f1f1c;
        --ivory: #2b2b28;
        --white: #343430;
        --sand: #353530;
        --sand-2: #30302c;
        --ink: #f1f0e8;
        --charcoal: #181815;
        --text-strong: #d7d5ca;
        --muted: #b8b5aa;
        --faint: #8f8c82;
        --silver: #bdb8aa;
        --line: #34342f;
        --line-strong: #4a4942;
        --ring: #55534b;
        --ring-deep: #6a675d;
        --accent: #d97757;
        --accent-2: #e48764;
        --accent-soft: rgba(217, 119, 87, 0.16);
        --olive: #a6b094;
        --olive-soft: rgba(166, 176, 148, 0.14);
        --focus: #7aa7ff;
        --danger: #f28b82;
        --danger-soft: rgba(242, 139, 130, 0.14);
        --shadow-soft: 0 0 0 1px var(--line), 0 18px 70px rgba(0, 0, 0, 0.2);
        --shadow-ring: 0 0 0 1px var(--ring);
        --shadow-ring-deep: 0 0 0 1px var(--ring-deep);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        min-height: 100%;
        background: var(--paper);
      }

      body {
        min-height: 100vh;
        color: var(--ink);
        font-family: "DM Sans", Arial, sans-serif;
        background: var(--paper);
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 16% 20%, rgba(201, 100, 66, 0.045), transparent 24%),
          radial-gradient(circle at 84% 12%, rgba(102, 114, 93, 0.045), transparent 26%);
        opacity: 0.75;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .shell {
        position: relative;
        min-height: 100vh;
        display: flex;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 30;
        width: 288px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-right: 1px solid var(--line);
        background: color-mix(in srgb, var(--paper) 94%, var(--charcoal) 6%);
        padding: 15px 12px 14px;
        transition:
          width var(--speed),
          padding var(--speed);
      }

      body.sidebar-collapsed .sidebar {
        width: 56px;
        padding-inline: 8px;
      }

      body.sidebar-collapsed .sidebar-body {
        overflow: hidden;
        padding-right: 0;
      }

      body.sidebar-collapsed .sidebar-head {
        justify-content: center;
      }

      .sidebar-head,
      .sidebar-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 9px;
        min-width: 0;
        border: none;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        user-select: none;
      }

      .logo {
        font-family: "Newsreader", Georgia, serif;
        font-size: 29px;
        font-weight: 500;
        letter-spacing: -0.7px;
        line-height: 1;
      }

      .logo em {
        color: var(--accent);
        font-style: italic;
      }

      .sidebar-collapse {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: transparent;
        box-shadow: none;
        color: var(--faint);
      }

      .sidebar-collapse svg {
        width: 21px;
        height: 21px;
      }

      .sidebar-collapse:hover {
        background: transparent;
        box-shadow: none;
        color: var(--ink);
      }

      .sidebar-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding-right: 1px;
      }

      .sidebar-section {
        margin-bottom: 18px;
      }

      .sidebar-title {
        margin: 0 0 8px 4px;
        color: var(--faint);
        font-size: 12px;
      }

      .sidebar-action,
      .chat-row,
      .folder-row {
        width: 100%;
        min-height: 36px;
        display: flex;
        align-items: center;
        gap: 9px;
        border: none;
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        padding: 0 8px;
        text-align: left;
        transition:
          background var(--speed),
          color var(--speed);
      }

      .sidebar-action:hover,
      .chat-row:hover,
      .folder-row:hover,
      .chat-row.active,
      .folder-row.active {
        background: var(--sand);
        color: var(--ink);
      }

      .sidebar-icon {
        width: 26px;
        min-width: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        line-height: 1;
      }

      .sidebar-icon svg {
        width: 20px;
        height: 20px;
      }

      .empty-row {
        min-height: 30px;
        padding-inline: 8px;
        color: var(--faint);
        font-size: 14px;
      }

      .sidebar-label,
      .chat-title,
      .folder-name,
      .sidebar-title {
        transition:
          opacity var(--speed),
          visibility var(--speed);
      }

      .chat-title,
      .folder-name,
      .sidebar-label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        font-size: 14px;
      }

      .chat-row {
        position: relative;
        padding-right: 34px;
      }

      .chat-menu-btn {
        position: absolute;
        top: 50%;
        right: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        opacity: 0;
        pointer-events: none;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--faint);
        cursor: pointer;
        line-height: 1;
        transform: translateY(-50%);
      }

      .chat-row:hover .chat-menu-btn,
      .chat-menu-btn.open {
        opacity: 1;
        pointer-events: auto;
      }

      .chat-menu {
        position: fixed;
        z-index: 90;
        min-width: 174px;
        display: none;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: var(--ivory);
        box-shadow: var(--shadow-soft), 0 18px 70px rgba(20, 20, 19, 0.16);
        padding: 6px;
      }

      .chat-menu.open {
        display: block;
      }

      .chat-menu button {
        width: 100%;
        min-height: 34px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--text-strong);
        cursor: pointer;
        padding: 0 9px;
        text-align: left;
        font-size: 13px;
      }

      .chat-menu button:hover {
        background: var(--sand);
        color: var(--ink);
      }

      .search-overlay {
        position: fixed;
        inset: 0;
        z-index: 85;
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding-top: min(12vh, 92px);
        background: rgba(20, 20, 19, 0.34);
      }

      .search-overlay.open {
        display: flex;
      }

      .search-modal {
        width: min(92vw, 672px);
        max-height: min(78vh, 620px);
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 15px;
        background: var(--ivory);
        box-shadow: var(--shadow-soft), 0 24px 90px rgba(20, 20, 19, 0.18);
      }

      .search-head {
        height: 64px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        padding: 0 14px 0 18px;
      }

      .search-head svg {
        color: var(--faint);
        flex-shrink: 0;
      }

      .search-head input {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        background: transparent;
        color: var(--ink);
        font-size: 15px;
      }

      .search-close {
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 9px;
        background: transparent;
        color: var(--faint);
        cursor: pointer;
        font-size: 24px;
      }

      .search-close:hover {
        color: var(--ink);
      }

      .search-results {
        max-height: calc(min(78vh, 620px) - 64px);
        overflow-y: auto;
        padding: 8px 10px 12px;
      }

      .search-result-row {
        width: 100%;
        min-height: 38px;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 12px;
        border: none;
        border-radius: 9px;
        background: transparent;
        color: var(--text-strong);
        cursor: pointer;
        padding: 0 10px;
        text-align: left;
      }

      .search-result-row:hover,
      .search-result-row.active {
        background: var(--sand);
        color: var(--ink);
      }

      .search-result-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
      }

      .search-result-time {
        color: var(--faint);
        font-size: 12px;
      }

      body.sidebar-collapsed .sidebar-label,
      body.sidebar-collapsed .chat-title,
      body.sidebar-collapsed .folder-name,
      body.sidebar-collapsed .sidebar-title,
      body.sidebar-collapsed .logo {
        opacity: 0;
        visibility: hidden;
        width: 0;
      }

      body.sidebar-collapsed .brand {
        display: none;
      }

      body.sidebar-collapsed .sidebar-label {
        display: none;
      }

      body.sidebar-collapsed .chat-row,
      body.sidebar-collapsed .folder-row,
      body.sidebar-collapsed .sidebar-action {
        justify-content: center;
        padding-inline: 0;
        padding-right: 0;
        gap: 0;
      }

      body.sidebar-collapsed .chat-menu-btn {
        display: none;
      }

      body.sidebar-collapsed .sidebar-section:not(:first-child) {
        display: none;
      }

      body.sidebar-collapsed .sidebar-section:first-child {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      body.sidebar-collapsed .sidebar-section:first-child .sidebar-action {
        width: 40px;
      }

      body.sidebar-collapsed .sidebar-icon {
        width: 40px;
        min-width: 40px;
      }

      body.sidebar-collapsed .sidebar-icon svg {
        width: 20px;
        height: 20px;
      }

      .theme-float {
        position: fixed;
        top: 16px;
        right: 18px;
        z-index: 35;
      }

      body.chat-active .theme-float {
        display: none;
      }

      .icon-btn,
      .pill-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: var(--sand);
        box-shadow: var(--shadow-ring);
        cursor: pointer;
        transition:
          background var(--speed),
          box-shadow var(--speed),
          color var(--speed);
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
      }

      .pill-btn {
        min-height: 40px;
        gap: 7px;
        border-radius: 12px;
        padding: 0 14px 0 10px;
        color: var(--text-strong);
        font-size: 14px;
        font-weight: 600;
      }

      .icon-btn:hover,
      .pill-btn:hover {
        background: var(--white);
        box-shadow: var(--shadow-ring-deep);
        color: var(--ink);
      }

      .icon-btn.sidebar-collapse {
        background: transparent;
        box-shadow: none;
      }

      .icon-btn.sidebar-collapse:hover {
        background: transparent;
        box-shadow: none;
        color: var(--ink);
      }

      .main {
        width: calc(100% - 288px);
        margin: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: clamp(26px, 5vw, 70px) clamp(16px, 3vw, 28px) 24px;
        margin-left: 288px;
        transition: margin-left var(--speed);
      }

      body.sidebar-collapsed .main {
        margin-left: 56px;
        width: calc(100% - 56px);
      }

      .hero {
        width: min(100%, 1120px);
        margin: 0 auto;
        min-height: 100vh;
        display: grid;
        align-content: center;
        gap: 26px;
        padding: 0 0 20vh;
      }

      .hero.hidden {
        display: none;
      }

      .hero-copy {
        max-width: 720px;
        margin: 0 auto;
        text-align: center;
      }

      h1 {
        font-family: "Newsreader", Georgia, serif;
        font-size: clamp(27px, 4vw, 44px);
        line-height: 1.16;
        letter-spacing: -0.018em;
        font-weight: 500;
        text-wrap: balance;
        white-space: pre-line;
      }

      h1 em {
        color: var(--accent);
        font-style: normal;
      }

      .composer-panel {
        width: min(100%, 760px);
        margin: 0 auto;
      }

      .composer-shell {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: var(--ivory);
        box-shadow: var(--shadow-soft);
        padding: 12px;
        transition:
          border-color var(--speed),
          box-shadow var(--speed);
      }

      .composer-shell.drop-active {
        min-height: 178px;
        border-style: dashed;
        border-color: var(--focus);
        background: color-mix(in srgb, var(--focus) 13%, var(--ivory));
        box-shadow:
          var(--shadow-soft),
          0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent);
      }

      .composer-shell.drop-active::after {
        content: "Drop files here";
        position: absolute;
        inset: 10px;
        display: grid;
        place-items: center;
        border-radius: calc(var(--radius-lg) - 8px);
        background: color-mix(in srgb, var(--focus) 12%, transparent);
        color: var(--focus);
        font-size: 14px;
        font-weight: 600;
        pointer-events: none;
      }

      .composer-shell:focus-within {
        border-color: color-mix(in srgb, var(--white) 72%, var(--ring));
        box-shadow:
          var(--shadow-soft),
          0 0 0 2px color-mix(in srgb, var(--white) 64%, transparent);
      }

      .composer-input {
        width: 100%;
        min-height: 46px;
        max-height: 210px;
        resize: none;
        border: none;
        outline: none;
        background: transparent;
        color: var(--ink);
        padding: 6px 8px 0;
        font-size: 17px;
        line-height: 1.6;
      }

      .composer-input::placeholder {
        color: var(--faint);
      }

      .composer-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 40px;
      }

      .composer-tools,
      .composer-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        min-width: 0;
        flex: 1;
      }

      .tool-btn,
      .model-trigger,
      .message-action-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: none;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition:
          background var(--speed),
          color var(--speed),
          box-shadow var(--speed);
      }

      .tool-btn {
        width: 36px;
        height: 36px;
        font-size: 20px;
        line-height: 1;
      }

      .tool-btn:hover,
      .message-action-btn:hover {
        background: var(--sand-2);
        color: var(--ink);
      }

      .model-picker {
        position: relative;
        min-width: 0;
      }

      .model-trigger {
        min-width: 0;
        max-width: 180px;
        height: 36px;
        justify-content: center;
        align-items: center;
        padding: 0 8px;
        gap: 4px;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        line-height: 1;
        overflow: hidden;
      }

      .model-trigger:hover,
      .model-trigger[aria-expanded="true"] {
        background: var(--sand-2);
        color: var(--ink);
      }

      .model-trigger-text {
        display: block;
        min-width: 0;
        max-width: calc(100% - 18px);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        line-height: 14px;
      }

      .model-trigger-caret {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--faint);
        flex-shrink: 0;
        width: 14px;
        height: 14px;
        line-height: 14px;
        transform: translateY(-0.5px);
      }

      .model-dropdown {
        position: absolute;
        right: 0;
        top: calc(100% + 8px);
        z-index: 40;
        width: min(320px, calc(100vw - 32px));
        max-height: 260px;
        overflow-y: auto;
        border: 1px solid var(--line-strong);
        border-radius: 16px;
        background: var(--ivory);
        box-shadow: var(--shadow-soft), 0 18px 70px rgba(20, 20, 19, 0.1);
        padding: 6px;
        display: none;
      }

      .model-dropdown.open {
        display: block;
      }

      .model-dropdown.open-up {
        top: auto;
        bottom: calc(100% + 8px);
      }

      .model-option {
        width: 100%;
        min-height: 36px;
        display: flex;
        align-items: center;
        gap: 8px;
        border: none;
        border-radius: 10px;
        background: transparent;
        color: var(--text-strong);
        cursor: pointer;
        padding: 8px 10px;
        font-size: 13px;
        text-align: left;
      }

      .model-option:hover,
      .model-option.active {
        background: var(--sand);
      }

      .model-option-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        font-family: "DM Mono", ui-monospace, monospace;
        font-size: 12px;
      }

      .model-option-check {
        color: var(--accent);
        flex-shrink: 0;
      }

      .model-empty {
        padding: 10px 11px;
        color: var(--faint);
        font-size: 12px;
        line-height: 1.45;
      }

      .attachment-strip {
        display: none;
        flex-wrap: wrap;
        gap: 10px;
        padding: 2px 4px 0;
      }

      .attachment-strip.visible {
        display: flex;
      }

      .attachment-chip {
        display: inline-flex;
        position: relative;
        width: 118px;
        height: 130px;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        gap: 8px;
        border-radius: 13px;
        border: 1px solid var(--line-strong);
        background: transparent;
        box-shadow: none;
        color: var(--text-strong);
        padding: 8px;
        font-size: 11px;
      }

      .attachment-chip span {
        display: block;
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.25;
      }

      .attachment-icon {
        width: 100%;
        height: 47px;
        display: flex;
        align-items: flex-end;
        justify-content: flex-start;
        border: 1px solid var(--ring);
        border-radius: 6px;
        background: transparent;
        box-shadow: var(--shadow-ring);
        color: var(--muted);
        padding: 0 0 5px 8px;
        font-family: "DM Mono", ui-monospace, monospace;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .attachment-name {
        min-height: 31px;
        color: var(--text-strong);
        font-size: 13px;
        line-height: 1.24;
      }

      .attachment-meta {
        color: var(--faint);
        font-size: 10px;
      }

      .attachment-chip button {
        position: absolute;
        top: -9px;
        left: -9px;
        width: 19px;
        height: 19px;
        border-radius: 50%;
        border: none;
        background: color-mix(in srgb, var(--ink) 14%, var(--ivory));
        color: var(--muted);
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
      }

      .send-btn {
        position: relative;
        overflow: hidden;
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 50%;
        background: var(--accent);
        color: var(--ivory);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition:

    <script>
      const DEFAULT_BASE_URL = "https://open.bigmodel.cn/api/paas/v4/chat/completions";
      const STORAGE_KEY = "linsoo_v1";
      const LINSO_STORAGE_KEY = "linso_v3";
      const MODEL_CACHE_KEY = "linsoo_model_cache_v1";
      const MAX_FILE_CHARS = 12000;
      const PASTE_ATTACHMENT_LIMIT = 800;
      const OPFS_SETTINGS_FILE = "linsoo-settings.json";
      const OPFS_MODEL_CACHE_FILE = "linsoo-model-cache.json";
      const OPFS_CHAT_DIR = "linsoo-chats";
      const DEFAULT_PROMPT = `You are Linsoo, an answer-first AI search engine in the style of Perplexity and Grok.

Your job:
- Answer the user's search question directly, then help them continue the investigation.
- Prefer current, source-grounded answers when the selected model has web/search access.
- If you do not have live web access, say that clearly and answer from available knowledge without pretending you browsed.
- When sources are available in the model output or tool results, cite them with Markdown links near the claims.
- Keep the answer structured, concrete, and concise.
- For Chinese questions, answer in Chinese unless the user asks otherwise.

Output normal Markdown. Do not output JSON unless the user asks for it.`;

      const SUGGESTIONS = [
        {
          title: "追踪最新动态",
          body: "Claude、Grok、Perplexity 最近的搜索体验差异",
          prompt: "Claude、Grok、Perplexity 最近的搜索体验有什么差异？请按设计、引用、追问体验比较。",
        },
        {
