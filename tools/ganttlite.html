<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GanttLite — 通用甘特图工具</title>
<!--
  GanttLite — 单文件甘特图工具
  功能：任务管理 / SVG甘特图 / 拖拽编辑 / 依赖关系 / 分享链接 / JSON导入导出
  依赖：LZString (URL压缩) · html2canvas (PNG导出)
  无框架 · 无构建步骤 · 复制粘贴即可运行
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0b0d13;
  --s0:#111319;
  --s1:#161921;
  --s2:#1c1f2c;
  --s3:#222638;
  --b1:#232637;
  --b2:#2d314a;
  --accent:#f5a623;
  --accent-glow:rgba(245,166,35,.14);
  --accent-soft:rgba(245,166,35,.08);
  --blue:#4f7dfa;
  --green:#2dd4bf;
  --red:#fb4b6b;
  --t0:#e8edf8;
  --t1:#9aa3bc;
  --t2:#555e7a;
  --t3:#2e3450;
  --row:40px;
  --axis:52px;
  --hdr:52px;
  --sb:26px;
  --pane:310px;
  --r:6px;
  --sh:0 8px 32px rgba(0,0,0,.5);
  --mono:'DM Mono',monospace;
  --sans:'Sora',sans-serif;
}
body{font-family:var(--sans);font-size:12.5px;background:var(--bg);color:var(--t0);
  height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:var(--sans);background:var(--s2);border:1px solid var(--b1);
  color:var(--t0);border-radius:var(--r);padding:5px 8px;font-size:12px;outline:none;transition:border .15s,box-shadow .15s;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:99px;}
::-webkit-scrollbar-thumb:hover{background:var(--t2);}

/* ===== HEADER ===== */
#header{
  height:var(--hdr);background:var(--s0);border-bottom:1px solid var(--b1);
  display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0;z-index:100;
}
#logo{
  font-family:var(--mono);font-size:15px;font-weight:500;color:var(--accent);
  letter-spacing:-0.5px;white-space:nowrap;display:flex;align-items:center;gap:5px;
  padding-right:6px;
}
#logo svg{width:18px;height:18px;}
#project-name{
  background:transparent;border:1px solid transparent;color:var(--t0);
  font-size:13px;font-weight:600;padding:4px 8px;border-radius:4px;
  min-width:100px;max-width:200px;
}
#project-name:hover{border-color:var(--b2);}
#project-name:focus{background:var(--s2);border-color:var(--accent);}
.hbar{width:1px;height:22px;background:var(--b1);margin:0 3px;flex-shrink:0;}
.spacer{flex:1;}
#task-stats{font-family:var(--mono);font-size:10.5px;color:var(--t2);white-space:nowrap;}

/* Scale tabs */
#scale-tabs{display:flex;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:2px;gap:1px;}
#scale-tabs button{padding:3px 9px;border-radius:4px;font-size:11px;font-family:var(--mono);
  color:var(--t1);transition:all .15s;white-space:nowrap;}
#scale-tabs button.on{background:var(--accent);color:#000;font-weight:600;}
#scale-tabs button:hover:not(.on){background:var(--s3);}

/* Zoom buttons */
#zoom-wrap{display:flex;border:1px solid var(--b1);border-radius:var(--r);overflow:hidden;}
#zoom-wrap button{width:26px;height:26px;font-size:14px;color:var(--t1);background:var(--s2);
  display:flex;align-items:center;justify-content:center;transition:all .15s;}
#zoom-wrap button:hover{background:var(--s3);color:var(--t0);}
#zoom-wrap button:first-child{border-right:1px solid var(--b1);}

/* Header action buttons */
.hbtn{
  padding:4px 10px;border-radius:var(--r);font-size:11.5px;font-weight:500;
  background:var(--s2);color:var(--t1);border:1px solid var(--b1);
  transition:all .15s;white-space:nowrap;height:26px;display:flex;align-items:center;gap:4px;
}
.hbtn:hover{background:var(--s3);color:var(--t0);}
.hbtn.cta{background:var(--accent);color:#000;border-color:var(--accent);}
.hbtn.cta:hover{opacity:.9;}

/* ===== MAIN LAYOUT ===== */
#main{flex:1;display:flex;overflow:hidden;}

/* ===== TASK PANE ===== */
#task-pane{
  width:var(--pane);display:flex;flex-direction:column;
  border-right:1px solid var(--b1);flex-shrink:0;overflow:hidden;background:var(--s0);
}
#tp-header{
  height:var(--axis);display:flex;align-items:center;padding:0 10px;
  border-bottom:1px solid var(--b1);flex-shrink:0;gap:6px;
}
#tp-header .lbl{font-size:10.5px;font-weight:700;color:var(--t2);
  text-transform:uppercase;letter-spacing:.8px;flex:1;}
#add-btn{
  background:var(--accent-glow);color:var(--accent);
  border:1px solid rgba(245,166,35,.22);border-radius:4px;
  padding:3px 10px;font-size:11px;font-weight:600;transition:all .15s;
}
#add-btn:hover{background:var(--accent);color:#000;}
#task-list{flex:1;overflow-y:auto;overflow-x:hidden;}

/* Task rows */
.trow{
  display:flex;align-items:center;height:var(--row);padding:0 8px;
  gap:4px;border-bottom:1px solid var(--b1);cursor:pointer;
  transition:background .1s;position:relative;
}
.trow:hover{background:var(--s2);}
.trow.sel{background:var(--accent-soft);}
.trow.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);}
.cbtn,.cph{
  width:16px;height:16px;border-radius:3px;display:flex;align-items:center;
  justify-content:center;font-size:8px;color:var(--t2);flex-shrink:0;
}
.cbtn:hover{background:var(--s3);color:var(--t0);}
.tdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.tname{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px;color:var(--t0);min-width:0;}
.tmeta{font-family:var(--mono);font-size:10px;color:var(--t2);white-space:nowrap;}
.tdel{
  opacity:0;width:18px;height:18px;border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  color:var(--t2);font-size:15px;flex-shrink:0;transition:all .12s;
}
.trow:hover .tdel{opacity:1;}
.tdel:hover{background:rgba(251,75,107,.18);color:var(--red);}
.tprog{
  width:32px;height:3px;background:var(--s3);border-radius:99px;overflow:hidden;flex-shrink:0;
}
.tprog-fill{height:100%;border-radius:99px;transition:width .3s;}

/* Empty state */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:200px;gap:14px;color:var(--t2);padding:20px;text-align:center;
}
.empty p{font-size:13px;line-height:1.6;}
.empty-cta{
  background:var(--accent);color:#000;padding:8px 22px;border-radius:var(--r);
  font-weight:700;font-size:12px;transition:opacity .15s;
}
.empty-cta:hover{opacity:.9;}

/* ===== GANTT PANE ===== */
#gantt-pane{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
#gantt-axis{height:var(--axis);overflow:hidden;flex-shrink:0;border-bottom:1px solid var(--b1);background:var(--s0);}
#gantt-body{flex:1;overflow:auto;}

/* ===== DETAIL PANEL ===== */
#detail-panel{
  position:fixed;right:0;top:var(--hdr);bottom:var(--sb);width:272px;
  background:var(--s0);border-left:1px solid var(--b1);
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);
  z-index:50;box-shadow:var(--sh);
}
#detail-panel.open{transform:translateX(0);}
#dp-hdr{
  padding:11px 12px;border-bottom:1px solid var(--b1);
  display:flex;align-items:center;gap:8px;
}
#dp-title{font-size:12.5px;font-weight:700;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
#dp-close{
  width:22px;height:22px;border-radius:4px;display:flex;align-items:center;
  justify-content:center;color:var(--t1);font-size:16px;
}
#dp-close:hover{background:var(--s2);color:var(--t0);}
#dp-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:11px;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fl{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;justify-content:space-between;}
.fg input,.fg select,.fg textarea{width:100%;font-size:12.5px;}
.frow{display:flex;gap:7px;}
.frow .fg{flex:1;}
.pslider{width:100%;accent-color:var(--accent);cursor:pointer;}
.pval{font-family:var(--mono);font-size:11px;color:var(--accent);}
.color-note{font-size:10px;color:var(--t2);margin-top:2px;}
#dp-foot{padding:9px 12px;border-top:1px solid var(--b1);display:flex;gap:6px;}
#dp-foot button{flex:1;padding:7px;border-radius:var(--r);font-size:12px;font-weight:600;}
#dp-save{background:var(--accent);color:#000;}
#dp-save:hover{opacity:.9;}
#dp-del{background:rgba(251,75,107,.1);color:var(--red);border:1px solid rgba(251,75,107,.2);}
#dp-del:hover{background:rgba(251,75,107,.2);}
#dp-sub{background:var(--s2);color:var(--t1);border:1px solid var(--b1);}
#dp-sub:hover{background:var(--s3);color:var(--t0);}

/* ===== MODAL ===== */
#modal-ov{
  position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);
}
#modal-ov.hidden{display:none;}
#modal-box{
  background:var(--s1);border:1px solid var(--b2);border-radius:10px;
  padding:20px;width:420px;max-width:90vw;box-shadow:var(--sh);
}
#modal-box h3{font-size:15px;font-weight:700;margin-bottom:4px;}
#modal-box p{font-size:11.5px;color:var(--t1);margin-bottom:12px;}
#modal-ta{width:100%;height:130px;font-family:var(--mono);font-size:11px;resize:vertical;margin-bottom:10px;}
.mbr{display:flex;gap:8px;justify-content:flex-end;}
.mbr button{padding:7px 18px;border-radius:var(--r);font-size:12px;font-weight:600;}
#m-cancel{background:var(--s3);color:var(--t1);}
#m-ok{background:var(--accent);color:#000;}

/* ===== STATUS BAR ===== */
#statusbar{
  height:var(--sb);background:var(--s0);border-top:1px solid var(--b1);
  display:flex;align-items:center;padding:0 10px;gap:10px;flex-shrink:0;
  font-family:var(--mono);font-size:10px;color:var(--t2);
}
.sdot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 2.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ===== TOAST ===== */
#toast{
  position:fixed;bottom:36px;left:50%;
  transform:translateX(-50%) translateY(12px);
  background:var(--s2);border:1px solid var(--b2);
  padding:7px 16px;border-radius:20px;font-size:12px;
  opacity:0;transition:all .28s;pointer-events:none;z-index:999;white-space:nowrap;
  box-shadow:var(--sh);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== DRAG STATES ===== */
body.dragging{user-select:none;cursor:grabbing!important;}
body.resizing{user-select:none;cursor:ew-resize!important;}

/* ===== SVG CURSOR ===== */
.svg-bar{cursor:grab;}
.svg-rsz{cursor:ew-resize;}
.svg-row{cursor:pointer;}
</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header id="header">
  <div id="logo">
    <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="9,1 17,5 17,13 9,17 1,13 1,5" stroke="currentColor" stroke-width="1.4" fill="none"/>
      <line x1="5" y1="7" x2="13" y2="7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="5" y1="11" x2="10" y2="11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    GanttLite
  </div>
  <div class="hbar"></div>
  <input id="project-name" type="text" value="未命名项目" placeholder="项目名称…" maxlength="60"/>
  <span id="task-stats">0 个任务</span>
  <div class="hbar"></div>
  <div id="scale-tabs">
    <button data-s="day">日</button>
    <button data-s="week" class="on">周</button>
    <button data-s="month">月</button>
    <button data-s="quarter">季</button>
  </div>
  <div id="zoom-wrap">
    <button id="zoom-out" title="缩小">−</button>
    <button id="zoom-in"  title="放大">+</button>
  </div>
  <button class="hbtn" id="today-btn">⊙ 今日</button>
  <div class="spacer"></div>
  <button class="hbtn" id="import-btn">↑ 导入</button>
  <button class="hbtn" id="exp-json">↓ JSON</button>
  <button class="hbtn" id="exp-png">↓ PNG</button>
  <button class="hbtn cta" id="share-btn">⬡ 分享链接</button>
</header>

<!-- ===== MAIN ===== -->
<div id="main">

  <!-- Task pane -->
  <div id="task-pane">
    <div id="tp-header">
      <span class="lbl">任务列表</span>
      <button id="add-btn">＋ 添加任务</button>
    </div>
    <div id="task-list"></div>
  </div>

  <!-- Gantt pane -->
  <div id="gantt-pane">
    <div id="gantt-axis"><svg id="axis-svg"></svg></div>
    <div id="gantt-body"><svg id="bars-svg"></svg></div>
  </div>
</div>

<!-- ===== DETAIL PANEL ===== -->
<div id="detail-panel">
  <div id="dp-hdr">
    <span id="dp-title">任务详情</span>
    <button id="dp-close">×</button>
  </div>
  <div id="dp-body">
    <div class="fg">
      <label class="fl">任务名称</label>
      <input id="d-name" type="text" placeholder="输入任务名称…"/>
    </div>
    <div class="frow">
      <div class="fg">
        <label class="fl">开始日期</label>
        <input id="d-start" type="date"/>
      </div>
      <div class="fg">
        <label class="fl">工期（天）</label>
        <input id="d-dur" type="number" min="0" max="9999" placeholder="0=里程碑"/>
      </div>
    </div>
    <div class="fg">
      <label class="fl">进度 <span id="d-pval" class="pval">0%</span></label>
      <input id="d-prog" type="range" min="0" max="100" class="pslider"/>
    </div>
    <div class="fg">
      <label class="fl">分组 / 标签</label>
      <input id="d-group" type="text" placeholder="如：设计、测试、里程碑…"/>
    </div>
    <div class="fg">
      <label class="fl">自定义颜色 <span style="color:var(--t2);font-weight:400;text-transform:none;letter-spacing:0">（留空=按分组自动配色）</span></label>
      <input id="d-color" type="color" style="width:100%;height:30px;padding:2px 4px;border-radius:4px;cursor:pointer;"/>
      <div class="color-note">勾选下方选框以使用自定义色</div>
      <label style="display:flex;align-items:center;gap:6px;margin-top:4px;cursor:pointer;">
        <input id="d-usecolor" type="checkbox" style="width:auto;padding:0;border-radius:3px;cursor:pointer;"/>
        <span style="font-size:11.5px;color:var(--t1);">启用自定义颜色</span>
      </label>
    </div>
    <div class="fg">
      <label class="fl">父任务</label>
      <select id="d-parent"><option value="">无（顶级任务）</option></select>
    </div>
    <div class="fg">
      <label class="fl">前置依赖 <span style="color:var(--t2);font-weight:400;text-transform:none;letter-spacing:0">（Ctrl/Cmd 多选）</span></label>
      <select id="d-deps" multiple style="height:80px;font-size:12px;"></select>
    </div>
    <div class="fg">
      <label class="fl">备注</label>
      <textarea id="d-notes" rows="3" placeholder="添加备注…" style="resize:vertical;"></textarea>
    </div>
  </div>
  <div id="dp-foot">
    <button id="dp-save">保存</button>
    <button id="dp-sub">+ 子任务</button>
    <button id="dp-del">删除</button>
  </div>
</div>

<!-- ===== IMPORT MODAL ===== -->
<div id="modal-ov" class="hidden">
  <div id="modal-box">
    <h3>导入数据</h3>
    <p>粘贴分享链接（?d=…）或 JSON 文本，也可将 .gantt.json 文件拖入页面</p>
    <textarea id="modal-ta" placeholder="粘贴链接或 JSON …"></textarea>
    <div class="mbr">
      <button id="m-cancel">取消</button>
      <button id="m-ok">导入</button>
    </div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast"></div>

<!-- ===== STATUS BAR ===== -->
<div id="statusbar">
  <div class="sdot"></div>
  <span id="sb-save">准备就绪</span>
  <span>·</span>
  <span id="sb-tasks">0 个任务</span>
  <span>·</span>
  <span id="sb-dur">项目跨度 0 天</span>
</div>

<script>
// ================================================================
//  GanttLite — 通用甘特图工具
//  单HTML文件 · 无构建步骤 · 依赖 LZString + html2canvas (CDN)
// ================================================================

/* ===== CONSTANTS ===== */
const PPD_BASE = { day:40, week:13, month:5, quarter:2.5 }; // pixels per day, base
const ROW_H    = 40;
const AXIS_H   = 52;
const PAD      = { s:8, e:35 }; // padding days around date range
const PALETTE  = [
  '#6366f1','#f5a623','#2dd4bf','#fb4b6b','#a78bfa',
  '#34d399','#fb923c','#60a5fa','#f472b6','#facc15'
];

/* ===== STATE ===== */
const S = {
  project: { name:'未命名项目', startDate:today() },
  tasks:   [],        // task objects
  view:    { scale:'week', zoom:1 },
  ui:      { selId:null, panelOpen:false, collapsed:new Set() }
};

/* ===== DATE UTILS ===== */
function today() { return new Date().toISOString().split('T')[0]; }
function pd(s)   { return new Date(s+'T00:00:00'); }
function fd(d)   { return d.toISOString().split('T')[0]; }
function addD(s,n){ const d=pd(s); d.setDate(d.getDate()+n); return fd(d); }
function diff(a,b){ return Math.round((pd(b)-pd(a))/86400000); }
function minD(arr){ return arr.filter(Boolean).reduce((m,x)=>x<m?x:m); }
function maxD(arr){ return arr.filter(Boolean).reduce((m,x)=>x>m?x:m); }

/* ===== ID ===== */
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ===== COLOR ===== */
const grpColors = {};
let colorCursor = 0;
function taskColor(t) {
  if (t.color) return t.color;
  const g = t.group || '_';
  if (!grpColors[g]) grpColors[g] = PALETTE[colorCursor++ % PALETTE.length];
  return grpColors[g];
}

/* ===== PPD ===== */
function ppd(){ return PPD_BASE[S.view.scale] * S.view.zoom; }

/* ===== TASK HELPERS ===== */
function visibleTasks() {
  const out = [];
  function walk(pid, depth) {
    S.tasks.filter(t=>(t.parent||null)===(pid||null)).forEach(t=>{
      out.push({...t, _d:depth});
      if (!S.ui.collapsed.has(t.id)) walk(t.id, depth+1);
    });
  }
  walk(null, 0);
  return out;
}

function hasKids(id){ return S.tasks.some(t=>t.parent===id); }

function descendants(id) {
  const r=[];
  (function w(x){ S.tasks.filter(t=>t.parent===x).forEach(t=>{r.push(t.id);w(t.id);}); })(id);
  return r;
}

function dateRange() {
  const starts=[], ends=[];
  S.tasks.forEach(t=>{
    if(t.start){ starts.push(t.start); ends.push(t.duration>0?addD(t.start,t.duration):t.start); }
  });
  starts.push(today()); starts.push(S.project.startDate);
  ends.push(today());
  return { s: addD(minD(starts),-PAD.s), e: addD(maxD(ends),PAD.e) };
}

/* ===== CIRCULAR DEP CHECK ===== */
function hasCycle(fromId, toId) {
  const seen=new Set();
  function dfs(id){ if(id===fromId)return true; if(seen.has(id))return false; seen.add(id);
    return (S.tasks.find(t=>t.id===id)?.deps||[]).some(dfs); }
  return dfs(toId);
}

/* ===== CRUD ===== */
function addTask(parentId=null) {
  const t = {
    id:uid(), name:'新任务', start:today(), duration:7,
    progress:0, group:'', color:null, parent:parentId, deps:[], notes:''
  };
  S.tasks.push(t);
  selectTask(t.id);
  render();
  toast('已添加任务');
  return t;
}

function updateTask(id, ch) {
  const t=S.tasks.find(t=>t.id===id);
  if(!t) return;
  Object.assign(t, ch);
  render();
}

function deleteTask(id) {
  const del=[id,...descendants(id)];
  S.tasks=S.tasks.filter(t=>!del.includes(t.id));
  S.tasks.forEach(t=>{ t.deps=(t.deps||[]).filter(d=>!del.includes(d)); });
  if(S.ui.selId===id){ S.ui.selId=null; S.ui.panelOpen=false; }
  render(); toast('已删除任务');
}

function selectTask(id) { S.ui.selId=id; S.ui.panelOpen=true; render(); }
function toggleCollapse(id) {
  if(S.ui.collapsed.has(id)) S.ui.collapsed.delete(id); else S.ui.collapsed.add(id);
  render();
}

/* ===== STORAGE ===== */
function save() {
  try {
    localStorage.setItem('gl1', JSON.stringify({project:S.project,tasks:S.tasks,view:S.view}));
    const n=new Date(); const t=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
    const el=document.getElementById('sb-save');
    if(el) el.textContent='已保存 '+t;
  } catch(e){}
}

function load() {
  try {
    const r=localStorage.getItem('gl1');
    return r?JSON.parse(r):null;
  } catch(e){ return null; }
}

/* ===== IMPORT / EXPORT ===== */
function importData(raw) {
  try {
    raw=raw.trim();
    let data;
    if(raw.includes('?d=')) {
      const p=new URLSearchParams(raw.split('?').slice(1).join('?')).get('d');
      data=JSON.parse(LZString.decompressFromEncodedURIComponent(p));
    } else {
      data=JSON.parse(raw);
    }
    if(!data.tasks) throw new Error('no tasks');
    S.project=data.project||S.project;
    S.tasks=data.tasks||[];
    S.view={...S.view,...(data.view||{})};
    S.ui.selId=null; S.ui.panelOpen=false; S.ui.collapsed=new Set();
    syncScaleBtns();
    render(); toast('✓ 导入成功'); return true;
  } catch(e){ toast('导入失败：格式有误'); return false; }
}

function exportURL() {
  const data={project:S.project,tasks:S.tasks,view:S.view};
  const comp=LZString.compressToEncodedURIComponent(JSON.stringify(data));
  const url=location.origin+location.pathname+'?d='+comp;
  navigator.clipboard.writeText(url)
    .then(()=>toast('✓ 链接已复制到剪贴板'))
    .catch(()=>{ const ta=document.createElement('textarea'); ta.value=url;
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); toast('✓ 链接已复制'); });
}

function exportJSON() {
  const data={project:S.project,tasks:S.tasks,view:S.view};
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=(S.project.name||'project')+'.gantt.json';
  a.click(); toast('JSON 文件已下载');
}

function exportPNG() {
  toast('生成截图中…');
  const target=document.getElementById('gantt-body');
  html2canvas(target,{
    width:target.scrollWidth, height:target.scrollHeight,
    scrollX:0, scrollY:0, backgroundColor:'#0b0d13', scale:2
  }).then(c=>{
    const a=document.createElement('a');
    a.href=c.toDataURL('image/png');
    a.download=(S.project.name||'gantt')+'.png';
    a.click(); toast('PNG 已下载');
  }).catch(()=>toast('截图失败'));
}

/* ===== DRAG ===== */
let drag=null;
function startDrag(e, id, type) {
  e.preventDefault(); e.stopPropagation();
  const t=S.tasks.find(t=>t.id===id); if(!t) return;
  drag={type,id,sx:e.clientX,os:t.start,od:t.duration||7,ppd:ppd()};
  document.body.classList.add(type==='move'?'dragging':'resizing');
}
function onMove(e) {
  if(!drag) return;
  const dx=e.clientX-drag.sx;
  const dd=Math.round(dx/drag.ppd);
  const t=S.tasks.find(t=>t.id===drag.id); if(!t) return;
  if(drag.type==='move') t.start=addD(drag.os,dd);
  else t.duration=Math.max(1, drag.od+dd);
  renderGantt(); renderTaskList(); updateSB();
}
function onUp() {
  if(!drag) return;
  drag=null;
  document.body.classList.remove('dragging','resizing');
  save();
}

/* ===== RENDER MASTER ===== */
function render() { renderTaskList(); renderGantt(); renderPanel(); updateSB(); save(); }

/* ===== RENDER TASK LIST ===== */
function renderTaskList() {
  const list=document.getElementById('task-list');
  const tasks=visibleTasks();
  document.getElementById('task-stats').textContent=S.tasks.length+' 个任务';
  document.getElementById('project-name').value=S.project.name;

  if(S.tasks.length===0) {
    list.innerHTML=`<div class="empty">
      <p>还没有任务<br>开始规划你的项目吧</p>
      <button class="empty-cta" onclick="addTask()">添加第一个任务</button>
    </div>`; return;
  }

  list.innerHTML=tasks.map(t=>{
    const c=taskColor(t);
    const dur=t.duration===0?'◆里程碑':(t.duration||0)+'天';
    const sel=S.ui.selId===t.id;
    const kids=hasKids(t.id);
    const coll=S.ui.collapsed.has(t.id);
    const prog=t.progress||0;
    return `<div class="trow${sel?' sel':''}" data-id="${t.id}" onclick="rowClick(event,'${t.id}')">
      <div style="width:${t._d*14}px;flex-shrink:0"></div>
      ${kids?`<button class="cbtn" onclick="event.stopPropagation();toggleCollapse('${t.id}')">${coll?'▶':'▼'}</button>`:`<span class="cph"></span>`}
      <div class="tdot" style="background:${c}"></div>
      <span class="tname" title="${esc(t.name)}">${esc(t.name)||'无标题'}</span>
      <div class="tprog"><div class="tprog-fill" style="width:${prog}%;background:${c}"></div></div>
      <span class="tmeta">${dur}</span>
      <button class="tdel" onclick="event.stopPropagation();deleteTask('${t.id}')" title="删除">×</button>
    </div>`;
  }).join('');
}

function rowClick(e,id) { if(!e.target.closest('button')) selectTask(id); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ===== RENDER GANTT ===== */
function renderGantt() {
  const tasks=visibleTasks();
  const P=ppd();
  const rng=dateRange();
  const total=diff(rng.s,rng.e);
  const svgW=Math.max(total*P, 600);
  const svgH=Math.max(tasks.length*ROW_H, 200);

  // --- Axis SVG ---
  const axisSvg=document.getElementById('axis-svg');
  axisSvg.setAttribute('width',svgW);
  axisSvg.setAttribute('height',AXIS_H);
  axisSvg.style.display='block';
  axisSvg.innerHTML=buildAxis(rng.s, rng.e, P, svgW);

  // --- Bars SVG ---
  const barsSvg=document.getElementById('bars-svg');
  barsSvg.setAttribute('width',svgW);
  barsSvg.setAttribute('height',svgH);
  barsSvg.style.display='block';

  let h=`<defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 z" fill="#555e7a" opacity=".8"/>
    </marker>
  </defs>`;

  // Row backgrounds
  tasks.forEach((t,i)=>{
    const y=i*ROW_H;
    const bg=S.ui.selId===t.id?'rgba(245,166,35,.07)':(i%2===0?'rgba(255,255,255,.012)':'transparent');
    h+=`<rect class="svg-row" x="0" y="${y}" width="${svgW}" height="${ROW_H}" fill="${bg}" onclick="selectTask('${t.id}')"/>`;
  });

  // Horizontal lines
  tasks.forEach((_,i)=>{
    h+=`<line x1="0" y1="${(i+1)*ROW_H}" x2="${svgW}" y2="${(i+1)*ROW_H}" stroke="var(--b1)" stroke-width="1" opacity=".4"/>`;
  });

  // Vertical grid
  h+=buildGrid(rng.s, rng.e, P, svgH);

  // Dependency lines (drawn first, under bars)
  tasks.forEach(t=>{
    (t.deps||[]).forEach(depId=>{
      h+=buildDepLine(depId, t, tasks, rng.s, P);
    });
  });

  // Task bars
  tasks.forEach((t,i)=>{ h+=buildBar(t, i, rng.s, P); });

  // Today line
  const tx=diff(rng.s, today())*P;
  if(tx>=0 && tx<=svgW){
    h+=`<rect x="${tx-14}" y="4" width="28" height="16" rx="8" fill="var(--red)" opacity=".9"/>`;
    h+=`<text x="${tx}" y="16" text-anchor="middle" fill="white" font-size="9.5" font-family="DM Mono" font-weight="500">TODAY</text>`;
    h+=`<line x1="${tx}" y1="20" x2="${tx}" y2="${svgH}" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="5,4" opacity=".6"/>`;
  }

  barsSvg.innerHTML=h;

  // Bind drag on bars
  barsSvg.querySelectorAll('.svg-bar').forEach(el=>{
    el.addEventListener('mousedown',e=>{e.stopPropagation();selectTask(el.dataset.id);startDrag(e,el.dataset.id,'move');});
  });
  barsSvg.querySelectorAll('.svg-rsz').forEach(el=>{
    el.addEventListener('mousedown',e=>{e.stopPropagation();startDrag(e,el.dataset.id,'resize');});
  });
}

/* ===== BUILD AXIS SVG STRING ===== */
function buildAxis(startD, endD, P, svgW) {
  const scale=S.view.scale;
  let h=`<rect width="${svgW}" height="${AXIS_H}" fill="var(--s0)"/>`;
  let cur=startD;

  while(cur<=endD) {
    const d=pd(cur);
    const x=diff(startD,cur)*P;

    if(scale==='day') {
      // Weekend highlight
      if(d.getDay()===0||d.getDay()===6)
        h+=`<rect x="${x}" y="0" width="${P}" height="${AXIS_H}" fill="rgba(255,255,255,.022)"/>`;
      // Month label on 1st
      if(d.getDate()===1) {
        h+=`<rect x="${x}" y="0" width="1" height="${AXIS_H}" fill="var(--b2)" opacity=".6"/>`;
        h+=`<text x="${x+3}" y="16" fill="var(--t1)" font-size="10" font-family="DM Mono">${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}</text>`;
      }
      // Day numbers
      const dayStr=d.getDate()+'';
      const wkd=['日','一','二','三','四','五','六'][d.getDay()];
      const dim=d.getDay()===0||d.getDay()===6;
      h+=`<text x="${x+P/2}" y="${AXIS_H-14}" text-anchor="middle" fill="${dim?'var(--t3)':'var(--t2)'}" font-size="10" font-family="DM Mono">${wkd}</text>`;
      h+=`<text x="${x+P/2}" y="${AXIS_H-3}" text-anchor="middle" fill="${dim?'var(--t2)':'var(--t1)'}" font-size="11" font-family="DM Mono">${dayStr}</text>`;
      cur=addD(cur,1);
    } else if(scale==='week') {
      if(d.getDay()===1) {
        // Month label
        if(d.getDate()<=7)
          h+=`<text x="${x+3}" y="16" fill="var(--t2)" font-size="10" font-family="DM Mono">${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}</text>`;
        h+=`<line x1="${x}" y1="22" x2="${x}" y2="${AXIS_H}" stroke="var(--b2)" stroke-width="1" opacity=".5"/>`;
        h+=`<text x="${x+3}" y="${AXIS_H-4}" fill="var(--t1)" font-size="11" font-family="DM Mono">${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}</text>`;
      }
      cur=addD(cur,1);
    } else if(scale==='month') {
      if(d.getDate()===1) {
        if(d.getMonth()===0)
          h+=`<text x="${x+4}" y="16" fill="var(--t2)" font-size="10" font-family="DM Mono">${d.getFullYear()}</text>`;
        h+=`<rect x="${x}" y="0" width="1" height="${AXIS_H}" fill="var(--b2)" opacity=".5"/>`;
        const mnames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        h+=`<text x="${x+4}" y="${AXIS_H-4}" fill="var(--t1)" font-size="11" font-family="DM Mono">${mnames[d.getMonth()]}</text>`;
      }
      cur=addD(cur,1);
    } else { // quarter
      if(d.getDate()===1&&d.getMonth()%3===0) {
        const q=Math.floor(d.getMonth()/3)+1;
        h+=`<rect x="${x}" y="0" width="1" height="${AXIS_H}" fill="var(--b2)" opacity=".5"/>`;
        h+=`<text x="${x+4}" y="18" fill="var(--t2)" font-size="10" font-family="DM Mono">${d.getFullYear()}</text>`;
        h+=`<text x="${x+4}" y="${AXIS_H-4}" fill="var(--t1)" font-size="12" font-family="DM Mono">Q${q}</text>`;
      }
      cur=addD(cur,1);
    }
  }

  h+=`<line x1="0" y1="${AXIS_H-1}" x2="${svgW}" y2="${AXIS_H-1}" stroke="var(--b2)" stroke-width="1"/>`;
  return h;
}

/* ===== BUILD GRID ===== */
function buildGrid(startD, endD, P, svgH) {
  const scale=S.view.scale;
  let h=''; let cur=startD;
  while(cur<=endD) {
    const d=pd(cur), x=diff(startD,cur)*P;
    let draw=false;
    if(scale==='day'&&d.getDay()===1) draw=true;
    if(scale==='week'&&d.getDay()===1) draw=true;
    if(scale==='month'&&d.getDate()===1) draw=true;
    if(scale==='quarter'&&d.getDate()===1&&d.getMonth()%3===0) draw=true;
    if(draw) h+=`<line x1="${x}" y1="0" x2="${x}" y2="${svgH}" stroke="var(--b1)" stroke-width="1" opacity=".4"/>`;
    cur=addD(cur,1);
  }
  return h;
}

/* ===== BUILD TASK BAR ===== */
function buildBar(task, idx, startD, P) {
  if(!task.start) return '';
  const x=diff(startD,task.start)*P;
  const dur=task.duration||0;
  const w=Math.max(dur*P, dur===0?0:6);
  const y=idx*ROW_H;
  const bh=ROW_H-14;
  const by=y+7;
  const color=taskColor(task);
  const prog=task.progress||0;
  const sel=S.ui.selId===task.id;

  // Milestone diamond
  if(dur===0) {
    const cx=x, cy=by+bh/2;
    return `<g>
      <polygon class="svg-bar" data-id="${task.id}"
        points="${cx},${cy-9} ${cx+9},${cy} ${cx},${cy+9} ${cx-9},${cy}"
        fill="${color}" stroke="${sel?'#fff':color}" stroke-width="${sel?2:1}"
        opacity="${sel?1:.85}"/>
      <text x="${cx+13}" y="${cy+5}" fill="var(--t0)" font-size="11" font-family="Sora" pointer-events="none">◆ ${esc(task.name)}</text>
    </g>`;
  }

  let h='<g>';
  // Track (bg)
  h+=`<rect x="${x}" y="${by}" width="${w}" height="${bh}" rx="4" fill="${color}" opacity=".16"/>`;
  // Progress fill
  if(prog>0) {
    const pw=w*(prog/100);
    h+=`<rect x="${x}" y="${by}" width="${pw}" height="${bh}" rx="4" fill="${color}" opacity="${sel?.9:.72}"/>`;
    if(prog<100) h+=`<rect x="${x+pw-4}" y="${by}" width="4" height="${bh}" fill="${color}" opacity="${sel?.9:.72}"/>`;
  }
  // Border
  h+=`<rect x="${x}" y="${by}" width="${w}" height="${bh}" rx="4" fill="none" stroke="${color}" stroke-width="${sel?2:1.2}" opacity="${sel?1:.55}"/>`;
  // Selection glow
  if(sel) h+=`<rect x="${x-1}" y="${by-1}" width="${w+2}" height="${bh+2}" rx="5" fill="none" stroke="${color}" stroke-width="1" opacity=".25"/>`;
  // Label
  if(w>22) {
    const maxC=Math.floor((w-14)/7);
    const lbl=task.name.length>maxC?task.name.slice(0,maxC-1)+'…':task.name;
    h+=`<text x="${x+8}" y="${by+bh/2+4.5}" fill="rgba(255,255,255,.93)" font-size="11.5" font-family="Sora" font-weight="500" pointer-events="none">${esc(lbl)}</text>`;
  }
  // Progress % label (if bar wide enough and progress > 0)
  if(w>60&&prog>0) {
    const px=x+w*(prog/100);
    h+=`<text x="${Math.min(px-4,x+w-4)}" y="${by+bh/2+4}" text-anchor="end" fill="rgba(255,255,255,.6)" font-size="9.5" font-family="DM Mono" pointer-events="none">${prog}%</text>`;
  }
  // Drag handle (transparent overlay)
  h+=`<rect class="svg-bar" data-id="${task.id}" x="${x}" y="${by}" width="${Math.max(w-8,4)}" height="${bh}" rx="4" fill="transparent"/>`;
  // Resize handle
  if(w>12) h+=`<rect class="svg-rsz" data-id="${task.id}" x="${x+w-7}" y="${by+3}" width="6" height="${bh-6}" rx="3" fill="rgba(255,255,255,.22)"/>`;

  h+='</g>';
  return h;
}

/* ===== BUILD DEPENDENCY LINE ===== */
function buildDepLine(fromId, toTask, tasks, startD, P) {
  const from=tasks.find(t=>t.id===fromId);
  if(!from||!from.start||!toTask.start) return '';
  const fi=tasks.indexOf(from), ti=tasks.indexOf(toTask);
  const fx=diff(startD,from.start)*P + Math.max(from.duration||1,1)*P;
  const fy=fi*ROW_H+ROW_H/2;
  const tx=diff(startD,toTask.start)*P;
  const ty=ti*ROW_H+ROW_H/2;
  const ctrl=(fx+tx)/2;
  return `<path d="M ${fx} ${fy} C ${ctrl} ${fy} ${ctrl} ${ty} ${tx} ${ty}"
    fill="none" stroke="#555e7a" stroke-width="1.5" stroke-dasharray="5,3" opacity=".55"
    marker-end="url(#arr)"/>`;
}

/* ===== RENDER DETAIL PANEL ===== */
function renderPanel() {
  const panel=document.getElementById('detail-panel');
  panel.classList.toggle('open', S.ui.panelOpen);
  if(!S.ui.panelOpen||!S.ui.selId) return;
  const t=S.tasks.find(t=>t.id===S.ui.selId); if(!t) return;

  document.getElementById('dp-title').textContent=t.name||'任务详情';
  document.getElementById('d-name').value=t.name||'';
  document.getElementById('d-start').value=t.start||'';
  document.getElementById('d-dur').value=t.duration??7;
  document.getElementById('d-prog').value=t.progress||0;
  document.getElementById('d-pval').textContent=(t.progress||0)+'%';
  document.getElementById('d-group').value=t.group||'';
  const useColor=!!t.color;
  document.getElementById('d-usecolor').checked=useColor;
  document.getElementById('d-color').value=t.color||taskColor(t);
  document.getElementById('d-notes').value=t.notes||'';

  // Parent select
  const pSel=document.getElementById('d-parent');
  const others=S.tasks.filter(x=>x.id!==t.id&&!descendants(t.id).includes(x.id));
  pSel.innerHTML=`<option value="">无（顶级任务）</option>`+
    others.map(x=>`<option value="${x.id}"${x.id===t.parent?' selected':''}>${esc(x.name)}</option>`).join('');

  // Deps select
  const dSel=document.getElementById('d-deps');
  const depCandidates=S.tasks.filter(x=>x.id!==t.id);
  dSel.innerHTML=depCandidates.map(x=>`<option value="${x.id}"${(t.deps||[]).includes(x.id)?' selected':''}>${esc(x.name)}</option>`).join('');
}

/* ===== STATUS BAR ===== */
function updateSB() {
  document.getElementById('sb-tasks').textContent=S.tasks.length+' 个任务';
  if(S.tasks.length===0){ document.getElementById('sb-dur').textContent='项目跨度 0 天'; return; }
  const ss=S.tasks.map(t=>t.start).filter(Boolean);
  const ee=S.tasks.map(t=>t.start&&t.duration>0?addD(t.start,t.duration):t.start).filter(Boolean);
  if(ss.length&&ee.length) document.getElementById('sb-dur').textContent='项目跨度 '+diff(minD(ss),maxD(ee))+' 天';
}

/* ===== TOAST ===== */
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'), 2800);
}

/* ===== SCROLL SYNC ===== */
function setupSync() {
  const body=document.getElementById('gantt-body');
  const list=document.getElementById('task-list');
  const axis=document.getElementById('gantt-axis');
  let bsy=false,lsy=false;
  body.addEventListener('scroll',()=>{
    if(!lsy){ bsy=true; list.scrollTop=body.scrollTop; axis.scrollLeft=body.scrollLeft; bsy=false; }
  });
  list.addEventListener('scroll',()=>{
    if(!bsy){ lsy=true; body.scrollTop=list.scrollTop; lsy=false; }
  });
}

function scrollToToday() {
  const body=document.getElementById('gantt-body');
  const rng=dateRange();
  const P=ppd();
  const tx=diff(rng.s, today())*P;
  body.scrollLeft=Math.max(0, tx - body.clientWidth/2);
}

function syncScaleBtns() {
  document.querySelectorAll('#scale-tabs button').forEach(b=>b.classList.toggle('on',b.dataset.s===S.view.scale));
}

/* ===== BIND EVENTS ===== */
function bindEvents() {
  // Project name
  document.getElementById('project-name').addEventListener('input',e=>{
    S.project.name=e.target.value; save();
  });

  // Scale tabs
  document.querySelectorAll('#scale-tabs button').forEach(b=>{
    b.addEventListener('click',()=>{
      S.view.scale=b.dataset.s; syncScaleBtns(); render();
    });
  });

  // Zoom
  document.getElementById('zoom-out').addEventListener('click',()=>{
    S.view.zoom=Math.max(.25,+(S.view.zoom-.25).toFixed(2)); render();
  });
  document.getElementById('zoom-in').addEventListener('click',()=>{
    S.view.zoom=Math.min(5,+(S.view.zoom+.25).toFixed(2)); render();
  });

  // Today
  document.getElementById('today-btn').addEventListener('click',scrollToToday);

  // Add task
  document.getElementById('add-btn').addEventListener('click',()=>addTask());

  // Share
  document.getElementById('share-btn').addEventListener('click',exportURL);

  // Export JSON
  document.getElementById('exp-json').addEventListener('click',exportJSON);

  // Export PNG
  document.getElementById('exp-png').addEventListener('click',exportPNG);

  // Import
  document.getElementById('import-btn').addEventListener('click',()=>{
    document.getElementById('modal-ov').classList.remove('hidden');
    document.getElementById('modal-ta').value='';
    setTimeout(()=>document.getElementById('modal-ta').focus(),50);
  });

  // Modal
  document.getElementById('m-cancel').addEventListener('click',()=>document.getElementById('modal-ov').classList.add('hidden'));
  document.getElementById('m-ok').addEventListener('click',()=>{
    const raw=document.getElementById('modal-ta').value.trim();
    if(raw&&importData(raw)) document.getElementById('modal-ov').classList.add('hidden');
  });
  document.getElementById('modal-ov').addEventListener('click',e=>{
    if(e.target===e.currentTarget) document.getElementById('modal-ov').classList.add('hidden');
  });

  // File drag-drop import
  document.body.addEventListener('dragover',e=>e.preventDefault());
  document.body.addEventListener('drop',e=>{
    e.preventDefault();
    const f=e.dataTransfer?.files?.[0];
    if(f&&(f.name.endsWith('.json')||f.name.endsWith('.gantt.json'))){
      const r=new FileReader(); r.onload=ev=>importData(ev.target.result); r.readAsText(f);
    }
  });

  // Detail panel close
  document.getElementById('dp-close').addEventListener('click',()=>{
    S.ui.panelOpen=false; S.ui.selId=null; render();
  });

  // Progress slider live update
  document.getElementById('d-prog').addEventListener('input',e=>{
    document.getElementById('d-pval').textContent=e.target.value+'%';
  });

  // Add sub-task button
  document.getElementById('dp-sub').addEventListener('click',()=>{
    if(S.ui.selId) addTask(S.ui.selId);
  });

  // Detail save
  document.getElementById('dp-save').addEventListener('click',()=>{
    const id=S.ui.selId; if(!id) return;
    const useColor=document.getElementById('d-usecolor').checked;
    const depsRaw=Array.from(document.getElementById('d-deps').selectedOptions).map(o=>o.value);
    const deps=depsRaw.filter(dId=>!hasCycle(id,dId));
    if(deps.length<depsRaw.length) toast('⚠ 检测到依赖环，已自动移除');
    updateTask(id,{
      name: document.getElementById('d-name').value,
      start: document.getElementById('d-start').value,
      duration: parseInt(document.getElementById('d-dur').value)||0,
      progress: parseInt(document.getElementById('d-prog').value)||0,
      group: document.getElementById('d-group').value,
      color: useColor?document.getElementById('d-color').value:null,
      parent: document.getElementById('d-parent').value||null,
      deps, notes: document.getElementById('d-notes').value
    });
    toast('✓ 已保存');
  });

  // Detail delete
  document.getElementById('dp-del').addEventListener('click',()=>{
    if(confirm('确认删除此任务'+(hasKids(S.ui.selId)?'及其所有子任务':'')+'？'))
      deleteTask(S.ui.selId);
  });

  // Global drag
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);

  // Keyboard
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&S.ui.panelOpen){ S.ui.panelOpen=false; S.ui.selId=null; render(); }
    if((e.ctrlKey||e.metaKey)&&e.key==='n'){ e.preventDefault(); addTask(); }
    if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); save(); toast('✓ 已保存'); }
  });
}

/* ===== INIT ===== */
function init() {
  // 1. Try URL param
  const params=new URLSearchParams(location.search);
  const d=params.get('d');
  if(d) {
    try {
      const data=JSON.parse(LZString.decompressFromEncodedURIComponent(d));
      if(data.tasks){ S.project=data.project||S.project; S.tasks=data.tasks; S.view={...S.view,...(data.view||{})}; }
    } catch(e){}
  } else {
    // 2. Try localStorage
    const saved=load();
    if(saved){ S.project=saved.project||S.project; S.tasks=saved.tasks||[]; S.view={...S.view,...(saved.view||{})}; }
  }

  S.ui.collapsed=new Set();
  syncScaleBtns();
  setupSync();
  bindEvents();
  render();
  setTimeout(scrollToToday, 120);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
