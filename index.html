<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acid / PaRr0tBoY</title>

<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg-h:#1d2021;--bg-0:#282828;--bg-1:#32302f;--bg-2:#3c3836;--bg-3:#45403d;--bg-4:#504945;
    --fg-0:#d4be98;--fg-1:#ddc7a1;--fg-3:#bdae93;
    --gray:#a89984;--red:#ea6962;--orange:#e78a4e;--yellow:#d8a657;
    --green:#a9b665;--aqua:#89b482;--blue:#7daea3;--purple:#d3869b;
    --r:8px;--rl:12px;
  }
  body{font-family:"Noto Sans SC","Source Han Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg-h);color:var(--fg-0);line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:48px 24px}
  /* profile */
  .profile{display:flex;align-items:center;gap:24px;margin-bottom:32px}
  .avatar{width:72px;height:72px;border-radius:50%;background:var(--bg-1);border:2px solid var(--bg-3);overflow:hidden;flex-shrink:0}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .avatar-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--gray);font-size:1.4rem}
  .profile-info h1{font-size:1.5rem;font-weight:600;color:var(--fg-1);letter-spacing:-0.02em;line-height:1.2}
  .handle{color:var(--blue);font-size:0.8rem;font-family:"JetBrains Mono",monospace}
  .bio{color:var(--fg-3);font-size:0.88rem;margin-top:8px;line-height:1.7}
  .bio strong{color:var(--fg-1);font-weight:500}
  .bio .pr{color:var(--purple)}
  /* socials */
  .socials{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--bg-2)}
  .socials a{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;background:var(--bg-0);border:1px solid var(--bg-2);color:var(--fg-3);font-size:0.8rem;text-decoration:none;transition:background .15s,border-color .15s,color .15s}
  .socials a:hover{background:var(--bg-1);border-color:var(--bg-4);color:var(--fg-1)}
  .socials a svg{width:14px;height:14px;flex-shrink:0}
  /* bento */
  .bento{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px}
  .cell{background:var(--bg-0);border:1px solid var(--bg-2);border-radius:var(--rl);overflow:hidden;transition:border-color .2s}
  .cell:hover{border-color:var(--bg-4)}
  .c-building{grid-column:span 4}
  .c-tools{grid-column:span 2;min-height:280px}
  .c-blog{grid-column:span 2}
  .c-product{grid-column:span 4}
  .cell-h{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;border-bottom:1px solid var(--bg-1)}
  .cell-h h2{font-size:0.78rem;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--gray)}
  .cell-h .ct{font-size:0.7rem;color:var(--bg-4);font-family:"JetBrains Mono",monospace}
  .cell-b{padding:12px 16px 16px}
  /* building */
  .b-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
  .p-chip{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:var(--r);background:var(--bg-1);border:1px solid transparent;transition:border-color .15s,background .15s}
  .p-chip:hover{border-color:var(--bg-3);background:var(--bg-h)}
  .p-n{font-size:0.84rem;font-weight:500;color:var(--fg-1);display:flex;align-items:center;gap:6px}
  .p-dot{width:6px;height:6px;border-radius:50%;background:var(--yellow);flex-shrink:0;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  .p-d{font-size:0.74rem;color:var(--gray);line-height:1.5}
  .p-l{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .p-l a{font-size:0.7rem;color:var(--blue);text-decoration:none;padding:1px 6px;border-radius:3px;border:1px solid var(--bg-2);transition:background .12s,border-color .12s}
  .p-l a:hover{background:var(--bg-1);border-color:var(--blue)}
  /* tools */
  .t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .t-chip{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r);background:var(--bg-1);border:1px solid transparent;text-decoration:none;color:inherit;transition:background .12s,border-color .12s;cursor:pointer}
  .t-chip:hover{background:var(--bg-h);border-color:var(--bg-3)}
  .t-ico{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--bg-2);border-radius:6px;font-size:.78rem;flex-shrink:0}
  .t-n{font-size:0.78rem;font-weight:500;color:var(--fg-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* blog */
  .blog-list{list-style:none}
  .blog-item{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--bg-1);cursor:pointer;transition:background .12s}
  .blog-item:last-child{border-bottom:none}
  .blog-item:hover{background:var(--bg-1)}
  .b-m{width:4px;height:4px;border-radius:50%;background:var(--aqua);flex-shrink:0}
  .b-n{flex:1;font-size:0.82rem;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .blog-item:hover .b-n{color:var(--fg-1)}
  .b-a{color:var(--bg-4);font-size:0.72rem;opacity:0;transition:opacity .15s;flex-shrink:0}
  .blog-item:hover .b-a{opacity:1}
  /* product dir */
  .pd{display:flex;gap:12px;flex-wrap:wrap}
  .pd a{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r);background:var(--bg-1);border:1px solid var(--bg-2);text-decoration:none;color:inherit;transition:background .12s,border-color .12s}
  .pd a:hover{background:var(--bg-h);border-color:var(--bg-4)}
  .pd .pi{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:.8rem}
  .pd .pn{font-size:0.82rem;color:var(--fg-1);font-weight:500}
  .pd .pdesc{font-size:0.72rem;color:var(--gray)}
  /* footer */
  footer{padding-top:24px;border-top:1px solid var(--bg-2);color:var(--bg-4);font-size:0.72rem;text-align:center;font-family:"JetBrains Mono",monospace}
  footer a{color:var(--blue);text-decoration:none}
  footer a:hover{text-decoration:underline}
  /* responsive */
  @media(max-width:640px){
    .wrap{padding:32px 16px}
    .profile{flex-direction:column;align-items:flex-start;gap:16px}
    .avatar{width:56px;height:56px}
    .bento{grid-template-columns:1fr}
    .c-building,.c-tools,.c-blog,.c-product{grid-column:span 1}
    .c-tools{min-height:auto}
    .b-grid,.t-grid{grid-template-columns:1fr 1fr}
  }
  @media(max-width:400px){.b-grid,.t-grid{grid-template-columns:1fr}}
</style>
</head>

<script>
const PRODUCTS=[{n:"Volante",d:"Vivaldi 浏览器 CSS/JS 整合包",l:[{t:"Landing",h:"/product/volante/landing/"},{t:"Docs",h:"/product/volante/doc/"},{t:"GitHub",h:"https://github.com/PaRr0tBoY/Awesome-Vivaldi"}]},{n:"Techne",d:"个人技能仓库 · 工具与工作流",l:[{t:"Landing",h:"/product/techne/landing/"}]},{n:"Trace",d:"工作空间 · 项目管理与协作",l:[]},{n:"Plateau",d:"学习工作台 · 笔记与知识管理",l:[]},{n:"Polaris",d:"机械工程领域的编码 Agent",l:[]}];
