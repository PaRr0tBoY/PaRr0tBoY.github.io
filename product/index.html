  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: #0d0d0d;
      color: #e4e4e7;
      min-height: 100vh;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 48px 24px; }

      display: block;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #27272a;
      text-decoration: none;
      color: inherit;
      margin-bottom: 16px;
      transition: border-color 0.15s, background 0.15s;
    }
    .card:hover { border-color: #3f3f46; background: #18181b; }
    .card h2 { font-size: 1.1rem; font-weight: 600; color: #fafafa; margin-bottom: 4px; }
    .card .desc { font-size: 0.85rem; color: #71717a; margin-bottom: 12px; }
    .card .links { display: flex; gap: 12px; flex-wrap: wrap; }
    .card .links a {
      font-size: 0.8rem;
      color: #f97316;
      text-decoration: none;
      padding: 3px 10px;
      border-radius: 4px;
      border: 1px solid #3f3f46;
    }
    .card .links a:hover { background: #27272a; border-color: #f97316; }
    .empty { color: #52525b; font-size: 0.9rem; padding: 20px 0; }
  </style>
</head>
